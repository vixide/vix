  pt: "Insere um ZID de 256 bits como 64 dígitos hexadecimais."
  ru: "Вставляет 256-битный ZID в виде 64 шестнадцатеричных цифр."
  ar: "يُدرج ZID بحجم 256 بت في صورة 64 رقمًا ست عشريًا."
