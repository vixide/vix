  bn: "Org নথিকে একটি নতুন ট্যাবে একটি স্বতন্ত্র LaTeX প্রবন্ধে রূপান্তর করে।"
  zh: "在新标签页中将 Org 文档转换为独立的 LaTeX 文章。"
  ja: "Org ドキュメントを新しいタブで独立した LaTeX 記事に変換します。"
