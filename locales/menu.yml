menu.item.org.set_tags.help:
  en: "Set the headline's tags, completing from tags already used in the file."
  es: "Establece las etiquetas del encabezado, autocompletando desde las etiquetas ya usadas en el archivo."
  fr: "Définit les étiquettes du titre, avec complétion à partir des étiquettes déjà utilisées dans le fichier."
  de: "Legt die Tags der Überschrift fest, mit Vervollständigung aus bereits in der Datei verwendeten Tags."
  cy: "Gosod tagiau'r pennawd, gan gwblhau o dagiau a ddefnyddiwyd eisoes yn y ffeil."
  ga: "Socraíonn sé clibeanna an cheannteidil, ag comhlánú ó chlibeanna atá in úsáid cheana féin sa chomhad."
  gd: "Suidhichidh seo tagaichean a' bhann-chinn, a' co-lìonadh o thagaichean a chaidh a chleachdadh mu thràth san fhaidhle."
  pl: "Ustawia znaczniki nagłówka, uzupełniając na podstawie znaczników już użytych w pliku."
  pt: "Define as etiquetas do cabeçalho, autocompletando a partir das etiquetas já usadas no arquivo."
  ru: "Задаёт теги заголовка с автодополнением по тегам, уже использованным в файле."
  ar: "يعيّن وسوم العنوان، مع الإكمال التلقائي من الوسوم المستخدمة بالفعل في الملف."
  hi: "शीर्षक के टैग सेट करता है, फ़ाइल में पहले से उपयोग किए गए टैग से पूर्णता प्रदान करते हुए।"
  bn: "হেডিংয়ের ট্যাগ সেট করে, ফাইলে ইতিমধ্যে ব্যবহৃত ট্যাগ থেকে কমপ্লিশন প্রদান করে।"
  zh: "设置标题的标签,并根据文件中已使用过的标签提供自动补全。"
  ja: "見出しのタグを設定します。ファイル内で既に使われているタグから補完します。"
