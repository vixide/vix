menu.item.project.configure.help:
  en: "Run this project type's configure command (prepares it to build)."
  es: "Ejecuta el comando de configuración de este tipo de proyecto (lo prepara para compilar)."
  fr: "Exécute la commande de configuration de ce type de projet (le prépare à la compilation)."
  de: "Führt den Konfigurationsbefehl dieses Projekttyps aus (bereitet ihn für den Build vor)."
  cy: "Rhedeg gorchymyn ffurfweddu'r math hwn o brosiect (ei baratoi i adeiladu)."
  ga: "Rith ordú cumraíochta an chineáil tionscadail seo (á ullmhú le tógáil)."
  gd: "Ruith àithne rèiteachaidh an t-seòrsa phròiseict seo (ga ullachadh airson togail)."
