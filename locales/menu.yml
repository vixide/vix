menu.item.org.table.rectangle.copy.help:
  en: "Copy the selected cell rectangle (or just the current field) to the table rectangle clipboard."
  es: "Copia el rectángulo de celdas seleccionado (o solo el campo actual) al portapapeles de rectángulos de la tabla."
  fr: "Copie le rectangle de cellules sélectionné (ou juste le champ actuel) dans le presse-papiers de rectangles du tableau."
  de: "Kopiert das ausgewählte Zellrechteck (oder nur das aktuelle Feld) in die Rechteck-Zwischenablage der Tabelle."
  cy: "Copïo'r petryal celloedd a ddewiswyd (neu'r maes cyfredol yn unig) i'r clipfwrdd petryal tabl."
  ga: "Cóipeáil an dronuilleog cealla roghnaithe (nó an réimse reatha amháin) go dtí gearrthaisce dronuilleog an tábla."
  gd: "Dèan lethbhreac den cheart-cheàrnach cheallan a thagh thu (no dìreach an raon làithreach) gu clipbòrd ceart-cheàrnach a' chlàir."
  pl: "Kopiuje zaznaczony prostokąt komórek (lub tylko bieżące pole) do schowka prostokątów tabeli."
  pt: "Copia o retângulo de células selecionado (ou apenas o campo atual) para a área de transferência de retângulos da tabela."
  ru: "Копирует выделенный прямоугольник ячеек (или только текущее поле) в буфер обмена прямоугольников таблицы."
  ar: "ينسخ مستطيل الخلايا المحدد (أو الحقل الحالي فقط) إلى حافظة مستطيلات الجدول."
  hi: "चयनित कोशिका आयत (या केवल वर्तमान फ़ील्ड) को तालिका आयत क्लिपबोर्ड में कॉपी करता है।"
  bn: "নির্বাচিত কোষ আয়তক্ষেত্র (বা শুধু বর্তমান ফিল্ড) টেবিল আয়তক্ষেত্র ক্লিপবোর্ডে কপি করে।"
  zh: "将选中的单元格矩形(或仅当前字段)复制到表格矩形剪贴板。"
  ja: "選択したセル矩形(または現在のフィールドのみ)をテーブル矩形クリップボードにコピーします。"
