menu.item.org.table.help:
  en: "Org's built-in pipe-table editor: alignment, field/row/column edits, sort, sums, and TBLFM formulas."
  es: "El editor de tablas integrado de Org: alineación, edición de campos/filas/columnas, ordenación, sumas y fórmulas TBLFM."
  fr: "L'éditeur de tableaux intégré d'Org : alignement, modification de champs/lignes/colonnes, tri, sommes et formules TBLFM."
  de: "Der integrierte Tabelleneditor von Org: Ausrichtung, Bearbeitung von Feldern/Zeilen/Spalten, Sortierung, Summen und TBLFM-Formeln."
  cy: "Golygydd tablau adeiledig Org: alinio, golygu meysydd/rhesi/colofnau, trefnu, symiau, a fformiwlâu TBLFM."
  ga: "Eagarthóir táblaí ionsuite Org: ailíniú, cur in eagar réimsí/rónna/colún, sórtáil, suimeanna, agus foirmlí TBLFM."
  gd: "An deasaiche chlàran ionadail aig Org: co-thaobhadh, deasachadh raointean/sreathan/colbhan, seòrsachadh, suimean, agus foirmlean TBLFM."
  pl: "Wbudowany edytor tabel Org: wyrównanie, edycja pól/wierszy/kolumn, sortowanie, sumy i formuły TBLFM."
  pt: "O editor de tabelas incorporado do Org: alinhamento, edição de campos/linhas/colunas, ordenação, somas e fórmulas TBLFM."
  ru: "Встроенный редактор таблиц Org: выравнивание, редактирование полей/строк/столбцов, сортировка, суммы и формулы TBLFM."
  ar: "محرر الجداول المدمج في Org: المحاذاة، وتعديل الحقول/الصفوف/الأعمدة، والفرز، والمجاميع، وصيغ TBLFM."
  hi: "Org का अंतर्निहित तालिका संपादक: संरेखण, फ़ील्ड/पंक्ति/कॉलम संपादन, क्रमबद्धता, योग, और TBLFM सूत्र।"
  bn: "Org-এর অন্তর্নির্মিত টেবিল সম্পাদক: প্রান্তিককরণ, ফিল্ড/সারি/কলাম সম্পাদনা, সাজানো, সমষ্টি, এবং TBLFM সূত্র।"
  zh: "Org 内置的表格编辑器:对齐、字段/行/列编辑、排序、求和以及 TBLFM 公式。"
  ja: "Org 組み込みのテーブルエディタ — 整列、フィールド/行/列の編集、並べ替え、合計、TBLFM 数式に対応します。"
