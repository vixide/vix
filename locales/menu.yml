menu.item.org.links.insert.help:
  en: "Insert a link, offering the stored link and completion for [[ targets."
  es: "Inserta un enlace, ofreciendo el enlace almacenado y autocompletado para objetivos [[."
  fr: "Insère un lien, en proposant le lien stocké et la complétion pour les cibles [[."
  de: "Fügt einen Link ein und bietet dabei den gespeicherten Link sowie Vervollständigung für [[-Ziele an."
  cy: "Mewnosod dolen, gan gynnig y ddolen a storiwyd a chwblhau ar gyfer targedau [[."
  ga: "Ionsáigh nasc, ag tairiscint an naisc stóráilte agus comhlánú do spriocanna [[."
  gd: "Cuir a-steach ceangal, a' tabhann a' cheangail a chaidh a stòradh agus co-lìonadh airson targaidean [[."
  pl: "Wstawia łącze, oferując zapisane łącze i uzupełnianie dla celów [[."
  pt: "Insere um link, oferecendo o link armazenado e a autocompletar para alvos [[."
  ru: "Вставляет ссылку, предлагая сохранённую ссылку и автодополнение для целей [[."
  ar: "يُدرج رابطًا، مع تقديم الرابط المخزَّن وإكمال تلقائي للأهداف [[."
  hi: "एक लिंक सम्मिलित करता है, संग्रहित लिंक और [[ लक्ष्यों के लिए पूर्णता प्रदान करता है।"
  bn: "একটি লিঙ্ক সন্নিবেশ করে, সংরক্ষিত লিঙ্ক ও [[ লক্ষ্যের জন্য কমপ্লিশন প্রদান করে।"
  zh: "插入链接,并为 [[ 目标提供已存储的链接和自动补全。"
  ja: "リンクを挿入し、保存済みのリンクと [[ ターゲットの補完を提示します。"
