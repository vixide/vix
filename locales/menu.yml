menu.name.iso8601.help:
  en: "Insert the current date and time in ISO 8601 format."
  es: "Inserta la fecha y hora actuales en formato ISO 8601."
  fr: "Insère la date et l'heure actuelles au format ISO 8601."
  de: "Fügt das aktuelle Datum und die Uhrzeit im ISO-8601-Format ein."
  cy: "Mewnosod y dyddiad a'r amser cyfredol yn fformat ISO 8601."
  ga: "Ionsáigh an dáta agus an t-am reatha i bhformáid ISO 8601."
  gd: "Cuir a-steach an ceann-latha 's an t-àm làithreach ann an cruth ISO 8601."
  pl: "Wstawia bieżącą datę i godzinę w formacie ISO 8601."
  pt: "Insere a data e a hora atuais no formato ISO 8601."
  ru: "Вставляет текущие дату и время в формате ISO 8601."
  ar: "يُدرج التاريخ والوقت الحاليين بصيغة ISO 8601."
  hi: "वर्तमान दिनांक और समय ISO 8601 प्रारूप में डालें।"
  bn: "বর্তমান তারিখ ও সময় ISO 8601 বিন্যাসে সন্নিবেশ করুন।"
  zh: "以 ISO 8601 格式插入当前日期和时间。"
  ja: "現在の日時を ISO 8601 形式で挿入します。"
