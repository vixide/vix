menu.item.org.dates.schedule.help:
  en: "Set a SCHEDULED date on the headline — the day to start work."
  es: "Establece una fecha SCHEDULED en el encabezado — el día para empezar el trabajo."
  fr: "Définit une date SCHEDULED sur le titre — le jour où commencer le travail."
  de: "Setzt ein SCHEDULED-Datum für die Überschrift — den Tag, an dem die Arbeit beginnt."
  cy: "Gosod dyddiad SCHEDULED ar y pennawd — y diwrnod i ddechrau'r gwaith."
  ga: "Socraigh dáta SCHEDULED ar an gceannteideal — an lá a thosaítear ag obair air."
  gd: "Suidhich ceann-latha SCHEDULED air a' cheann-sgrìobhaidh — an latha a thòisicheas an obair."
  pl: "Ustawia datę SCHEDULED nagłówka — dzień rozpoczęcia pracy."
  pt: "Define uma data SCHEDULED no cabeçalho — o dia para começar o trabalho."
  ru: "Задаёт дату SCHEDULED для заголовка — день начала работы."
  ar: "يضبط تاريخ SCHEDULED على العنوان — اليوم الذي يبدأ فيه العمل."
  hi: "शीर्षक पर SCHEDULED तिथि सेट करें — काम शुरू करने का दिन।"
  bn: "শিরোনামে একটি SCHEDULED তারিখ সেট করুন — কাজ শুরু করার দিন।"
  zh: "在标题上设置 SCHEDULED 日期——开始工作的日子。"
  ja: "見出しに SCHEDULED 日付を設定します。作業を開始する日です。"
