  es: "Abre comandos para desplazarse por párrafos."
  fr: "Ouvrir les commandes pour se déplacer par paragraphes."
  de: "Befehle zum absatzweisen Navigieren öffnen."
  cy: "Agor gorchmynion i symud fesul paragraff."
  ga: "Oscail orduithe chun bogadh de réir alt."
