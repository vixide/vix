  ar: "ينسخ الشجرة الفرعية عند المؤشر، العنوان والمحتوى معًا."
  hi: "कर्सर पर उपवृक्ष कॉपी करें, शीर्षक और मुख्य भाग एक साथ।"
  bn: "কার্সারে সাবট্রি অনুলিপি করে, শিরোনাম ও মূল অংশ একসাথে।"
