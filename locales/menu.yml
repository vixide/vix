menu.item.org.links.store.help:
  en: "Store a link to this location, ready to insert somewhere else."
  es: "Almacena un enlace a esta ubicación, listo para insertarlo en otro lugar."
  fr: "Stocke un lien vers cet emplacement, prêt à être inséré ailleurs."
  de: "Speichert einen Link zu diesem Ort, bereit zum Einfügen an anderer Stelle."
  cy: "Storio dolen i'r lleoliad hwn, yn barod i'w mewnosod yn rhywle arall."
  ga: "Stórálann sé nasc chuig an suíomh seo, réidh le hionsá in áit eile."
  gd: "Stòraidh seo ceangal don àite seo, deiseil airson a chur a-steach an àiteigin eile."
  pl: "Zapisuje łącze do tej lokalizacji, gotowe do wstawienia gdzie indziej."
  pt: "Armazena um link para este local, pronto para ser inserido em outro lugar."
  ru: "Сохраняет ссылку на это место, готовую для вставки в другом месте."
  ar: "يخزّن رابطًا لهذا الموضع، جاهزًا لإدراجه في مكان آخر."
  hi: "इस स्थान का लिंक संग्रहित करता है, कहीं और सम्मिलित करने के लिए तैयार।"
  bn: "এই অবস্থানের একটি লিঙ্ক সংরক্ষণ করে, অন্য কোথাও সন্নিবেশ করার জন্য প্রস্তুত।"
  zh: "存储指向此位置的链接,以便随时插入到别处。"
  ja: "この場所へのリンクを、別の場所に挿入できるよう保存します。"
