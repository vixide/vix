menu.item.tools.insert.datetime.epoch.help:
  en: "Insert the current time as a Unix epoch timestamp."
  es: "Inserta la hora actual como marca de tiempo Unix epoch."
  fr: "Insère l'heure actuelle sous forme d'horodatage Unix epoch."
  de: "Fügt die aktuelle Zeit als Unix-Epoch-Zeitstempel ein."
  cy: "Mewnosod yr amser cyfredol fel stamp amser Unix epoch."
  ga: "Ionsáigh an t-am reatha mar stampa ama Unix epoch."
  gd: "Cuir a-steach an t-àm làithreach mar stampa-ama Unix epoch."
  pl: "Wstawia bieżący czas jako znacznik czasu Unix epoch."
  pt: "Insere a hora atual como carimbo de data/hora Unix epoch."
  ru: "Вставляет текущее время как метку времени Unix epoch."
  ar: "يُدرج الوقت الحالي كطابع زمني Unix epoch."
  hi: "वर्तमान समय को Unix epoch टाइमस्टैम्प के रूप में डालें।"
  bn: "বর্তমান সময় একটি Unix epoch টাইমস্ট্যাম্প হিসেবে সন্নিবেশ করুন।"
  zh: "将当前时间作为 Unix epoch 时间戳插入。"
  ja: "現在時刻を Unix epoch タイムスタンプとして挿入します。"
