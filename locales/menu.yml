menu.item.org.dates.up.help:
  en: "Shift the timestamp at the cursor one day later."
  es: "Desplaza la marca de tiempo en el cursor un día después."
  fr: "Décale l'horodatage sous le curseur d'un jour plus tard."
  de: "Verschiebt den Zeitstempel an der Cursorposition um einen Tag nach vorn."
  cy: "Symud y marc amser wrth y cyrchwr un diwrnod yn hwyrach."
  ga: "Bog an stampa ama ag an gcúrsóir lá amháin níos déanaí."
  gd: "Gluais an stampa-ama aig a' chùrsair aon latha nas fhaide air adhart."
  pl: "Przesuwa znacznik czasu przy kursorze o jeden dzień później."
  pt: "Desloca a marca de tempo no cursor um dia depois."
  ru: "Сдвигает временную метку у курсора на один день вперёд."
  ar: "يزيح الطابع الزمني عند المؤشر يومًا واحدًا للأمام."
  hi: "कर्सर पर टाइमस्टैंप को एक दिन आगे खिसकाएँ।"
  bn: "কার্সারে টাইমস্ট্যাম্পটি এক দিন পরে সরান।"
  zh: "将光标处的时间戳后移一天。"
  ja: "カーソル位置のタイムスタンプを1日後にずらします。"
