menu.item.org.column_view_export.help:
  en: "Tabulate every headline's TODO state, priority, and tags in a new tab."
  es: "Tabula el estado TODO, la prioridad y las etiquetas de cada encabezado en una pestaña nueva."
  fr: "Tabule l'état TODO, la priorité et les étiquettes de chaque titre dans un nouvel onglet."
  de: "Tabelliert den TODO-Status, die Priorität und die Tags jeder Überschrift in einem neuen Tab."
  cy: "Tablu cyflwr TODO, blaenoriaeth, a thagiau pob pennawd mewn Tab Newydd."
  ga: "Táblaigh staid TODO, tosaíocht, agus clibeanna gach ceannteidil i gCluaisín Nua."
  gd: "Cuir staid TODO, prìomhachas, agus tagaichean gach ceann-sgrìobhaidh ann an clàr, ann an Taba Ùr."
  pl: "Zestawia w tabeli stan TODO, priorytet i tagi każdego nagłówka w nowej karcie."
  pt: "Tabula o estado TODO, a prioridade e as etiquetas de cada título em uma nova aba."
  ru: "Табулирует состояние TODO, приоритет и теги каждого заголовка в новой вкладке."
  ar: "يجدول حالة TODO والأولوية والوسوم لكل عنوان في علامة تبويب جديدة."
  hi: "हर शीर्षक की TODO स्थिति, प्राथमिकता, और टैग्स को एक नए टैब में सारणीबद्ध करता है।"
  bn: "প্রতিটি শিরোনামের TODO অবস্থা, অগ্রাধিকার এবং ট্যাগ একটি নতুন ট্যাবে টেবুলেট করে।"
  zh: "在新标签页中将每个标题的 TODO 状态、优先级和标签制成表格。"
  ja: "各見出しの TODO 状態、優先度、タグを新しいタブに表にします。"
