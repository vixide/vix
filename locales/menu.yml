  ru: "Повторно запускает последнюю выполненную команду проекта любого вида."
  ar: "يعيد تشغيل أحدث أمر مشروع تم تنفيذه، من أي نوع."
  hi: "किसी भी प्रकार का सबसे हाल ही में चलाया गया प्रोजेक्ट कमांड फिर से चलाएँ।"
  bn: "যেকোনো ধরনের সাম্প্রতিকতম চালানো প্রকল্প কমান্ড আবার চালান।"
