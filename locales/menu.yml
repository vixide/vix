  hi: "केवल कर्सर के नीचे वाला टेस्ट चलाएँ। गति के लिए कोई पुष्टि संकेत नहीं।"
  bn: "শুধু কার্সারের নিচের টেস্টটি চালান। গতির জন্য কোনো নিশ্চিতকরণ প্রম্পট নেই।"
