menu.item.org.table.rectangle.paste.help:
  en: "Paste the table rectangle clipboard with its upper-left cell at the cursor."
  es: "Pega el portapapeles de rectángulos de la tabla con su celda superior izquierda en el cursor."
  fr: "Colle le presse-papiers de rectangles du tableau avec sa cellule supérieure gauche au curseur."
  de: "Fügt die Rechteck-Zwischenablage der Tabelle ein, wobei ihre obere linke Zelle an der Cursorposition liegt."
  cy: "Gludo clipfwrdd petryal y tabl gyda'i gell chwith uchaf wrth y cyrchwr."
  ga: "Greamaigh gearrthaisce dronuilleog an tábla lena chill uachtarach clé ag an gcúrsóir."
  gd: "Cuir clipbòrd ceart-cheàrnach a' chlàir ann leis a' chill aige gu h-àrd air an taobh chlì aig an chùrsair."
  pl: "Wkleja schowek prostokątów tabeli, umieszczając jego lewą górną komórkę w miejscu kursora."
  pt: "Cola a área de transferência de retângulos da tabela com sua célula superior esquerda no cursor."
  ru: "Вставляет буфер обмена прямоугольников таблицы так, что его верхняя левая ячейка оказывается в позиции курсора."
  ar: "يلصق حافظة مستطيلات الجدول بحيث تكون خليتها العلوية اليسرى عند المؤشر."
  hi: "तालिका आयत क्लिपबोर्ड को इस तरह चिपकाता है कि उसकी ऊपरी-बाईं कोशिका कर्सर पर हो।"
  bn: "টেবিল আয়তক্ষেত্র ক্লিপবোর্ড আটকায়, যাতে এর উপরের-বাম কোষটি কার্সরে থাকে।"
  zh: "粘贴表格矩形剪贴板,使其左上角单元格位于光标处。"
  ja: "テーブル矩形クリップボードを、その左上セルがカーソル位置に来るように貼り付けます。"
