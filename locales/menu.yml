menu.item.org.agenda.lock.help:
  en: "Restrict every agenda view to the current file until the lock is removed."
  es: "Restringe toda vista de agenda al archivo actual hasta que se elimine el bloqueo."
  fr: "Restreint chaque vue de l'agenda au fichier actuel jusqu'à la suppression du verrou."
  de: "Beschränkt jede Agendaansicht auf die aktuelle Datei, bis die Sperre entfernt wird."
  cy: "Cyfyngu pob golwg agenda i'r ffeil gyfredol nes tynnu'r clo."
  ga: "Srian gach amharc cláir oibre don chomhad reatha go dtí go mbainfear an glas."
  gd: "Bac a h-uile sealladh clàir-ghnothaich chun an fhaidhle làithreach gus an tèid an glas a thoirt air falbh."
  pl: "Ogranicza każdy widok agendy do bieżącego pliku, dopóki blokada nie zostanie usunięta."
  pt: "Restringe cada vista de agenda ao arquivo atual até que o bloqueio seja removido."
  ru: "Ограничивает каждое представление повестки текущим файлом, пока блокировка не будет снята."
  ar: "تقييد كل عرض لجدول الأعمال بالملف الحالي حتى تتم إزالة القفل."
  hi: "जब तक लॉक हटाया न जाए, हर एजेंडा दृश्य को वर्तमान फ़ाइल तक सीमित रखें।"
  bn: "লক অপসারণ না হওয়া পর্যন্ত প্রতিটি এজেন্ডা ভিউ বর্তমান ফাইলে সীমাবদ্ধ রাখুন।"
  zh: "在锁定被移除之前，将每个日程视图限制为当前文件。"
  ja: "ロックが解除されるまで、すべてのアジェンダビューを現在のファイルに制限します。"
