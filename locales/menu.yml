  pl: "Otwórz polecenia do przechodzenia między akapitami."
  pt: "Abrir comandos para mover-se por parágrafos."
  ru: "Открыть команды для перехода по абзацам."
  ar: "فتح أوامر للانتقال بين الفقرات."
  hi: "अनुच्छेदों के अनुसार जाने के आदेश खोलें।"
