menu.item.org.agenda.todo.help:
  en: "List every TODO across the agenda files, whatever its date."
  es: "Enumera todos los TODO de los archivos de agenda, sea cual sea su fecha."
  fr: "Répertorie tous les TODO dans les fichiers de l'agenda, quelle que soit leur date."
  de: "Listet jedes TODO über alle Agendadateien auf, unabhängig vom Datum."
  cy: "Rhestra bob TODO ar draws ffeiliau'r agenda, ni waeth beth yw ei ddyddiad."
  ga: "Liostaigh gach TODO trasna comhaid an chláir oibre, is cuma cén dáta."
  gd: "Liostaich a h-uile TODO tarsainn faidhlichean a' chlàir-ghnothaich, ge bith dè an ceann-latha."
  pl: "Wyświetla wszystkie TODO ze wszystkich plików agendy, niezależnie od daty."
  pt: "Lista todos os TODO nos arquivos da agenda, qualquer que seja a data."
  ru: "Перечисляет все TODO по всем файлам повестки, независимо от даты."
  ar: "سرد كل TODO عبر ملفات جدول الأعمال، بغض النظر عن تاريخه."
  hi: "उसकी तिथि चाहे जो भी हो, एजेंडा फ़ाइलों में हर TODO सूचीबद्ध करें।"
  bn: "তারিখ যাই হোক না কেন, এজেন্ডা ফাইল জুড়ে প্রতিটি TODO তালিকাভুক্ত করুন।"
  zh: "列出日程文件中所有的 TODO，无论日期为何。"
  ja: "日付を問わず、アジェンダファイル全体のすべての TODO を一覧表示します。"
