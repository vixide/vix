menu.item.org.table.rectangle.cut.help:
  en: "Copy the selected cell rectangle to the table rectangle clipboard and blank it in place."
  es: "Copia el rectángulo de celdas seleccionado al portapapeles de rectángulos de la tabla y lo vacía en su sitio."
  fr: "Copie le rectangle de cellules sélectionné dans le presse-papiers de rectangles du tableau et le vide sur place."
  de: "Kopiert das ausgewählte Zellrechteck in die Rechteck-Zwischenablage der Tabelle und leert es an Ort und Stelle."
  cy: "Copïo'r petryal celloedd a ddewiswyd i'r clipfwrdd petryal tabl a'i wagio yn ei le."
  ga: "Cóipeáil an dronuilleog cealla roghnaithe go dtí gearrthaisce dronuilleog an tábla agus glan ina áit é."
  gd: "Dèan lethbhreac den cheart-cheàrnach cheallan a thagh thu gu clipbòrd ceart-cheàrnach a' chlàir agus falamhaich e far a bheil e."
  pl: "Kopiuje zaznaczony prostokąt komórek do schowka prostokątów tabeli i czyści go w miejscu."
  pt: "Copia o retângulo de células selecionado para a área de transferência de retângulos da tabela e o esvazia no lugar."
  ru: "Копирует выделенный прямоугольник ячеек в буфер обмена прямоугольников таблицы и очищает его на месте."
  ar: "ينسخ مستطيل الخلايا المحدد إلى حافظة مستطيلات الجدول ويفرغه في مكانه."
  hi: "चयनित कोशिका आयत को तालिका आयत क्लिपबोर्ड में कॉपी करता है और उसे उसी स्थान पर खाली कर देता है।"
  bn: "নির্বাচিত কোষ আয়তক্ষেত্র টেবিল আয়তক্ষেত্র ক্লিপবোর্ডে কপি করে এবং সেটিকে সেই স্থানেই খালি করে দেয়।"
  zh: "将选中的单元格矩形复制到表格矩形剪贴板,并将其原地清空。"
  ja: "選択したセル矩形をテーブル矩形クリップボードにコピーし、その場を空にします。"
