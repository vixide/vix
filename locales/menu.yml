menu.item.org.set_property.help:
  en: "Set a property on the headline, stored in its :PROPERTIES: drawer."
  es: "Establece una propiedad en el encabezado, almacenada en su cajón :PROPERTIES:."
  fr: "Définit une propriété sur le titre, stockée dans son tiroir :PROPERTIES:."
  de: "Setzt eine Eigenschaft für die Überschrift, gespeichert in ihrer :PROPERTIES:-Schublade."
  cy: "Gosod priodwedd ar y pennawd, wedi'i storio yn ei ddrôr :PROPERTIES:."
  ga: "Socraigh airí ar an gceannteideal, stóráilte ina tharraiceán :PROPERTIES:."
  gd: "Suidhich buadh air a' cheann-sgrìobhaidh, air a stòradh na dhrathair :PROPERTIES:."
  pl: "Ustawia właściwość nagłówka, przechowywaną w jego szufladzie :PROPERTIES:."
  pt: "Define uma propriedade no cabeçalho, armazenada na sua gaveta :PROPERTIES:."
  ru: "Задаёт свойство заголовка, хранящееся в его ящике :PROPERTIES:."
  ar: "يضبط خاصية على العنوان، تُخزَّن في درج :PROPERTIES: الخاص به."
  hi: "शीर्षक पर एक प्रॉपर्टी सेट करें, जो इसके :PROPERTIES: ड्रॉअर में संग्रहीत होती है।"
  bn: "শিরোনামে একটি প্রপার্টি সেট করুন, যা এর :PROPERTIES: ড্রয়ারে সংরক্ষিত হয়।"
  zh: "在标题上设置一个属性，存储在其 :PROPERTIES: 抽屉中。"
  ja: "見出しにプロパティを設定します。:PROPERTIES: ドロワーに保存されます。"
