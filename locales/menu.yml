  en: "Open the link at the cursor: a file, a heading, an id, or a URL."
  es: "Abre el enlace en el cursor: un archivo, un encabezado, un id o una URL."
  fr: "Ouvre le lien sous le curseur : un fichier, un titre, un identifiant ou une URL."
  de: "Öffnet den Link an der Cursorposition: eine Datei, eine Überschrift, eine ID oder eine URL."
  cy: "Agor y ddolen wrth y cyrchwr: ffeil, pennawd, id, neu URL."
  ga: "Osclaíonn sé an nasc ag an gcúrsóir: comhad, ceannteideal, aitheantas, nó URL."
