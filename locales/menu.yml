menu.item.org.refresh.help:
  en: "Act on the thing at the cursor: recalculate a table, update a cookie, refresh a block."
  es: "Actúa sobre lo que está bajo el cursor: recalcular una tabla, actualizar un cookie, refrescar un bloque."
  fr: "Agit sur ce qui se trouve sous le curseur : recalculer un tableau, mettre à jour un compteur, actualiser un bloc."
  de: "Wirkt auf das Element unter dem Cursor: eine Tabelle neu berechnen, ein Cookie aktualisieren, einen Block auffrischen."
  cy: "Gweithredu ar y peth wrth y cyrchwr: ailgyfrifo tabl, diweddaru cwci, adnewyddu bloc."
  ga: "Gníomhaigh ar an rud ag an gcúrsóir: athríomh tábla, nuashonraigh fianán, athnuaigh bloc."
  gd: "Gnìomhaich air an rud aig a' chùrsair: ath-àireamh clàr, ùraich briosgaid, ath-nuadhaich bloc."
  pl: "Działa na elemencie pod kursorem: przelicza tabelę, aktualizuje wskaźnik, odświeża blok."
  pt: "Age sobre o que está no cursor: recalcular uma tabela, atualizar um contador, atualizar um bloco."
  ru: "Действует на объект под курсором: пересчитывает таблицу, обновляет счётчик, обновляет блок."
  ar: "يعمل على العنصر عند المؤشر: إعادة حساب جدول، تحديث عداد، تحديث كتلة."
  hi: "कर्सर पर मौजूद चीज़ पर कार्य करें: तालिका की पुनर्गणना करें, कुकी अपडेट करें, ब्लॉक ताज़ा करें।"
  bn: "কার্সারে থাকা জিনিসের উপর কাজ করুন: টেবিল পুনর্গণনা করুন, কুকি আপডেট করুন, ব্লক রিফ্রেশ করুন।"
  zh: "对光标处的内容执行操作：重新计算表格、更新计数标记、刷新代码块。"
  ja: "カーソル位置の対象に応じて動作します。テーブルの再計算、クッキーの更新、ブロックの更新など。"
