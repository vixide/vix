menu.item.org.fold_all.help:
  en: "Fold every subtree to its top-level headings (Org's overview state)."
  es: "Pliega cada subárbol hasta sus encabezados de nivel superior (el estado de vista general de Org)."
  fr: "Replie chaque sous-arbre jusqu'à ses titres de niveau supérieur (l'état d'aperçu d'Org)."
  de: "Faltet jeden Teilbaum bis zu seinen Überschriften oberster Ebene (Org-Übersichtszustand)."
  cy: "Plygu pob is-goeden i'w phenawdau lefel uchaf (cyflwr trosolwg Org)."
  ga: "Fill gach fochrann go dtí a cheannteidil ar an leibhéal is airde (staid forbhreathnaithe Org)."
  gd: "Paisg gach fo-chraobh gu na ceann-sgrìobhaidhean ìre as àirde aice (staid an t-seallaidh fharsaing aig Org)."
  pl: "Zwija każde poddrzewo do jego nagłówków najwyższego poziomu (stan przeglądu Org)."
  pt: "Dobra cada subárvore até seus títulos de nível superior (o estado de visão geral do Org)."
  ru: "Сворачивает каждое поддерево до заголовков верхнего уровня (состояние обзора Org)."
  ar: "يطوي كل شجرة فرعية إلى عناوينها من المستوى الأعلى (حالة النظرة العامة في Org)."
  hi: "हर उपवृक्ष को उसके शीर्ष-स्तरीय शीर्षकों तक फ़ोल्ड करता है (Org की अवलोकन स्थिति)।"
  bn: "প্রতিটি সাবট্রিকে তার শীর্ষ-স্তরের শিরোনামে ফোল্ড করে (Org-এর ওভারভিউ অবস্থা)।"
  zh: "将每个子树折叠到其顶层标题 (Org 的概览状态)。"
  ja: "すべてのサブツリーを最上位の見出しまで折りたたみます (Org の概観状態)。"
