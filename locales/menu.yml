menu.item.org.archive.subtree.help:
  en: "Move the subtree to the archive file, keeping its outline path."
  es: "Mueve el subárbol al archivo de archivado, conservando su ruta de esquema."
  fr: "Déplace la sous-arborescence vers le fichier d'archive, en conservant son chemin dans le plan."
  de: "Verschiebt den Teilbaum in die Archivdatei und behält dabei seinen Gliederungspfad bei."
  cy: "Symud yr isgoeden i'r ffeil archif, gan gadw ei llwybr amlinell."
  ga: "Bogann sé an fo-chrann go dtí an comhad cartlainne, ag coinneáil a chosáin imlíne."
  gd: "Gluaisidh seo am fo-chraobh chun an fhaidhle tasglainn, a' gleidheadh a shlighe oir-loidhne."
  pl: "Przenosi poddrzewo do pliku archiwum, zachowując jego ścieżkę w konspekcie."
  pt: "Move a subárvore para o arquivo de arquivamento, mantendo seu caminho na estrutura."
  ru: "Перемещает поддерево в файл архива, сохраняя его путь в структуре."
  ar: "ينقل الشجرة الفرعية إلى ملف الأرشيف، مع الحفاظ على مسارها في المخطط التفصيلي."
  hi: "उप-वृक्ष को संग्रह फ़ाइल में ले जाता है, उसका रूपरेखा पथ बनाए रखते हुए।"
  bn: "সাব-ট্রিকে আর্কাইভ ফাইলে সরিয়ে দেয়, এর আউটলাইন পাথ বজায় রেখে।"
  zh: "将子树移动到归档文件,同时保留其大纲路径。"
  ja: "アウトラインのパスを保ったまま、サブツリーをアーカイブファイルに移動します。"
menu.item.org.archive.tag:
