  zh: "从模板捕获新的 Org-roam 节点。"
  ja: "テンプレートから新しい Org-roam ノードをキャプチャします。"
menu.item.org.roam.backlinks.help:
  en: "Show all nodes that link to the current node."
  es: "Muestra todos los nodos que enlazan con el nodo actual."
  fr: "Affiche tous les nœuds qui pointent vers le nœud actuel."
  de: "Zeigt alle Knoten, die auf den aktuellen Knoten verweisen."
  cy: "Dangosa bob nod sy'n cysylltu â'r nod presennol."
  ga: "Taispeáin gach nód a nascann leis an nód reatha."
  gd: "Seall a h-uile nòd a cheanglas ris an nòd làithreach."
  pl: "Pokazuje wszystkie węzły, które odsyłają do bieżącego węzła."
  pt: "Mostra todos os nós que apontam para o nó atual."
  ru: "Показывает все узлы, которые ссылаются на текущий узел."
  ar: "يعرض جميع العقد التي تربط بالعقدة الحالية."
  hi: "वर्तमान नोड से लिंक करने वाले सभी नोड दिखाएँ।"
  bn: "বর্তমান নোডের সাথে লিঙ্ক করা সমস্ত নোড দেখান।"
  zh: "显示链接到当前节点的所有节点。"
  ja: "現在のノードにリンクしているすべてのノードを表示します。"
menu.item.org.roam.backlinks_follow.help:
  en: "Show backlinks that refresh as you move between nodes."
  es: "Muestra retroenlaces que se actualizan al moverte entre nodos."
  fr: "Affiche des rétroliens qui s'actualisent au fil de vos déplacements."
  de: "Zeigt Rückverweise, die sich beim Wechseln zwischen Knoten aktualisieren."
  cy: "Dangosa ôl-ddolenni sy'n adnewyddu wrth i ti symud rhwng nodau."
  ga: "Taispeáin cúlnaisc a athnuann agus tú ag bogadh idir nóid."
  gd: "Seall cùl-cheanglaichean a dh'ùraicheas fhad 's a ghluaiseas tu eadar nòdan."
  pl: "Pokazuje odnośniki zwrotne odświeżane podczas przechodzenia między węzłami."
  pt: "Mostra backlinks que se atualizam ao navegar entre nós."
  ru: "Показывает обратные ссылки, обновляющиеся при переходе между узлами."
  ar: "يعرض روابط خلفية تتحدّث أثناء تنقّلك بين العقد."
  hi: "नोड्स के बीच जाने पर ताज़ा होने वाले बैकलिंक दिखाएँ।"
  bn: "নোডের মধ্যে চলাচলের সময় রিফ্রেশ হওয়া ব্যাকলিঙ্ক দেখান।"
  zh: "显示在节点间移动时实时刷新的反向链接。"
  ja: "ノード間を移動すると自動更新される被リンクを表示します。"
menu.item.org.roam.dailies.help:
  en: "Open commands for creating and browsing daily journal notes."
  es: "Abre comandos para crear y explorar notas de diario diarias."
  fr: "Ouvre les commandes de création et de consultation des notes de journal quotidiennes."
  de: "Öffnet Befehle zum Erstellen und Durchsuchen täglicher Journalnotizen."
  cy: "Agora orchmynion i greu a phori nodiadau dyddlyfr dyddiol."
  ga: "Oscail orduithe chun nótaí dialainne laethúla a chruthú agus a bhrabhsáil."
  gd: "Fosgail àitheantan gus nòtaichean leabhar-latha làitheil a chruthachadh 's a rùrachadh."
