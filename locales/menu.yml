menu.item.org.table.export_tsv.help:
  en: "Export the table's data rows as tab-separated text in a new tab."
  es: "Exporta las filas de datos de la tabla como texto separado por tabulaciones en una nueva pestaña."
  fr: "Exporte les lignes de données du tableau sous forme de texte séparé par des tabulations dans un nouvel onglet."
  de: "Exportiert die Datenzeilen der Tabelle als tabulatorgetrennten Text in einem neuen Tab."
  cy: "Allforio rhesi data'r tabl fel testun wedi'i wahanu â thabiau mewn tab newydd."
  ga: "Easpórtáil rónna sonraí an tábla mar théacs deighilte le táib i gcluaisín nua."
  gd: "Às-phortaich sreathan dàta a' chlàir mar theacsa sgaraichte le tabaichean ann an taba ùr."
  pl: "Eksportuje wiersze danych tabeli jako tekst rozdzielony tabulatorami w nowej karcie."
  pt: "Exporta as linhas de dados da tabela como texto separado por tabulações numa nova aba."
  ru: "Экспортирует строки данных таблицы как текст, разделённый табуляциями, в новую вкладку."
  ar: "يُصدّر صفوف بيانات الجدول كنص مفصول بجدولة في علامة تبويب جديدة."
  hi: "तालिका की डेटा पंक्तियों को एक नए टैब में टैब-सीमांकित पाठ के रूप में निर्यात करता है।"
  bn: "টেবিলের ডেটা সারিগুলোকে একটি নতুন ট্যাবে ট্যাব-বিভক্ত টেক্সট হিসেবে রপ্তানি করে।"
  zh: "将表格的数据行导出为制表符分隔的文本,放入新标签页。"
  ja: "テーブルのデータ行をタブ区切りテキストとして新しいタブにエクスポートします。"
