  en: "Paste a cut or copied subtree at the cursor, adjusting its level."
  es: "Pega un subárbol cortado o copiado en el cursor, ajustando su nivel."
  fr: "Colle un sous-arbre coupé ou copié au curseur, en ajustant son niveau."
  de: "Fügt einen ausgeschnittenen oder kopierten Teilbaum an der Cursorposition ein und passt seine Ebene an."
  cy: "Gludo is-goeden a dorrwyd neu a gopïwyd wrth y cyrchwr, gan addasu ei lefel."
  ga: "Greamaigh fochrann gearrtha nó cóipeáilte ag an gcúrsóir, ag coigeartú a leibhéil."
  gd: "Cuir a-steach fo-chraobh a chaidh a ghearradh no a lethbhreacadh aig a' chùrsair, a' gleusadh na h-ìre aige."
  pl: "Wkleja wycięte lub skopiowane poddrzewo w miejscu kursora, dostosowując jego poziom."
  pt: "Cola uma subárvore cortada ou copiada no cursor, ajustando o seu nível."
  ru: "Вставляет вырезанное или скопированное поддерево в позицию курсора, корректируя его уровень."
  ar: "يلصق شجرة فرعية مقصوصة أو منسوخة عند المؤشر، مع ضبط مستواها."
  hi: "कर्सर पर काटे या कॉपी किए गए उपवृक्ष को चिपकाएँ, उसका स्तर समायोजित करते हुए।"
  bn: "কার্সারে কাটা বা অনুলিপি করা সাবট্রি আটকায়, তার স্তর সামঞ্জস্য করে।"
