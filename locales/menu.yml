menu.item.org.tags_props.help:
  en: "Tags, properties, and the column view built from them."
  es: "Etiquetas, propiedades y la vista de columnas construida a partir de ellas."
  fr: "Étiquettes, propriétés et la vue en colonnes construite à partir d'elles."
  de: "Tags, Eigenschaften und die daraus erstellte Spaltenansicht."
  cy: "Tagiau, priodweddau, a'r olwg colofn a adeiladwyd ohonynt."
  ga: "Clibeanna, airíonna, agus an t-amharc colún a thógtar astu."
  gd: "Tagaichean, feartan, agus an sealladh colbh a thogar bhuapa."
  pl: "Znaczniki, właściwości i zbudowany na ich podstawie widok kolumnowy."
