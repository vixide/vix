menu.item.org.table.align.help:
  en: "Re-render the table at the cursor: pad columns and right-align numeric ones."
  es: "Vuelve a renderizar la tabla en el cursor: rellena las columnas y alinea a la derecha las numéricas."
  fr: "Redessine le tableau au curseur : remplit les colonnes et aligne à droite celles qui sont numériques."
  de: "Rendert die Tabelle an der Cursorposition neu: füllt Spalten auf und richtet numerische rechtsbündig aus."
  cy: "Ail-lunio'r tabl wrth y cyrchwr: llenwi colofnau ac alinio'r rhai rhifiadol i'r dde."
  ga: "Athrindreálann sé an tábla ag an gcúrsóir: líonann sé na colúin agus ailíníonn sé na cinn uimhriúla ar dheis."
  gd: "Ath-thaisbeanaidh e an clàr aig a' chùrsair: a' lìonadh nan colbhan agus a' co-thaobhachadh feadhainn àireamhach gu deas."
  pl: "Ponownie renderuje tabelę w miejscu kursora: dopełnia kolumny i wyrównuje kolumny liczbowe do prawej."
  pt: "Renderiza novamente a tabela no cursor: preenche as colunas e alinha as numéricas à direita."
  ru: "Заново отображает таблицу в позиции курсора: дополняет столбцы и выравнивает числовые по правому краю."
  ar: "يعيد عرض الجدول عند المؤشر: يضبط عرض الأعمدة ويحاذي الأعمدة الرقمية إلى اليمين."
  hi: "कर्सर पर तालिका को फिर से रेंडर करता है: कॉलम को पैड करता है और संख्यात्मक कॉलम को दाईं ओर संरेखित करता है।"
  bn: "কার্সারে টেবিলটি পুনরায় রেন্ডার করে: কলামগুলো প্যাড করে এবং সাংখ্যিক কলামগুলো ডানদিকে প্রান্তিক করে।"
  zh: "在光标处重新渲染表格:填充各列,并将数字列右对齐。"
  ja: "カーソル位置のテーブルを再描画します — 列の幅をそろえ、数値の列は右揃えにします。"
