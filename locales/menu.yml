menu.item.org.table.hline_and_move.help:
  en: "Insert a horizontal rule below the current row, then a fresh empty row below that, and move there."
  es: "Inserta una línea horizontal debajo de la fila actual, luego una nueva fila vacía debajo de esa, y se mueve allí."
  fr: "Insère une ligne horizontale en dessous de la ligne actuelle, puis une nouvelle ligne vide en dessous de celle-ci, et s'y déplace."
  de: "Fügt eine horizontale Linie unter der aktuellen Zeile ein, dann eine neue leere Zeile darunter, und springt dorthin."
  cy: "Mewnosod llinell lorweddol islaw'r rhes gyfredol, yna rhes wag newydd islaw honno, a symud yno."
  ga: "Ionsáigh líne chothrománach faoin ró reatha, ansin ró folamh nua faoina bhun sin, agus bog ann."
  gd: "Cuir a-steach loidhne chòmhnard fon t-sreath làithreach, an uair sin sreath fhalamh ùr foidhpe sin, agus gluais ann."
  pl: "Wstawia poziomą linię poniżej bieżącego wiersza, następnie nowy pusty wiersz poniżej niej, i przenosi tam kursor."
  pt: "Insere uma linha horizontal abaixo da linha atual, depois uma nova linha vazia abaixo dessa, e move-se para lá."
  ru: "Вставляет горизонтальную линию под текущей строкой, затем новую пустую строку под ней, и переходит туда."
  ar: "يُدرج خطًا أفقيًا أسفل الصف الحالي، ثم صفًا فارغًا جديدًا أسفله، وينتقل إليه."
  hi: "वर्तमान पंक्ति के नीचे एक क्षैतिज रेखा सम्मिलित करता है, फिर उसके नीचे एक नई खाली पंक्ति, और वहाँ चला जाता है।"
  bn: "বর্তমান সারির নিচে একটি অনুভূমিক রেখা সন্নিবেশ করে, তারপর তার নিচে একটি নতুন খালি সারি, এবং সেখানে চলে যায়।"
  zh: "在当前行下方插入一条水平线,再在其下方插入一个新的空行,并移动到那里。"
  ja: "現在の行の下に水平線を挿入し、さらにその下に新しい空の行を挿入して、そこへ移動します。"
