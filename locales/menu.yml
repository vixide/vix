  ga: "Ionsáigh colún folamh ag an gcúrsóir, ag bogadh an chuid eile ar dheis."
  gd: "Cuir a-steach colbh falamh aig a' chùrsair, a' gluasad a' chòrr gu deas."
  pl: "Wstawia pustą kolumnę w miejscu kursora, przesuwając resztę w prawo."
  pt: "Insere uma coluna vazia no cursor, deslocando o resto para a direita."
  ru: "Вставляет пустой столбец в позиции курсора, сдвигая остальные вправо."
  ar: "يُدرج عمودًا فارغًا عند المؤشر، مع تحريك الباقي إلى اليمين."
  hi: "कर्सर पर एक खाली कॉलम सम्मिलित करता है, बाकी को दाईं ओर खिसकाते हुए।"
  bn: "কার্সারে একটি খালি কলাম সন্নিবেশ করে, বাকিগুলো ডানদিকে সরিয়ে।"
  zh: "在光标处插入一个空列,其余列向右移动。"
  ja: "カーソル位置に空の列を挿入し、残りの列を右にずらします。"
