menu.item.org.table.create_from_region.help:
  en: "Convert the selected comma/tab/whitespace-delimited text into a pipe table (or insert an empty one)."
  es: "Convierte el texto seleccionado, delimitado por comas, tabulaciones o espacios, en una tabla (o inserta una vacía)."
  fr: "Convertit le texte sélectionné, délimité par des virgules, des tabulations ou des espaces, en un tableau (ou en insère un vide)."
  de: "Wandelt den ausgewählten, durch Kommas/Tabulatoren/Leerzeichen getrennten Text in eine Tabelle um (oder fügt eine leere ein)."
  cy: "Trosi'r testun dethol, wedi'i wahanu â choma/tab/bwlch, yn dabl (neu fewnosod un gwag)."
  ga: "Tiontaigh an téacs roghnaithe, deighilte le camóg/táb/spás bán, ina thábla (nó ionsáigh ceann folamh)."
  gd: "Iompaich an teacsa a chaidh a thaghadh, sgaraichte le cromag/taba/bearn, gu clàr (no cuir a-steach fear falamh)."
  pl: "Konwertuje zaznaczony tekst rozdzielony przecinkami/tabulatorami/spacjami na tabelę (lub wstawia pustą)."
  pt: "Converte o texto selecionado, delimitado por vírgulas/tabulações/espaços, numa tabela (ou insere uma vazia)."
  ru: "Преобразует выделенный текст, разделённый запятыми/табуляциями/пробелами, в таблицу (или вставляет пустую)."
  ar: "يحوّل النص المحدد المفصول بفواصل/جدولة/مسافات إلى جدول (أو يُدرج جدولًا فارغًا)."
  hi: "चयनित, अल्पविराम/टैब/रिक्त स्थान से विभाजित पाठ को तालिका में बदलता है (या एक खाली तालिका सम्मिलित करता है)।"
  bn: "নির্বাচিত কমা/ট্যাব/স্পেস দ্বারা বিভক্ত টেক্সটকে একটি টেবিলে রূপান্তরিত করে (অথবা একটি খালি টেবিল সন্নিবেশ করে)।"
  zh: "将选中的以逗号/制表符/空白分隔的文本转换为表格(或插入一个空表格)。"
  ja: "選択したカンマ/タブ/空白区切りのテキストをテーブルに変換します(選択がなければ空のテーブルを挿入します)。"
