menu.item.org.agenda.file_clear.help:
  en: "Clear the agenda file list, so the agenda scans every .org file in the project again."
  es: "Borra la lista de archivos de la agenda, de modo que la agenda vuelva a analizar todos los archivos .org del proyecto."
  fr: "Efface la liste de fichiers de l'agenda, afin que l'agenda analyse de nouveau tous les fichiers .org du projet."
  de: "Leert die Dateiliste der Agenda, sodass die Agenda wieder alle .org-Dateien im Projekt durchsucht."
  cy: "Clirio rhestr ffeiliau'r agenda, fel bod yr agenda'n sganio pob ffeil .org yn y prosiect eto."
  ga: "Glan liosta comhad an chláir oibre, ionas go ndéanfaidh an clár oibre gach comhad .org sa tionscadal a scanadh arís."
  gd: "Falamhaich liosta fhaidhlichean a' chlàir-ghnothaich, ach an sganaich an clàr-gnothaich a h-uile faidhle .org sa phròiseact a-rithist."
  pl: "Czyści listę plików agendy, dzięki czemu agenda ponownie skanuje każdy plik .org w projekcie."
  pt: "Limpa a lista de arquivos da agenda, para que a agenda verifique novamente todos os arquivos .org do projeto."
  ru: "Очищает список файлов повестки, чтобы повестка снова сканировала все файлы .org в проекте."
  ar: "يمسح قائمة ملفات جدول الأعمال، بحيث يفحص جدول الأعمال جميع ملفات ‎.org‎ في المشروع مرة أخرى."
  hi: "एजेंडा की फ़ाइल सूची साफ़ करता है, ताकि एजेंडा प्रोजेक्ट की सभी .org फ़ाइलों को फिर से स्कैन करे।"
  bn: "এজেন্ডার ফাইল তালিকা সাফ করে, যাতে এজেন্ডা প্রজেক্টের প্রতিটি .org ফাইল আবার স্ক্যান করে।"
  zh: "清除日程的文件列表，使日程再次扫描项目中的每个 .org 文件。"
  ja: "アジェンダのファイルリストをクリアし、アジェンダがプロジェクト内のすべての .org ファイルを再度スキャンするようにします。"
