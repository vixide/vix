menu.item.org.sort_children.help:
  en: "Sort the subtree's children — alphabetically, by TODO state, or by date."
  es: "Ordena los subencabezados del subárbol: alfabéticamente, por estado TODO o por fecha."
  fr: "Trie les sous-titres du sous-arbre : par ordre alphabétique, par état TODO ou par date."
  de: "Sortiert die Unterüberschriften des Teilbaums – alphabetisch, nach TODO-Status oder nach Datum."
  cy: "Trefnu is-benawdau'r is-goeden — yn nhrefn yr wyddor, yn ôl cyflwr TODO, neu yn ôl dyddiad."
  ga: "Sórtáil focheannlínte an fhochrainn — in ord aibítre, de réir staid TODO, nó de réir dáta."
  gd: "Seòrsaich fo-cheann-loidhnichean an fho-chraobh — a-rèir na h-aibideil, a-rèir staid TODO, no a-rèir cinn-latha."
  pl: "Sortuje podnagłówki poddrzewa — alfabetycznie, według stanu TODO lub według daty."
  pt: "Ordena os subcabeçalhos da subárvore — alfabeticamente, por estado TODO ou por data."
  ru: "Сортирует подзаголовки поддерева — по алфавиту, по состоянию TODO или по дате."
  ar: "يفرز العناوين الفرعية للشجرة الفرعية — أبجديًا، أو حسب حالة TODO، أو حسب التاريخ."
  hi: "उपवृक्ष के उपशीर्षकों को क्रमबद्ध करें — वर्णानुक्रम से, TODO स्थिति से, या तिथि से।"
  bn: "সাবট্রির উপশিরোনামগুলো সাজায় — বর্ণানুক্রমিকভাবে, TODO অবস্থা অনুযায়ী, বা তারিখ অনুযায়ী।"
  zh: "对子树的子标题排序——按字母顺序、按 TODO 状态或按日期。"
  ja: "サブツリーの小見出しを並べ替えます — アルファベット順、TODO 状態順、または日付順。"
