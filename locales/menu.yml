  es: "Busca de forma difusa un archivo dentro del subproyecto envolvente más cercano."
  fr: "Recherche floue d'un fichier dans le sous-projet englobant le plus proche."
  de: "Findet unscharf eine Datei innerhalb des nächstgelegenen umschließenden Unterprojekts."
  cy: "Chwilio niwlog am ffeil o fewn yr is-brosiect amgáu agosaf."
  ga: "Aimsigh comhad go doiléir laistigh den fhotionscadal iniata is gaire."
  gd: "Lorg faidhle gu neo-phongail taobh a-staigh an fho-phròiseict iadhaidh as fhaisge."
  pl: "Rozmyte wyszukiwanie pliku w obrębie najbliższego otaczającego podprojektu."
  pt: "Faz uma busca difusa por um arquivo dentro do subprojeto envolvente mais próximo."
  ru: "Выполняет нечёткий поиск файла в ближайшем охватывающем подпроекте."
  ar: "بحث تقريبي عن ملف ضمن أقرب مشروع فرعي محيط."
  hi: "निकटतम संलग्न सब-प्रोजेक्ट में किसी फ़ाइल की फ़ज़ी खोज करें।"
  bn: "নিকটতম আবদ্ধ সাব-প্রকল্পের মধ্যে একটি ফাইলের ফাজি অনুসন্ধান করুন।"
  zh: "在最近的外层子项目内模糊查找文件。"
  ja: "最も近い外側のサブプロジェクト内でファイルをあいまい検索します。"
