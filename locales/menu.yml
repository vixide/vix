menu.item.org.sparse_todo.help:
  en: "Fold every subtree without a TODO entry; Show All clears it."
  es: "Pliega cada subárbol sin una entrada TODO; Mostrar Todo lo despeja."
  fr: "Replie chaque sous-arbre sans entrée TODO ; Tout Afficher l'efface."
  de: "Faltet jeden Teilbaum ohne TODO-Eintrag; Alles Anzeigen hebt es auf."
  cy: "Plygu pob is-goeden heb gofnod TODO; mae Dangos Popeth yn ei glirio."
  ga: "Fill gach fochrann gan iontráil TODO; glanann Taispeáin Gach Rud é."
  gd: "Paisg gach fo-chraobh gun innteart TODO; falamhaichidh Seall na h-Uile e."
  pl: "Zwija każde poddrzewo bez wpisu TODO; Pokaż Wszystko to czyści."
  pt: "Dobra cada subárvore sem uma entrada TODO; Mostrar Tudo a limpa."
  ru: "Сворачивает каждое поддерево без записи TODO; «Показать Всё» очищает это."
  ar: "يطوي كل شجرة فرعية بدون إدخال TODO؛ يمسحها إظهار الكل."
  hi: "हर उस उपवृक्ष को फ़ोल्ड करता है जिसमें TODO प्रविष्टि नहीं है; सभी दिखाएँ इसे साफ़ करता है।"
  bn: "TODO এন্ট্রি ছাড়া প্রতিটি সাবট্রি ফোল্ড করে; সব দেখান এটি সাফ করে।"
  zh: "折叠所有没有 TODO 条目的子树;显示全部会清除它。"
  ja: "TODO 項目のないサブツリーをすべて折りたたみます。すべて表示で解除されます。"
