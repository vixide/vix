  gd: "Cuir a-steach bloca #+BEGIN: columnview aig a' chùrsair, air a chuairteachadh le :id a chaidh a chur a-steach."
  pl: "Wstawia blok #+BEGIN: columnview w miejscu kursora, ograniczony wprowadzonym :id."
  pt: "Insere um bloco #+BEGIN: columnview no cursor, delimitado por um :id inserido."
  ru: "Вставляет блок #+BEGIN: columnview в позицию курсора, ограниченный введённым :id."
  ar: "يُدرج كتلة #+BEGIN: columnview عند المؤشر، محددة النطاق بواسطة :id تم إدخاله."
  hi: "कर्सर पर एक #+BEGIN: columnview ब्लॉक डालता है, जो दर्ज किए गए :id द्वारा सीमित है।"
  bn: "কার্সারে একটি #+BEGIN: columnview ব্লক সন্নিবেশ করে, যা প্রবেশ করানো :id দ্বারা সীমাবদ্ধ।"
