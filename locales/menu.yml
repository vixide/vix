menu.item.view.menu_tooltips.help:
  en: "Show or hide hover help tooltips on the menus and menu items."
  es: "Muestra u oculta los tooltips de ayuda al pasar el cursor sobre los menús y los elementos de menú."
  fr: "Affiche ou masque les infobulles d'aide au survol sur les menus et les éléments de menu."
  de: "Blendet Hilfe-Tooltips beim Überfahren mit der Maus auf den Menüs und Menüelementen ein oder aus."
  cy: "Dangos neu guddio'r cynghorion cymorth wrth hofran ar y dewislenni ac eitemau dewislen."
  ga: "Taispeáin nó folaigh leideanna cabhracha ar ainliú ar na roghchláir agus ar mhíreanna roghchláir."
  gd: "Seall no falaich gliocasan cuideachaidh air fantainn os cionn air na clàran-taice agus na nithean clàir-thaice."
  pl: "Pokazuje lub ukrywa podpowiedzi pomocy po najechaniu kursorem na menu i elementy menu."
  pt: "Mostra ou oculta as dicas de ajuda ao passar o mouse sobre os menus e itens de menu."
  ru: "Показывает или скрывает всплывающие подсказки при наведении на меню и пункты меню."
  ar: "يُظهر أو يُخفي تلميحات المساعدة عند التحويم فوق القوائم وعناصر القائمة."
  hi: "मेनू और मेनू आइटम पर होवर सहायता टूलटिप्स को दिखाएँ या छिपाएँ।"
  bn: "মেনু ও মেনু আইটেমের উপর হোভার সহায়তা টুলটিপ দেখান বা লুকান।"
  zh: "显示或隐藏菜单和菜单项上的悬停帮助提示。"
  ja: "メニューとメニュー項目のホバーヘルプのツールチップを表示または非表示にします。"
