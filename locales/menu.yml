  pt: "Escolha entre tarefas configuradas pelo usuário, do tipo de projeto e detectadas automaticamente."
  ru: "Выберите из задач, настроенных пользователем, характерных для типа проекта, и автоматически обнаруженных."
  ar: "اختر من المهام التي أعدّها المستخدم، ومهام نوع المشروع، والمهام المكتشفة."
  hi: "उपयोगकर्ता-कॉन्फ़िगर, प्रोजेक्ट-प्रकार और खोजे गए कार्यों में से चुनें।"
