menu.item.org.dates.timestamp.help:
  en: "Insert an active timestamp, which the agenda picks up."
  es: "Inserta una marca de tiempo activa, que la agenda recoge."
  fr: "Insère un horodatage actif, que l'agenda prend en compte."
  de: "Fügt einen aktiven Zeitstempel ein, den die Agenda erfasst."
  cy: "Mewnosoda farc amser gweithredol, y mae'r agenda'n ei godi."
  ga: "Ionsáigh stampa ama gníomhach, a phiocann an clár oibre suas."
  gd: "Cuir a-steach stampa-ama gnìomhach, a bheir an clàr-gnothaich fa-near."
  pl: "Wstawia aktywny znacznik czasu, uwzględniany w agendzie."
  pt: "Insere uma marca de tempo ativa, que a agenda capta."
  ru: "Вставляет активную временную метку, которую учитывает повестка."
  ar: "إدراج طابع زمني نشط، يلتقطه جدول الأعمال."
  hi: "एक सक्रिय टाइमस्टैंप डालें, जिसे एजेंडा उठा लेता है।"
  bn: "একটি সক্রিয় টাইমস্ট্যাম্প সন্নিবেশ করুন, যা এজেন্ডা গ্রহণ করে।"
  zh: "插入一个活动时间戳，日程会读取它。"
  ja: "アジェンダに反映されるアクティブなタイムスタンプを挿入します。"
