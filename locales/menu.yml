menu.project.help:
  en: "Open the Project menu for build, test, and task commands."
  es: "Abre el menú Proyecto para comandos de compilación, prueba y tareas."
  fr: "Ouvre le menu Projet pour les commandes de compilation, de test et de tâches."
  de: "Öffnet das Projekt-Menü für Build-, Test- und Aufgabenbefehle."
  cy: "Agor y ddewislen Prosiect ar gyfer gorchmynion adeiladu, profi a thasgau."
  ga: "Oscail an roghchlár Tionscadal le haghaidh orduithe tógála, tástála agus tascanna."
  gd: "Fosgail an clàr Pròiseact airson àitheantan togail, deuchainn is gnìomhan."
  pl: "Otwiera menu Projekt z poleceniami kompilacji, testów i zadań."
  pt: "Abre o menu Projeto para comandos de compilação, teste e tarefas."
  ru: "Открывает меню «Проект» с командами сборки, тестирования и задач."
  ar: "يفتح قائمة المشروع لأوامر البناء والاختبار والمهام."
  hi: "बिल्ड, टेस्ट और कार्य कमांड के लिए प्रोजेक्ट मेनू खोलें।"
  bn: "বিল্ড, টেস্ট ও কাজের কমান্ডের জন্য প্রকল্প মেনু খুলুন।"
  zh: "打开项目菜单，进行构建、测试和任务命令操作。"
  ja: "ビルド、テスト、タスクコマンドのためのプロジェクトメニューを開きます。"
