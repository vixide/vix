menu.item.org.agenda.file_add.help:
  en: "Add the current file to the agenda's file list, so only listed files are scanned."
  es: "Añade el archivo actual a la lista de archivos de la agenda, de modo que solo se analicen los archivos listados."
  fr: "Ajoute le fichier actuel à la liste de fichiers de l'agenda, afin que seuls les fichiers listés soient analysés."
  de: "Fügt die aktuelle Datei zur Dateiliste der Agenda hinzu, sodass nur die aufgeführten Dateien durchsucht werden."
  cy: "Ychwanega'r ffeil gyfredol at restr ffeiliau'r agenda, fel mai dim ond y ffeiliau rhestredig sy'n cael eu sganio."
  ga: "Cuir an comhad reatha le liosta comhad an chláir oibre, ionas nach ndéanfar ach na comhaid liostaithe a scanadh."
  gd: "Cuir am faidhle làithreach ri liosta fhaidhlichean a' chlàir-ghnothaich, ach am bi dìreach na faidhlichean air an liosta gan sganadh."
  pl: "Dodaje bieżący plik do listy plików agendy, dzięki czemu skanowane są tylko wymienione pliki."
  pt: "Adiciona o arquivo atual à lista de arquivos da agenda, para que apenas os arquivos listados sejam verificados."
  ru: "Добавляет текущий файл в список файлов повестки, чтобы сканировались только файлы из списка."
  ar: "يضيف الملف الحالي إلى قائمة ملفات جدول الأعمال، بحيث يتم فحص الملفات المدرجة فقط."
  hi: "वर्तमान फ़ाइल को एजेंडा की फ़ाइल सूची में जोड़ें, ताकि केवल सूचीबद्ध फ़ाइलें ही स्कैन हों।"
  bn: "বর্তমান ফাইলটি এজেন্ডার ফাইল তালিকায় যোগ করুন, যাতে শুধু তালিকাভুক্ত ফাইলগুলি স্ক্যান করা হয়।"
  zh: "将当前文件添加到日程的文件列表中，这样只会扫描列出的文件。"
  ja: "現在のファイルをアジェンダのファイルリストに追加し、リストされたファイルのみをスキャンするようにします。"
