  de: "Entfernt die Beschränkungssperre, sodass die Agenda wieder alle Agendadateien umfasst."
  cy: "Tynnu'r clo cyfyngiad, fel bod yr agenda'n cwmpasu pob ffeil agenda eto."
  ga: "Bain an glas srianta, ionas go gclúdaíonn an clár oibre gach comhad clár oibre arís."
  gd: "Thoir air falbh an glas bacaidh, gus am bi an clàr-gnothaich a' còmhdach a h-uile faidhle clàir-ghnothaich a-rithist."
  pl: "Usuwa blokadę ograniczenia, aby agenda ponownie obejmowała wszystkie pliki agendy."
  pt: "Remove o bloqueio de restrição, para que a agenda volte a abranger todos os arquivos da agenda."
  ru: "Снимает блокировку ограничения, чтобы повестка снова охватывала все файлы повестки."
  ar: "إزالة قفل التقييد، بحيث يشمل جدول الأعمال جميع ملفات جدول الأعمال مجددًا."
  hi: "प्रतिबंध लॉक हटा दें, ताकि एजेंडा फिर से सभी एजेंडा फ़ाइलों को कवर करे।"
  bn: "সীমাবদ্ধতা লক সরান, যাতে এজেন্ডা আবার সব এজেন্ডা ফাইল কভার করে।"
  zh: "移除限制锁定，使日程重新涵盖所有日程文件。"
  ja: "制限ロックを解除し、アジェンダをすべてのアジェンダファイルに対して再び有効にします。"
