  fr: "Choisissez parmi les tâches configurées par l'utilisateur, propres au type de projet et découvertes automatiquement."
  de: "Wählen Sie aus benutzerdefinierten, projekttypspezifischen und automatisch erkannten Aufgaben."
  cy: "Dewiswch o dasgau a ffurfweddwyd gan y defnyddiwr, tasgau'r math o brosiect, a thasgau a ganfuwyd."
  ga: "Roghnaigh as tascanna arna gcumrú ag an úsáideoir, tascanna an chineáil tionscadail, agus tascanna aimsithe."
