menu.item.org.agenda.stuck.help:
  en: "List projects with no next action — a top-level TODO whose subtree has none."
  es: "Enumera los proyectos sin siguiente acción — un TODO de nivel superior cuyo subárbol no tiene ninguna."
  fr: "Répertorie les projets sans action suivante — un TODO de premier niveau dont le sous-arbre n'en a aucune."
  de: "Listet Projekte ohne nächsten Schritt auf — ein TODO oberster Ebene, dessen Teilbaum keinen enthält."
  cy: "Rhestra brosiectau heb gam nesaf — TODO lefel uchaf nad oes gan ei is-goeden yr un."
  ga: "Liostaigh tionscadail gan chéad chéim eile — TODO barrleibhéil nach bhfuil ceann ag a fhochrann."
  gd: "Liostaich pròiseactan gun ath cheum — TODO àrd-ìre aig nach eil gin na fho-chraobh."
  pl: "Wyświetla projekty bez kolejnego działania — nagłówek TODO najwyższego poziomu, którego poddrzewo go nie ma."
  pt: "Lista projetos sem próxima ação — um TODO de nível superior cuja subárvore não tem nenhuma."
  ru: "Перечисляет проекты без следующего действия — TODO верхнего уровня, в поддереве которого его нет."
  ar: "سرد المشاريع التي لا تحتوي على إجراء تالٍ — عنصر TODO من المستوى الأعلى لا تحتوي شجرته الفرعية على أي إجراء."
  hi: "बिना अगली कार्रवाई वाली परियोजनाएँ सूचीबद्ध करें — एक शीर्ष-स्तरीय TODO जिसके सबट्री में कोई नहीं है।"
  bn: "কোনো পরবর্তী পদক্ষেপ ছাড়া প্রকল্প তালিকাভুক্ত করুন — একটি শীর্ষ-স্তরের TODO যার সাবট্রিতে কিছু নেই।"
  zh: "列出没有下一步行动的项目——即子树中没有任何行动的顶层 TODO。"
  ja: "次のアクションがないプロジェクトを一覧表示します。サブツリーに何もないトップレベルの TODO です。"
