menu.item.org.export.ics.help:
  en: "Export SCHEDULED and DEADLINE entries as iCalendar events in a new tab."
  es: "Exporta las entradas SCHEDULED y DEADLINE como eventos iCalendar en una pestaña nueva."
  fr: "Exporte les entrées SCHEDULED et DEADLINE sous forme d'événements iCalendar dans un nouvel onglet."
  de: "Exportiert SCHEDULED- und DEADLINE-Einträge als iCalendar-Ereignisse in einem neuen Tab."
  cy: "Allforio cofnodion SCHEDULED a DEADLINE fel digwyddiadau iCalendar mewn tab newydd."
  ga: "Easpórtáil iontrálacha SCHEDULED agus DEADLINE mar imeachtaí iCalendar i gcluaisín nua."
  gd: "Às-phortaich clàran SCHEDULED agus DEADLINE mar thachartasan iCalendar ann an taba ùr."
  pl: "Eksportuje wpisy SCHEDULED i DEADLINE jako zdarzenia iCalendar w nowej karcie."
  pt: "Exporta as entradas SCHEDULED e DEADLINE como eventos iCalendar numa nova aba."
  ru: "Экспортирует записи SCHEDULED и DEADLINE как события iCalendar на новой вкладке."
  ar: "يصدّر إدخالات SCHEDULED و DEADLINE كأحداث iCalendar في علامة تبويب جديدة."
  hi: "SCHEDULED और DEADLINE प्रविष्टियों को नए टैब में iCalendar इवेंट के रूप में निर्यात करता है।"
  bn: "SCHEDULED এবং DEADLINE এন্ট্রিগুলিকে একটি নতুন ট্যাবে iCalendar ইভেন্ট হিসেবে রপ্তানি করে।"
  zh: "在新标签页中将 SCHEDULED 和 DEADLINE 条目导出为 iCalendar 事件。"
  ja: "SCHEDULED と DEADLINE のエントリを新しいタブで iCalendar イベントとしてエクスポートします。"
