menu.item.file.new.help:
  en: "Create a new empty file in a fresh tab."
  es: "Crea un archivo nuevo y vacío en una pestaña nueva."
  fr: "Crée un nouveau fichier vide dans un nouvel onglet."
  de: "Erstellt eine neue leere Datei in einem neuen Tab."
  cy: "Creu ffeil newydd wag mewn tab newydd."
  ga: "Cruthaigh comhad folamh nua i gcluaisín nua."
  gd: "Cruthaich faidhle falamh ùr ann an taba ùr."
  pl: "Tworzy nowy pusty plik w nowej karcie."
  pt: "Cria um novo arquivo vazio em uma nova aba."
  ru: "Создаёт новый пустой файл в новой вкладке."
  ar: "أنشئ ملفًا فارغًا جديدًا في علامة تبويب جديدة."
  hi: "नई टैब में एक नई खाली फ़ाइल बनाएँ।"
  bn: "একটি নতুন ট্যাবে নতুন খালি ফাইল তৈরি করুন।"
  zh: "在新标签页中创建一个新的空文件。"
  ja: "新しいタブに空のファイルを新規作成します。"
menu.file.help:
  en: "Open file, project, and workspace commands."
  es: "Abre comandos de archivo, proyecto y espacio de trabajo."
  fr: "Ouvre les commandes de fichier, projet et espace de travail."
  de: "Öffnet Befehle für Datei, Projekt und Arbeitsbereich."
  cy: "Agor gorchmynion ffeil, prosiect a gweithle."
  ga: "Oscail orduithe comhaid, tionscadail agus spáis oibre."
  gd: "Fosgail àitheantan faidhle, pròiseact agus rùm-obrach."
  pl: "Otwiera polecenia pliku, projektu i obszaru roboczego."
  pt: "Abre comandos de arquivo, projeto e espaço de trabalho."
  ru: "Открывает команды файла, проекта и рабочей области."
  ar: "افتح أوامر الملف والمشروع ومساحة العمل."
  hi: "फ़ाइल, प्रोजेक्ट और वर्कस्पेस कमांड खोलें।"
  bn: "ফাইল, প্রজেক্ট ও ওয়ার্কস্পেস কমান্ড খোলে।"
  zh: "打开文件、项目和工作区命令。"
  ja: "ファイル、プロジェクト、ワークスペースのコマンドを開きます。"
menu.item.file.scratch.help:
  en: "Open a temporary scratch buffer for quick notes."
  es: "Abre un búfer temporal para notas rápidas."
  fr: "Ouvre un tampon temporaire pour des notes rapides."
  de: "Öffnet einen temporären Notizpuffer für schnelle Notizen."
  cy: "Agor byffer dros dro ar gyfer nodiadau cyflym."
  ga: "Oscail maolán sealadach do nótaí tapa."
  gd: "Fosgail bufair sealach airson notaichean luatha."
  pl: "Otwiera tymczasowy bufor na szybkie notatki."
  pt: "Abre um buffer temporário para anotações rápidas."
  ru: "Открывает временный буфер для быстрых заметок."
  ar: "افتح مخزنًا مؤقتًا للملاحظات السريعة."
  hi: "त्वरित नोट्स के लिए एक अस्थायी स्क्रैच बफ़र खोलें।"
  bn: "দ্রুত নোটের জন্য একটি অস্থায়ী স্ক্র্যাচ বাফার খোলে।"
  zh: "打开一个临时草稿缓冲区用于快速记录。"
  ja: "簡単なメモ用の一時スクラッチバッファを開きます。"
menu.item.file.open.help:
  en: "Browse for a file and open it in a new tab."
  es: "Busca un archivo y ábrelo en una pestaña nueva."
  fr: "Parcourt et ouvre un fichier dans un nouvel onglet."
  de: "Sucht eine Datei und öffnet sie in einem neuen Tab."
  cy: "Pori am ffeil a'i hagor mewn tab newydd."
  ga: "Brabhsáil comhad agus oscail é i gcluaisín nua."
  gd: "Rùraich airson faidhle is fosgail e ann an taba ùr."
  pl: "Wyszukuje plik i otwiera go w nowej karcie."
  pt: "Procura um arquivo e o abre em uma nova aba."
  ru: "Находит файл и открывает его в новой вкладке."
  ar: "استعرض ملفًا وافتحه في علامة تبويب جديدة."
  hi: "किसी फ़ाइल को ब्राउज़ करें और उसे नई टैब में खोलें।"
  bn: "একটি ফাইল ব্রাউজ করে নতুন ট্যাবে খোলে।"
  zh: "浏览并在新标签页中打开文件。"
  ja: "ファイルを選んで新しいタブで開きます。"
menu.item.file.open_recent.help:
  en: "Reopen a file from the recently opened list."
  es: "Vuelve a abrir un archivo de la lista de recientes."
  fr: "Rouvre un fichier depuis la liste des récents."
  de: "Öffnet eine Datei aus der Liste der zuletzt geöffneten erneut."
  cy: "Ailagor ffeil o'r rhestr o rai diweddar."
  ga: "Athoscail comhad ón liosta a osclaíodh le déanaí."
  gd: "Ath-fhosgail faidhle on liosta o chionn ghoirid."
  pl: "Ponownie otwiera plik z listy ostatnio otwieranych."
  pt: "Reabre um arquivo da lista de recentes."
  ru: "Повторно открывает файл из списка недавних."
  ar: "أعد فتح ملف من قائمة الملفات الأخيرة."
  hi: "हाल ही में खोली गई सूची से कोई फ़ाइल फिर से खोलें।"
  bn: "সম্প্রতি খোলা তালিকা থেকে একটি ফাইল পুনরায় খোলে।"
  zh: "从最近打开列表中重新打开文件。"
  ja: "最近開いた一覧からファイルを再度開きます。"
menu.item.file.switch_project.help:
  en: "Switch the editor to a different project folder."
  es: "Cambia el editor a otra carpeta de proyecto."
  fr: "Bascule l'éditeur vers un autre dossier de projet."
  de: "Wechselt den Editor zu einem anderen Projektordner."
  cy: "Newid y golygydd i ffolder prosiect gwahanol."
  ga: "Athraigh an t-eagarthóir go fillteán tionscadail eile."
  gd: "Atharraich an deasaiche gu pasgan pròiseact eile."
  pl: "Przełącza edytor na inny folder projektu."
  pt: "Alterna o editor para outra pasta de projeto."
  ru: "Переключает редактор на другую папку проекта."
  ar: "بدّل المحرر إلى مجلد مشروع آخر."
  hi: "एडिटर को किसी अन्य प्रोजेक्ट फ़ोल्डर पर स्विच करें।"
  bn: "এডিটরকে অন্য প্রজেক্ট ফোল্ডারে পরিবর্তন করে।"
  zh: "将编辑器切换到其他项目文件夹。"
  ja: "エディタを別のプロジェクトフォルダに切り替えます。"
menu.item.file.workspace_open.help:
  en: "Load a saved workspace from a file."
  es: "Carga un espacio de trabajo guardado desde un archivo."
  fr: "Charge un espace de travail enregistré depuis un fichier."
  de: "Lädt einen gespeicherten Arbeitsbereich aus einer Datei."
  cy: "Llwytho gweithle wedi'i gadw o ffeil."
  ga: "Luchtaigh spás oibre sábháilte ó chomhad."
  gd: "Luchdaich rùm-obrach a chaidh a shàbhaladh à faidhle."
  pl: "Wczytuje zapisany obszar roboczy z pliku."
  pt: "Carrega um espaço de trabalho salvo de um arquivo."
  ru: "Загружает сохранённую рабочую область из файла."
  ar: "حمّل مساحة عمل محفوظة من ملف."
  hi: "किसी फ़ाइल से सहेजा गया वर्कस्पेस लोड करें।"
  bn: "একটি ফাইল থেকে সংরক্ষিত ওয়ার্কস্পেস লোড করে।"
  zh: "从文件加载已保存的工作区。"
  ja: "保存済みのワークスペースをファイルから読み込みます。"
menu.item.file.workspace_save.help:
  en: "Save the current workspace layout to a file."
  es: "Guarda el diseño del espacio de trabajo actual en un archivo."
  fr: "Enregistre la disposition de l'espace de travail actuel dans un fichier."
  de: "Speichert das aktuelle Arbeitsbereichs-Layout in einer Datei."
  cy: "Cadw cynllun y gweithle presennol i ffeil."
  ga: "Sábháil leagan amach an spáis oibre reatha i gcomhad."
  gd: "Sàbhail co-dhealbhachd an rùm-obrach làithreach gu faidhle."
  pl: "Zapisuje układ bieżącego obszaru roboczego do pliku."
  pt: "Salva o layout do espaço de trabalho atual em um arquivo."
  ru: "Сохраняет текущую компоновку рабочей области в файл."
  ar: "احفظ تخطيط مساحة العمل الحالية في ملف."
  hi: "वर्तमान वर्कस्पेस लेआउट को किसी फ़ाइल में सहेजें।"
  bn: "বর্তমান ওয়ার্কস্পেস লেআউট একটি ফাইলে সংরক্ষণ করে।"
  zh: "将当前工作区布局保存到文件。"
  ja: "現在のワークスペースの構成をファイルに保存します。"
menu.item.file.workspace_add_folder.help:
  en: "Add another folder to the current workspace."
  es: "Añade otra carpeta al espacio de trabajo actual."
  fr: "Ajoute un autre dossier à l'espace de travail actuel."
  de: "Fügt dem aktuellen Arbeitsbereich einen weiteren Ordner hinzu."
  cy: "Ychwanegu ffolder arall at y gweithle presennol."
  ga: "Cuir fillteán eile leis an spás oibre reatha."
  gd: "Cuir pasgan eile ris an rùm-obrach làithreach."
  pl: "Dodaje kolejny folder do bieżącego obszaru roboczego."
  pt: "Adiciona outra pasta ao espaço de trabalho atual."
  ru: "Добавляет ещё одну папку в текущую рабочую область."
  ar: "أضف مجلدًا آخر إلى مساحة العمل الحالية."
  hi: "वर्तमान वर्कस्पेस में एक और फ़ोल्डर जोड़ें।"
  bn: "বর্তমান ওয়ার্কস্পেসে আরেকটি ফোল্ডার যোগ করে।"
  zh: "向当前工作区添加另一个文件夹。"
  ja: "現在のワークスペースに別のフォルダを追加します。"
menu.item.file.save.help:
  en: "Save the current file to disk."
  es: "Guarda el archivo actual en el disco."
  fr: "Enregistre le fichier actuel sur le disque."
  de: "Speichert die aktuelle Datei auf dem Datenträger."
  cy: "Cadw'r ffeil bresennol i'r ddisg."
  ga: "Sábháil an comhad reatha ar an diosca."
  gd: "Sàbhail am faidhle làithreach dhan diosga."
  pl: "Zapisuje bieżący plik na dysku."
  pt: "Salva o arquivo atual no disco."
  ru: "Сохраняет текущий файл на диск."
  ar: "احفظ الملف الحالي على القرص."
  hi: "वर्तमान फ़ाइल को डिस्क पर सहेजें।"
  bn: "বর্তমান ফাইলটি ডিস্কে সংরক্ষণ করে।"
  zh: "将当前文件保存到磁盘。"
  ja: "現在のファイルをディスクに保存します。"
menu.item.file.save_as.help:
  en: "Save the current file under a new name."
  es: "Guarda el archivo actual con un nombre nuevo."
  fr: "Enregistre le fichier actuel sous un nouveau nom."
  de: "Speichert die aktuelle Datei unter einem neuen Namen."
  cy: "Cadw'r ffeil bresennol dan enw newydd."
  ga: "Sábháil an comhad reatha faoi ainm nua."
  gd: "Sàbhail am faidhle làithreach fo ainm ùr."
  pl: "Zapisuje bieżący plik pod nową nazwą."
  pt: "Salva o arquivo atual com um novo nome."
  ru: "Сохраняет текущий файл под новым именем."
  ar: "احفظ الملف الحالي باسم جديد."
  hi: "वर्तमान फ़ाइल को नए नाम से सहेजें।"
  bn: "বর্তমান ফাইলটি নতুন নামে সংরক্ষণ করে।"
  zh: "以新名称保存当前文件。"
  ja: "現在のファイルを新しい名前で保存します。"
menu.item.file.rename.help:
  en: "Rename the current file on disk."
  es: "Cambia el nombre del archivo actual en el disco."
  fr: "Renomme le fichier actuel sur le disque."
  de: "Benennt die aktuelle Datei auf dem Datenträger um."
  cy: "Ailenwi'r ffeil bresennol ar y ddisg."
  ga: "Athainmnigh an comhad reatha ar an diosca."
  gd: "Ath-ainmich am faidhle làithreach air an diosga."
  pl: "Zmienia nazwę bieżącego pliku na dysku."
  pt: "Renomeia o arquivo atual no disco."
  ru: "Переименовывает текущий файл на диске."
  ar: "أعد تسمية الملف الحالي على القرص."
  hi: "डिस्क पर वर्तमान फ़ाइल का नाम बदलें।"
  bn: "ডিস্কে বর্তমান ফাইলের নাম পরিবর্তন করে।"
  zh: "重命名磁盘上的当前文件。"
  ja: "ディスク上の現在のファイル名を変更します。"
menu.item.file.insert.help:
  en: "Insert another file's contents at the cursor."
menu.item.file.revert.help:
  en: "Reload the file from disk, discarding unsaved edits (undoable)."
menu.item.file.close.help:
  en: "Close the current tab."
  es: "Cierra la pestaña actual."
  fr: "Ferme l'onglet actuel."
  de: "Schließt den aktuellen Tab."
  cy: "Cau'r tab presennol."
  ga: "Dún an cluaisín reatha."
  gd: "Dùin an taba làithreach."
  pl: "Zamyka bieżącą kartę."
  pt: "Fecha a aba atual."
  ru: "Закрывает текущую вкладку."
  ar: "أغلق علامة التبويب الحالية."
  hi: "वर्तमान टैब बंद करें।"
  bn: "বর্তমান ট্যাব বন্ধ করে।"
  zh: "关闭当前标签页。"
  ja: "現在のタブを閉じます。"
menu.item.file.close_all.help:
  en: "Close every open tab."
  es: "Cierra todas las pestañas abiertas."
  fr: "Ferme tous les onglets ouverts."
  de: "Schließt alle geöffneten Tabs."
  cy: "Cau pob tab agored."
  ga: "Dún gach cluaisín oscailte."
  gd: "Dùin a h-uile taba fosgailte."
  pl: "Zamyka wszystkie otwarte karty."
  pt: "Fecha todas as abas abertas."
  ru: "Закрывает все открытые вкладки."
  ar: "أغلق كل علامات التبويب المفتوحة."
  hi: "सभी खुली टैब बंद करें।"
  bn: "সমস্ত খোলা ট্যাব বন্ধ করে।"
  zh: "关闭所有打开的标签页。"
  ja: "開いているすべてのタブを閉じます。"
menu.item.file.reopen_closed.help:
  en: "Reopen the most recently closed tab."
  es: "Vuelve a abrir la última pestaña cerrada."
  fr: "Rouvre le dernier onglet fermé."
  de: "Öffnet den zuletzt geschlossenen Tab erneut."
  cy: "Ailagor y tab a gaewyd ddiwethaf."
  ga: "Athoscail an cluaisín a dúnadh is déanaí."
  gd: "Ath-fhosgail an taba mu dheireadh a chaidh a dhùnadh."
  pl: "Ponownie otwiera ostatnio zamkniętą kartę."
  pt: "Reabre a última aba fechada."
  ru: "Повторно открывает последнюю закрытую вкладку."
  ar: "أعد فتح آخر علامة تبويب مغلقة."
  hi: "सबसे हाल में बंद की गई टैब फिर से खोलें।"
  bn: "সদ্য বন্ধ করা ট্যাবটি পুনরায় খোলে।"
  zh: "重新打开最近关闭的标签页。"
  ja: "最後に閉じたタブを再度開きます。"
menu.item.edit.find.help:
  en: "Search for text in the current file."
  es: "Busca texto en el archivo actual."
  fr: "Recherche du texte dans le fichier actuel."
  de: "Sucht nach Text in der aktuellen Datei."
  cy: "Chwilio am destun yn y ffeil bresennol."
  ga: "Cuardaigh téacs sa chomhad reatha."
  gd: "Lorg teacsa san fhaidhle làithreach."
  pl: "Wyszukuje tekst w bieżącym pliku."
  pt: "Pesquisa texto no arquivo atual."
  ru: "Ищет текст в текущем файле."
  ar: "ابحث عن نص في الملف الحالي."
  hi: "वर्तमान फ़ाइल में टेक्स्ट खोजें।"
  bn: "বর্তমান ফাইলে টেক্সট অনুসন্ধান করে।"
  zh: "在当前文件中搜索文本。"
  ja: "現在のファイル内でテキストを検索します。"
menu.item.edit.find_next.help:
  en: "Jump to the next search match."
  es: "Salta a la siguiente coincidencia de búsqueda."
  fr: "Passe à la correspondance de recherche suivante."
  de: "Springt zum nächsten Suchtreffer."
  cy: "Neidio i'r canlyniad chwilio nesaf."
  ga: "Léim go dtí an chéad toradh cuardaigh eile."
  gd: "Leum gun ath thoradh luirg."
  pl: "Przechodzi do następnego wyniku wyszukiwania."
  pt: "Vai para a próxima correspondência da busca."
  ru: "Переходит к следующему совпадению поиска."
  ar: "انتقل إلى نتيجة البحث التالية."
  hi: "अगले खोज मिलान पर जाएँ।"
  bn: "পরবর্তী অনুসন্ধান মিলে যাওয়া স্থানে যায়।"
  zh: "跳转到下一个搜索匹配项。"
  ja: "次の検索結果へ移動します。"
menu.item.edit.find_prev.help:
  en: "Jump to the previous search match."
  es: "Salta a la coincidencia de búsqueda anterior."
  fr: "Passe à la correspondance de recherche précédente."
  de: "Springt zum vorherigen Suchtreffer."
  cy: "Neidio i'r canlyniad chwilio blaenorol."
  ga: "Léim go dtí an toradh cuardaigh roimhe seo."
  gd: "Leum gun toradh luirg roimhe."
  pl: "Przechodzi do poprzedniego wyniku wyszukiwania."
  pt: "Vai para a correspondência anterior da busca."
  ru: "Переходит к предыдущему совпадению поиска."
  ar: "انتقل إلى نتيجة البحث السابقة."
  hi: "पिछले खोज मिलान पर जाएँ।"
  bn: "পূর্ববর্তী অনুসন্ধান মিলে যাওয়া স্থানে যায়।"
  zh: "跳转到上一个搜索匹配项。"
  ja: "前の検索結果へ移動します。"
menu.item.edit.find_selection.help:
  en: "Search for the next occurrence of the selected text."
  es: "Busca la siguiente aparición del texto seleccionado."
  fr: "Recherche l'occurrence suivante du texte sélectionné."
  de: "Sucht das nächste Vorkommen des ausgewählten Textes."
  cy: "Chwilio am ymddangosiad nesaf y testun a ddewiswyd."
  ga: "Cuardaigh an chéad láithreas eile den téacs roghnaithe."
  gd: "Lorg an ath thachartas dhen teacsa a thaghadh."
  pl: "Wyszukuje następne wystąpienie zaznaczonego tekstu."
  pt: "Busca a próxima ocorrência do texto selecionado."
  ru: "Ищет следующее вхождение выделенного текста."
  ar: "ابحث عن الظهور التالي للنص المحدد."
  hi: "चयनित टेक्स्ट की अगली उपस्थिति खोजें।"
  bn: "নির্বাচিত টেক্সটের পরবর্তী উপস্থিতি অনুসন্ধান করে।"
  zh: "查找所选文本的下一处出现。"
  ja: "選択したテキストの次の出現箇所を検索します。"
menu.item.edit.toggle_highlight.help:
  en: "Show or hide highlighting of search matches."
  es: "Muestra u oculta el resaltado de las coincidencias de búsqueda."
  fr: "Affiche ou masque la surbrillance des résultats de recherche."
  de: "Zeigt oder verbirgt die Hervorhebung von Suchtreffern."
  cy: "Dangos neu guddio amlygu canlyniadau chwilio."
  ga: "Taispeáin nó folaigh aibhsiú na dtorthaí cuardaigh."
  gd: "Seall no falaich soillseachadh nan toraidhean luirg."
  pl: "Pokazuje lub ukrywa podświetlenie wyników wyszukiwania."
  pt: "Mostra ou oculta o destaque das correspondências da busca."
  ru: "Показывает или скрывает подсветку совпадений поиска."
  ar: "أظهر أو أخفِ تمييز نتائج البحث."
  hi: "खोज मिलानों की हाइलाइटिंग दिखाएँ या छिपाएँ।"
  bn: "অনুসন্ধান মিলগুলির হাইলাইট দেখায় বা লুকায়।"
  zh: "显示或隐藏搜索匹配项的高亮。"
  ja: "検索結果のハイライト表示を切り替えます。"
menu.item.edit.find_in_files.help:
  en: "Search for text across all files in the workspace."
  es: "Busca texto en todos los archivos del espacio de trabajo."
  fr: "Recherche du texte dans tous les fichiers de l'espace de travail."
  de: "Sucht nach Text in allen Dateien des Arbeitsbereichs."
  cy: "Chwilio am destun ym mhob ffeil yn y gweithle."
  ga: "Cuardaigh téacs i ngach comhad sa spás oibre."
  gd: "Lorg teacsa anns a h-uile faidhle san rùm-obrach."
  pl: "Wyszukuje tekst we wszystkich plikach obszaru roboczego."
  pt: "Pesquisa texto em todos os arquivos do espaço de trabalho."
  ru: "Ищет текст во всех файлах рабочей области."
  ar: "ابحث عن نص في جميع ملفات مساحة العمل."
  hi: "वर्कस्पेस की सभी फ़ाइलों में टेक्स्ट खोजें।"
  bn: "ওয়ার্কস্পেসের সব ফাইলে টেক্সট অনুসন্ধান করে।"
  zh: "在工作区的所有文件中搜索文本。"
  ja: "ワークスペース内のすべてのファイルからテキストを検索します。"
menu.item.edit.replace_in_files.help:
  en: "Find and replace text across all files in the workspace."
  es: "Busca y reemplaza texto en todos los archivos del espacio de trabajo."
  fr: "Recherche et remplace du texte dans tous les fichiers de l'espace de travail."
  de: "Sucht und ersetzt Text in allen Dateien des Arbeitsbereichs."
  cy: "Chwilio ac amnewid testun ym mhob ffeil yn y gweithle."
  ga: "Aimsigh agus ionadaigh téacs i ngach comhad sa spás oibre."
  gd: "Lorg is cuir teacsa an àite ann an gach faidhle san rùm-obrach."
  pl: "Wyszukuje i zamienia tekst we wszystkich plikach obszaru roboczego."
  pt: "Localiza e substitui texto em todos os arquivos do espaço de trabalho."
  ru: "Находит и заменяет текст во всех файлах рабочей области."
  ar: "ابحث واستبدل النص في جميع ملفات مساحة العمل."
  hi: "वर्कस्पेस की सभी फ़ाइलों में टेक्स्ट खोजें और बदलें।"
  bn: "ওয়ার্কস্পেসের সব ফাইলে টেক্সট খুঁজে প্রতিস্থাপন করে।"
  zh: "在工作区的所有文件中查找并替换文本。"
  ja: "ワークスペース内のすべてのファイルでテキストを検索して置換します。"
menu.item.edit.search_workspace_dock.help:
  en: "Search the workspace in a docked results panel."
  es: "Busca en el espacio de trabajo con un panel de resultados acoplado."
  fr: "Recherche dans l'espace de travail via un panneau de résultats ancré."
  de: "Durchsucht den Arbeitsbereich in einem angedockten Ergebnisbereich."
  cy: "Chwilio'r gweithle mewn panel canlyniadau wedi'i angori."
  ga: "Cuardaigh an spás oibre i bpainéal torthaí ancaire."
  gd: "Lorg an rùm-obrach ann am panail thoraidhean acraichte."
  pl: "Przeszukuje obszar roboczy w zadokowanym panelu wyników."
  pt: "Pesquisa no espaço de trabalho em um painel de resultados acoplado."
  ru: "Ищет в рабочей области с закреплённой панелью результатов."
  ar: "ابحث في مساحة العمل ضمن لوحة نتائج مرسّاة."
  hi: "डॉक किए गए परिणाम पैनल में वर्कस्पेस खोजें।"
  bn: "একটি ডক করা ফলাফল প্যানেলে ওয়ার্কস্পেস অনুসন্ধান করে।"
  zh: "在停靠的结果面板中搜索工作区。"
  ja: "ドッキングした結果パネルでワークスペースを検索します。"
menu.item.edit.align.equals.help:
  en: "Align selected lines on their equals signs."
  es: "Alinea las líneas seleccionadas por sus signos de igual."
  fr: "Aligne les lignes sélectionnées sur leurs signes égal."
  de: "Richtet ausgewählte Zeilen an ihren Gleichheitszeichen aus."
  cy: "Alinio'r llinellau a ddewiswyd ar eu harwyddion hafal."
  ga: "Ailínigh na línte roghnaithe ar a gcomharthaí cothroime."
  gd: "Co-thaobhaich na loidhnichean a thaghadh air na comharran co-ionannachd."
  pl: "Wyrównuje zaznaczone wiersze według znaków równości."
  pt: "Alinha as linhas selecionadas pelos sinais de igual."
  ru: "Выравнивает выделенные строки по знакам равенства."
  ar: "حاذِ الأسطر المحددة على علامات المساواة."
  hi: "चयनित पंक्तियों को उनके बराबर चिह्नों पर संरेखित करें।"
  bn: "নির্বাচিত লাইনগুলিকে তাদের সমান চিহ্ন অনুযায়ী সারিবদ্ধ করে।"
  zh: "按等号对齐所选行。"
  ja: "選択した行を等号の位置で揃えます。"
menu.item.edit.align.colon.help:
  en: "Align the selected lines on the colon character."
  es: "Alinea las líneas seleccionadas por el carácter de dos puntos."
  fr: "Aligner les lignes sélectionnées sur le caractère deux-points."
  de: "Richtet die ausgewählten Zeilen am Doppelpunkt aus."
  cy: "Alinio'r llinellau dewisedig ar y colon."
  ga: "Ailínigh na línte roghnaithe ar an idirstad."
  gd: "Co-thaobhaich na loidhnichean taghte air a' chòilean."
  pl: "Wyrównaj zaznaczone wiersze względem dwukropka."
  pt: "Alinha as linhas selecionadas pelo caractere de dois-pontos."
  ru: "Выровнять выделенные строки по двоеточию."
  ar: "محاذاة الأسطر المحددة على النقطتين الرأسيتين."
  hi: "चयनित पंक्तियों को कोलन वर्ण पर संरेखित करें।"
  bn: "নির্বাচিত লাইনগুলি কোলন অক্ষরে সারিবদ্ধ করুন।"
  zh: "将选中的行按冒号字符对齐。"
  ja: "選択した行をコロン文字で揃えます。"
menu.item.edit.align.comma.help:
  en: "Align the selected lines on the comma character."
  es: "Alinea las líneas seleccionadas por el carácter de coma."
  fr: "Aligner les lignes sélectionnées sur le caractère virgule."
  de: "Richtet die ausgewählten Zeilen am Komma aus."
  cy: "Alinio'r llinellau dewisedig ar y goma."
  ga: "Ailínigh na línte roghnaithe ar an gcamóg."
  gd: "Co-thaobhaich na loidhnichean taghte air a' chromag."
  pl: "Wyrównaj zaznaczone wiersze względem przecinka."
  pt: "Alinha as linhas selecionadas pelo caractere de vírgula."
  ru: "Выровнять выделенные строки по запятой."
  ar: "محاذاة الأسطر المحددة على الفاصلة."
  hi: "चयनित पंक्तियों को अल्पविराम वर्ण पर संरेखित करें।"
  bn: "নির্বাচিত লাইনগুলি কমা অক্ষরে সারিবদ্ধ করুন।"
  zh: "将选中的行按逗号字符对齐。"
  ja: "選択した行をカンマ文字で揃えます。"
menu.item.edit.align.pipe.help:
  en: "Align the selected lines on the pipe character."
  es: "Alinea las líneas seleccionadas por el carácter de barra vertical."
  fr: "Aligner les lignes sélectionnées sur le caractère barre verticale."
  de: "Richtet die ausgewählten Zeilen am senkrechten Strich aus."
  cy: "Alinio'r llinellau dewisedig ar y bibell."
  ga: "Ailínigh na línte roghnaithe ar an bpíopa."
  gd: "Co-thaobhaich na loidhnichean taghte air a' phìob."
  pl: "Wyrównaj zaznaczone wiersze względem kreski pionowej."
  pt: "Alinha as linhas selecionadas pelo caractere de barra vertical."
  ru: "Выровнять выделенные строки по вертикальной черте."
  ar: "محاذاة الأسطر المحددة على الشرطة العمودية."
  hi: "चयनित पंक्तियों को पाइप वर्ण पर संरेखित करें।"
  bn: "নির্বাচিত লাইনগুলি পাইপ অক্ষরে সারিবদ্ধ করুন।"
  zh: "将选中的行按竖线字符对齐。"
  ja: "選択した行を縦棒文字で揃えます。"
menu.item.edit.surround.paren.help:
  en: "Wrap the selection in parentheses."
  es: "Rodea la selección con paréntesis."
  fr: "Entourer la sélection de parenthèses."
  de: "Umschließt die Auswahl mit runden Klammern."
  cy: "Amgáu'r dewisiad mewn cromfachau crwn."
  ga: "Cuir lúibíní timpeall an roghnúcháin."
  gd: "Cuairtich an taghadh le camagan."
  pl: "Otocz zaznaczenie nawiasami okrągłymi."
  pt: "Envolve a seleção com parênteses."
  ru: "Заключить выделение в круглые скобки."
  ar: "إحاطة التحديد بأقواس دائرية."
  hi: "चयन को कोष्ठक में लपेटें।"
  bn: "নির্বাচনটি বন্ধনীতে আবৃত করুন।"
  zh: "用圆括号包裹选区。"
  ja: "選択範囲を丸括弧で囲みます。"
menu.item.edit.surround.bracket.help:
  en: "Wrap the selection in square brackets."
  es: "Rodea la selección con corchetes."
  fr: "Entourer la sélection de crochets."
  de: "Umschließt die Auswahl mit eckigen Klammern."
  cy: "Amgáu'r dewisiad mewn cromfachau petryal."
  ga: "Cuir lúibíní cearnacha timpeall an roghnúcháin."
  gd: "Cuairtich an taghadh le camagan ceàrnach."
  pl: "Otocz zaznaczenie nawiasami kwadratowymi."
  pt: "Envolve a seleção com colchetes."
  ru: "Заключить выделение в квадратные скобки."
  ar: "إحاطة التحديد بأقواس مربعة."
  hi: "चयन को वर्ग कोष्ठक में लपेटें।"
  bn: "নির্বাচনটি বর্গাকার বন্ধনীতে আবৃত করুন।"
  zh: "用方括号包裹选区。"
  ja: "選択範囲を角括弧で囲みます。"
menu.item.edit.surround.brace.help:
  en: "Wrap the selection in curly braces."
  es: "Rodea la selección con llaves."
  fr: "Entourer la sélection d'accolades."
  de: "Umschließt die Auswahl mit geschweiften Klammern."
  cy: "Amgáu'r dewisiad mewn cromfachau cyrliog."
  ga: "Cuir lúibíní slabhracha timpeall an roghnúcháin."
  gd: "Cuairtich an taghadh le camagan fiar."
  pl: "Otocz zaznaczenie nawiasami klamrowymi."
  pt: "Envolve a seleção com chaves."
  ru: "Заключить выделение в фигурные скобки."
  ar: "إحاطة التحديد بأقواس معقوفة."
  hi: "चयन को कुंडलित कोष्ठक में लपेटें।"
  bn: "নির্বাচনটি কোঁকড়া বন্ধনীতে আবৃত করুন।"
  zh: "用花括号包裹选区。"
  ja: "選択範囲を波括弧で囲みます。"
menu.item.edit.surround.angle.help:
  en: "Wrap the selection in angle brackets."
  es: "Rodea la selección con corchetes angulares."
  fr: "Entourer la sélection de chevrons."
  de: "Umschließt die Auswahl mit spitzen Klammern."
  cy: "Amgáu'r dewisiad mewn cromfachau onglog."
  ga: "Cuir lúibíní uilleacha timpeall an roghnúcháin."
  gd: "Cuairtich an taghadh le camagan ceàrnagach."
  pl: "Otocz zaznaczenie nawiasami kątowymi."
  pt: "Envolve a seleção com colchetes angulares."
  ru: "Заключить выделение в угловые скобки."
  ar: "إحاطة التحديد بأقواس زاوية."
  hi: "चयन को कोण कोष्ठक में लपेटें।"
  bn: "নির্বাচনটি কোণ বন্ধনীতে আবৃত করুন।"
  zh: "用尖括号包裹选区。"
  ja: "選択範囲を山括弧で囲みます。"
menu.item.edit.surround.double_quote.help:
  en: "Wrap the selection in double quotes."
  es: "Rodea la selección con comillas dobles."
  fr: "Entourer la sélection de guillemets doubles."
  de: "Umschließt die Auswahl mit doppelten Anführungszeichen."
  cy: "Amgáu'r dewisiad mewn dyfynodau dwbl."
  ga: "Cuir comharthaí athfhriotail dúbailte timpeall an roghnúcháin."
  gd: "Cuairtich an taghadh le comharran-labhairt dùbailte."
  pl: "Otocz zaznaczenie cudzysłowami podwójnymi."
  pt: "Envolve a seleção com aspas duplas."
  ru: "Заключить выделение в двойные кавычки."
  ar: "إحاطة التحديد بعلامتي اقتباس مزدوجتين."
  hi: "चयन को दोहरे उद्धरण चिह्नों में लपेटें।"
  bn: "নির্বাচনটি দ্বিগুণ উদ্ধৃতি চিহ্নে আবৃত করুন।"
  zh: "用双引号包裹选区。"
  ja: "選択範囲を二重引用符で囲みます。"
menu.item.edit.surround.single_quote.help:
  en: "Wrap the selection in single quotes."
  es: "Rodea la selección con comillas simples."
  fr: "Entourer la sélection de guillemets simples."
  de: "Umschließt die Auswahl mit einfachen Anführungszeichen."
  cy: "Amgáu'r dewisiad mewn dyfynodau sengl."
  ga: "Cuir comharthaí athfhriotail singil timpeall an roghnúcháin."
  gd: "Cuairtich an taghadh le comharran-labhairt singilte."
  pl: "Otocz zaznaczenie cudzysłowami pojedynczymi."
  pt: "Envolve a seleção com aspas simples."
  ru: "Заключить выделение в одинарные кавычки."
  ar: "إحاطة التحديد بعلامتي اقتباس مفردتين."
  hi: "चयन को एकल उद्धरण चिह्नों में लपेटें।"
  bn: "নির্বাচনটি একক উদ্ধৃতি চিহ্নে আবৃত করুন।"
  zh: "用单引号包裹选区。"
  ja: "選択範囲を単一引用符で囲みます。"
menu.item.edit.surround.backtick.help:
  en: "Wrap the selection in backticks."
  es: "Rodea la selección con acentos graves."
  fr: "Entourer la sélection d'accents graves."
  de: "Umschließt die Auswahl mit Backticks."
  cy: "Amgáu'r dewisiad mewn ôl-dicau."
  ga: "Cuir cúldticeanna timpeall an roghnúcháin."
  gd: "Cuairtich an taghadh le backticks."
  pl: "Otocz zaznaczenie znakami wstecznego apostrofu."
  pt: "Envolve a seleção com crases."
  ru: "Заключить выделение в обратные кавычки."
  ar: "إحاطة التحديد بعلامات الاقتباس الخلفية."
  hi: "चयन को बैकटिक में लपेटें।"
  bn: "নির্বাচনটি ব্যাকটিকে আবৃত করুন।"
  zh: "用反引号包裹选区。"
  ja: "選択範囲をバッククォートで囲みます。"
menu.item.edit.undo.help:
  en: "Undo the last change."
  es: "Deshace el último cambio."
  fr: "Annuler la dernière modification."
  de: "Macht die letzte Änderung rückgängig."
  cy: "Dadwneud y newid diwethaf."
  ga: "Cealaigh an t-athrú deireanach."
  gd: "Neo-dhèan an t-atharrachadh mu dheireadh."
  pl: "Cofnij ostatnią zmianę."
  pt: "Desfaz a última alteração."
  ru: "Отменить последнее изменение."
  ar: "التراجع عن آخر تغيير."
  hi: "अंतिम परिवर्तन को पूर्ववत करें।"
  bn: "শেষ পরিবর্তনটি পূর্বাবস্থায় ফেরান।"
  zh: "撤销上一次更改。"
  ja: "直前の変更を元に戻します。"
menu.item.edit.redo.help:
  en: "Redo the last undone change."
  es: "Rehace el último cambio deshecho."
  fr: "Rétablir la dernière modification annulée."
  de: "Stellt die letzte rückgängig gemachte Änderung wieder her."
  cy: "Ailwneud y newid a ddadwnaethpwyd ddiwethaf."
  ga: "Athdhéan an t-athrú a cealaíodh go deireanach."
  gd: "Ath-dhèan an t-atharrachadh mu dheireadh a chaidh a neo-dhèanamh."
  pl: "Ponów ostatnią cofniętą zmianę."
  pt: "Refaz a última alteração desfeita."
  ru: "Вернуть последнее отменённое изменение."
  ar: "إعادة آخر تغيير تم التراجع عنه."
  hi: "अंतिम पूर्ववत परिवर्तन को फिर से करें।"
  bn: "শেষ পূর্বাবস্থায় ফেরানো পরিবর্তনটি পুনরায় করুন।"
  zh: "重做上一次撤销的更改。"
  ja: "直前に取り消した変更をやり直します。"
menu.item.edit.undo_branch.help:
  en: "Switch to another branch in the undo history."
  es: "Cambia a otra rama del historial de deshacer."
  fr: "Basculer vers une autre branche de l'historique d'annulation."
  de: "Wechselt zu einem anderen Zweig im Rückgängig-Verlauf."
  cy: "Newid i gangen arall yn yr hanes dadwneud."
  ga: "Athraigh go brainse eile i stair na gcealuithe."
  gd: "Gluais gu geug eile ann an eachdraidh an neo-dhèanaidh."
  pl: "Przełącz na inną gałąź w historii cofania."
  pt: "Alterna para outro ramo no histórico de desfazer."
  ru: "Переключиться на другую ветку в истории отмен."
  ar: "التبديل إلى فرع آخر في سجل التراجع."
  hi: "पूर्ववत इतिहास में किसी अन्य शाखा पर स्विच करें।"
  bn: "পূর্বাবস্থা ইতিহাসে অন্য শাখায় স্যুইচ করুন।"
  zh: "切换到撤销历史中的另一个分支。"
  ja: "取り消し履歴の別のブランチに切り替えます。"
menu.item.edit.cut.help:
  en: "Cut the selection to the clipboard."
  es: "Corta la selección al portapapeles."
  fr: "Couper la sélection vers le presse-papiers."
  de: "Schneidet die Auswahl in die Zwischenablage aus."
  cy: "Torri'r dewisiad i'r clipfwrdd."
  ga: "Gearr an roghnúchán go dtí an ghearrthaisce."
  gd: "Geàrr an taghadh dhan bhòrd-chliopaichean."
  pl: "Wytnij zaznaczenie do schowka."
  pt: "Recorta a seleção para a área de transferência."
  ru: "Вырезать выделение в буфер обмена."
  ar: "قص التحديد إلى الحافظة."
  hi: "चयन को क्लिपबोर्ड में काटें।"
  bn: "নির্বাচনটি ক্লিপবোর্ডে কাটুন।"
  zh: "将选区剪切到剪贴板。"
  ja: "選択範囲を切り取ってクリップボードに送ります。"
menu.item.edit.copy.help:
  en: "Copy the selection to the clipboard."
  es: "Copia la selección al portapapeles."
  fr: "Copier la sélection vers le presse-papiers."
  de: "Kopiert die Auswahl in die Zwischenablage."
  cy: "Copïo'r dewisiad i'r clipfwrdd."
  ga: "Cóipeáil an roghnúchán go dtí an ghearrthaisce."
  gd: "Dèan lethbhreac den taghadh dhan bhòrd-chliopaichean."
  pl: "Kopiuj zaznaczenie do schowka."
  pt: "Copia a seleção para a área de transferência."
  ru: "Скопировать выделение в буфер обмена."
  ar: "نسخ التحديد إلى الحافظة."
  hi: "चयन को क्लिपबोर्ड में कॉपी करें।"
  bn: "নির্বাচনটি ক্লিপবোর্ডে কপি করুন।"
  zh: "将选区复制到剪贴板。"
  ja: "選択範囲をクリップボードにコピーします。"
menu.item.edit.paste.help:
  en: "Paste the clipboard contents at the cursor."
  es: "Pega el contenido del portapapeles en el cursor."
  fr: "Coller le contenu du presse-papiers au curseur."
  de: "Fügt den Inhalt der Zwischenablage an der Cursorposition ein."
  cy: "Gludo cynnwys y clipfwrdd wrth y cyrchwr."
  ga: "Greamaigh ábhar na gearrthaisce ag an gcúrsóir."
  gd: "Cuir a-steach susbaint a' bhòrd-chliopaichean aig a' chùrsair."
  pl: "Wklej zawartość schowka w miejscu kursora."
  pt: "Cola o conteúdo da área de transferência no cursor."
  ru: "Вставить содержимое буфера обмена в позицию курсора."
  ar: "لصق محتوى الحافظة عند المؤشر."
  hi: "क्लिपबोर्ड की सामग्री को कर्सर पर पेस्ट करें।"
  bn: "কার্সারে ক্লিপবোর্ডের বিষয়বস্তু পেস্ট করুন।"
  zh: "将剪贴板内容粘贴到光标处。"
  ja: "クリップボードの内容をカーソル位置に貼り付けます。"
menu.item.edit.paste_from_history.help:
  en: "Choose a past clipboard entry to paste."
  es: "Elige una entrada anterior del portapapeles para pegar."
  fr: "Choisir une entrée passée du presse-papiers à coller."
  de: "Wählt einen früheren Zwischenablage-Eintrag zum Einfügen aus."
  cy: "Dewis cofnod clipfwrdd blaenorol i'w ludo."
  ga: "Roghnaigh iontráil ghearrthaisce roimhe seo le greamú."
  gd: "Tagh clàr-bòrd-chliopaichean roimhe airson a chur a-steach."
  pl: "Wybierz wcześniejszy wpis schowka do wklejenia."
  pt: "Escolhe uma entrada anterior da área de transferência para colar."
  ru: "Выбрать из истории буфера обмена запись для вставки."
  ar: "اختيار عنصر سابق من الحافظة للصقه."
  hi: "पेस्ट करने के लिए पिछली क्लिपबोर्ड प्रविष्टि चुनें।"
  bn: "পেস্ট করতে পূর্ববর্তী ক্লিপবোর্ড এন্ট্রি বেছে নিন।"
  zh: "选择一个历史剪贴板条目进行粘贴。"
  ja: "貼り付ける過去のクリップボード項目を選びます。"
menu.item.edit.select_menu.help:
  en: "Open commands for selecting text."
  es: "Abre comandos para seleccionar texto."
  fr: "Ouvrir les commandes de sélection de texte."
  de: "Öffnet Befehle zum Auswählen von Text."
  cy: "Agor gorchmynion ar gyfer dewis testun."
  ga: "Oscail orduithe chun téacs a roghnú."
  gd: "Fosgail àitheantan airson teacsa a thaghadh."
  pl: "Otwiera polecenia zaznaczania tekstu."
  pt: "Abre comandos para selecionar texto."
  ru: "Открыть команды выделения текста."
  ar: "فتح أوامر تحديد النص."
  hi: "टेक्स्ट चयन के लिए कमांड खोलें।"
  bn: "টেক্সট নির্বাচনের কমান্ড খুলুন।"
  zh: "打开用于选择文本的命令。"
  ja: "テキストを選択するためのコマンドを開きます。"
menu.item.edit.lines_menu.help:
  en: "Open commands for editing whole lines."
  es: "Abre comandos para editar líneas completas."
  fr: "Ouvrir les commandes d'édition de lignes entières."
  de: "Öffnet Befehle zum Bearbeiten ganzer Zeilen."
  cy: "Agor gorchmynion ar gyfer golygu llinellau cyfan."
  ga: "Oscail orduithe chun línte iomlána a chur in eagar."
  gd: "Fosgail àitheantan airson loidhnichean slàna a dheasachadh."
  pl: "Otwiera polecenia edycji całych wierszy."
  pt: "Abre comandos para editar linhas inteiras."
  ru: "Открыть команды редактирования целых строк."
  ar: "فتح أوامر تحرير الأسطر الكاملة."
  hi: "पूरी पंक्तियों को संपादित करने के लिए कमांड खोलें।"
  bn: "সম্পূর্ণ লাইন সম্পাদনার কমান্ড খুলুন।"
  zh: "打开用于编辑整行的命令。"
  ja: "行全体を編集するためのコマンドを開きます。"
menu.item.edit.surround_menu.help:
  en: "Open commands to wrap the selection in delimiters."
  es: "Abre comandos para rodear la selección con delimitadores."
  fr: "Ouvrir les commandes pour entourer la sélection de délimiteurs."
  de: "Öffnet Befehle, um die Auswahl mit Begrenzern zu umschließen."
  cy: "Agor gorchmynion i amgáu'r dewisiad mewn amffinyddion."
  ga: "Oscail orduithe chun teormharcóirí a chur timpeall an roghnúcháin."
  gd: "Fosgail àitheantan airson an taghadh a chuairteachadh le crìoch-chomharran."
  pl: "Otwiera polecenia otaczania zaznaczenia ogranicznikami."
  pt: "Abre comandos para envolver a seleção com delimitadores."
  ru: "Открыть команды для заключения выделения в разделители."
  ar: "فتح أوامر لإحاطة التحديد بمحددات."
  hi: "चयन को सीमांकक में लपेटने के लिए कमांड खोलें।"
  bn: "নির্বাচনটি সীমানাচিহ্নে আবৃত করার কমান্ড খুলুন।"
  zh: "打开用分隔符包裹选区的命令。"
  ja: "選択範囲を区切り記号で囲むコマンドを開きます。"
menu.item.edit.align_menu.help:
  en: "Open commands to align lines on a character."
  es: "Abre comandos para alinear líneas por un carácter."
  fr: "Ouvrir les commandes pour aligner les lignes sur un caractère."
  de: "Öffnet Befehle, um Zeilen an einem Zeichen auszurichten."
  cy: "Agor gorchmynion i alinio llinellau ar nod."
  ga: "Oscail orduithe chun línte a ailíniú ar charachtar."
  gd: "Fosgail àitheantan airson loidhnichean a cho-thaobhadh air caractar."
  pl: "Otwiera polecenia wyrównywania wierszy względem znaku."
  pt: "Abre comandos para alinhar linhas por um caractere."
  ru: "Открыть команды выравнивания строк по символу."
  ar: "فتح أوامر لمحاذاة الأسطر على حرف."
  hi: "किसी वर्ण पर पंक्तियों को संरेखित करने के लिए कमांड खोलें।"
  bn: "একটি অক্ষরে লাইন সারিবদ্ধ করার কমান্ড খুলুন।"
  zh: "打开按字符对齐行的命令。"
  ja: "文字を基準に行を揃えるコマンドを開きます。"
menu.item.edit.find_menu.help:
  en: "Open find and search commands."
  es: "Abre comandos de buscar y búsqueda."
  fr: "Ouvrir les commandes de recherche."
  de: "Öffnet Befehle zum Suchen und Finden."
  cy: "Agor gorchmynion canfod a chwilio."
  ga: "Oscail orduithe aimsithe agus cuardaigh."
  gd: "Fosgail àitheantan lorg is sireadh."
  pl: "Otwiera polecenia znajdowania i wyszukiwania."
  pt: "Abre comandos de localizar e pesquisar."
  ru: "Открыть команды поиска."
  ar: "فتح أوامر البحث والعثور."
  hi: "खोज और सर्च कमांड खोलें।"
  bn: "খুঁজুন এবং অনুসন্ধান কমান্ড খুলুন।"
  zh: "打开查找和搜索命令。"
  ja: "検索コマンドを開きます。"
menu.item.edit.mode.help:
  en: "Open commands for switching the editing mode."
  es: "Abre comandos para cambiar el modo de edición."
  fr: "Ouvrir les commandes pour changer de mode d'édition."
  de: "Öffnet Befehle zum Wechseln des Bearbeitungsmodus."
  cy: "Agor gorchmynion i newid y modd golygu."
  ga: "Oscail orduithe chun an mód eagarthóireachta a athrú."
  gd: "Fosgail àitheantan airson am modh deasachaidh atharrachadh."
  pl: "Otwiera polecenia zmiany trybu edycji."
  pt: "Abre comandos para alternar o modo de edição."
  ru: "Открыть команды переключения режима редактирования."
  ar: "فتح أوامر تبديل وضع التحرير."
  hi: "संपादन मोड बदलने के लिए कमांड खोलें।"
  bn: "সম্পাদনা মোড পরিবর্তনের কমান্ড খুলুন।"
  zh: "打开切换编辑模式的命令。"
  ja: "編集モードを切り替えるコマンドを開きます。"
menu.item.edit.toggle_comment.help:
  en: "Toggle comments on the selected lines."
  es: "Alterna los comentarios en las líneas seleccionadas."
  fr: "Activer ou désactiver les commentaires sur les lignes sélectionnées."
  de: "Schaltet Kommentare für die ausgewählten Zeilen um."
  cy: "Toglo sylwadau ar y llinellau dewisedig."
  ga: "Scoránaigh nótaí tráchta ar na línte roghnaithe."
  gd: "Toglaich beachdan air na loidhnichean taghte."
  pl: "Przełącz komentarze w zaznaczonych wierszach."
  pt: "Alterna os comentários nas linhas selecionadas."
  ru: "Переключить комментирование выделенных строк."
  ar: "تبديل التعليقات على الأسطر المحددة."
  hi: "चयनित पंक्तियों पर टिप्पणियाँ टॉगल करें।"
  bn: "নির্বাচিত লাইনে মন্তব্য টগল করুন।"
  zh: "切换选中行的注释。"
  ja: "選択した行のコメントを切り替えます。"
menu.item.edit.comment_banner.help:
  en: "Wrap the selection in a decorative comment banner."
  es: "Envuelve la selección en un banner de comentario decorativo."
  fr: "Encadre la sélection dans une bannière de commentaire décorative."
  de: "Umschließt die Auswahl mit einem dekorativen Kommentarbanner."
  cy: "Amgáu'r dewisiad mewn baner sylw addurniadol."
  ga: "Fill an roghnúchán i mbratach tráchta maisiúil."
  gd: "Cuairtich an taghadh ann am bratach beachd sgeadachail."
  pl: "Otacza zaznaczenie ozdobnym banerem komentarza."
  pt: "Envolve a seleção num banner de comentário decorativo."
  ru: "Оборачивает выделение в декоративный баннер-комментарий."
  ar: "يحيط التحديد بلافتة تعليق زخرفية."
  hi: "चयन को एक सजावटी टिप्पणी बैनर में लपेटें।"
  bn: "নির্বাচনটিকে একটি সাজানো কমেন্ট ব্যানারে মুড়ে দিন।"
  zh: "用装饰性注释横幅包裹所选内容。"
  ja: "選択範囲を装飾的なコメントバナーで囲みます。"
menu.item.edit.emmet_expand.help:
  en: "Expand the Emmet abbreviation at the cursor."
  es: "Expande la abreviatura Emmet en el cursor."
  fr: "Développe l'abréviation Emmet au niveau du curseur."
  de: "Erweitert die Emmet-Abkürzung an der Cursorposition."
  cy: "Ehangu'r byrfodd Emmet wrth y cyrchwr."
  ga: "Leathnaigh an giorrúchán Emmet ag an gcúrsóir."
  gd: "Leudaich an giorrachadh Emmet aig a' chùrsair."
  pl: "Rozwija skrót Emmet w miejscu kursora."
  pt: "Expande a abreviatura Emmet no cursor."
  ru: "Разворачивает сокращение Emmet в позиции курсора."
  ar: "يوسّع اختصار Emmet عند المؤشر."
  hi: "कर्सर पर Emmet संक्षिप्त रूप का विस्तार करें।"
  bn: "কার্সারে থাকা Emmet সংক্ষেপটি বিস্তৃত করুন।"
  zh: "展开光标处的 Emmet 缩写。"
  ja: "カーソル位置の Emmet 略記を展開します。"
menu.item.edit.toggle_value.help:
  en: "Toggle the value under the cursor, such as true or false."
  es: "Alterna el valor bajo el cursor, como true o false."
  fr: "Bascule la valeur sous le curseur, comme true ou false."
  de: "Schaltet den Wert unter dem Cursor um, etwa true oder false."
  cy: "Toglo'r gwerth o dan y cyrchwr, fel true neu false."
  ga: "Scoránaigh an luach faoin gcúrsóir, ar nós true nó false."
  gd: "Toglaich an luach fon chùrsair, mar true no false."
  pl: "Przełącza wartość pod kursorem, np. true lub false."
  pt: "Alterna o valor sob o cursor, como true ou false."
  ru: "Переключает значение под курсором, например true или false."
  ar: "يبدّل القيمة تحت المؤشر، مثل true أو false."
  hi: "कर्सर के नीचे मान को टॉगल करें, जैसे true या false।"
  bn: "কার্সারের নিচের মান টগল করুন, যেমন true বা false।"
  zh: "切换光标下的值，例如 true 或 false。"
  ja: "カーソル下の値（true や false など）を切り替えます。"
menu.item.edit.delete_menu.help:
  en: "Delete the text unit at the cursor: character, word, sentence, paragraph or section."
  es: "Elimina la unidad de texto en el cursor: carácter, palabra, oración, párrafo o sección."
  fr: "Supprime l'unité de texte au curseur : caractère, mot, phrase, paragraphe ou section."
  de: "Löscht die Texteinheit am Cursor: Zeichen, Wort, Satz, Absatz oder Abschnitt."
  cy: "Dileu'r uned destun wrth y cyrchwr: nod, gair, brawddeg, paragraff neu adran."
  ga: "Scrios an t-aonad téacs ag an gcúrsóir: carachtar, focal, abairt, alt nó roinn."
  gd: "Sguab às an t-aonad teacsa aig a' chùrsair: caractar, facal, seantans, paragraf no earrann."
  pl: "Usuwa jednostkę tekstu przy kursorze: znak, słowo, zdanie, akapit lub sekcję."
  pt: "Exclui a unidade de texto no cursor: caractere, palavra, frase, parágrafo ou seção."
  ru: "Удаляет текстовую единицу у курсора: символ, слово, предложение, абзац или раздел."
  ar: "يحذف وحدة النص عند المؤشر: حرف أو كلمة أو جملة أو فقرة أو قسم."
  hi: "कर्सर पर पाठ इकाई हटाएँ: अक्षर, शब्द, वाक्य, अनुच्छेद या अनुभाग।"
  bn: "কার্সারে থাকা লেখার একক মুছুন: অক্ষর, শব্দ, বাক্য, অনুচ্ছেদ বা বিভাগ।"
  zh: "删除光标处的文本单位：字符、单词、句子、段落或小节。"
  ja: "カーソル位置のテキスト単位（文字・単語・文・段落・セクション）を削除します。"
menu.item.edit.delete.character.help:
  en: "Delete the character at the cursor."
  es: "Elimina el carácter en el cursor."
  fr: "Supprime le caractère au curseur."
  de: "Löscht das Zeichen am Cursor."
  cy: "Dileu'r nod wrth y cyrchwr."
  ga: "Scrios an carachtar ag an gcúrsóir."
  gd: "Sguab às an caractar aig a' chùrsair."
  pl: "Usuwa znak przy kursorze."
  pt: "Exclui o caractere no cursor."
  ru: "Удаляет символ у курсора."
  ar: "يحذف الحرف عند المؤشر."
  hi: "कर्सर पर मौजूद अक्षर हटाएँ।"
  bn: "কার্সারে থাকা অক্ষরটি মুছুন।"
  zh: "删除光标处的字符。"
  ja: "カーソル位置の文字を削除します。"
menu.item.edit.delete.word.help:
  en: "Delete the word at the cursor, along with the spacing after it."
  es: "Elimina la palabra en el cursor, junto con el espacio que la sigue."
  fr: "Supprime le mot au curseur, ainsi que l'espace qui le suit."
  de: "Löscht das Wort am Cursor samt dem Leerraum dahinter."
  cy: "Dileu'r gair wrth y cyrchwr, ynghyd â'r bwlch ar ei ôl."
  ga: "Scrios an focal ag an gcúrsóir, mar aon leis an spás ina dhiaidh."
  gd: "Sguab às am facal aig a' chùrsair, còmhla ris an àite às a dhèidh."
  pl: "Usuwa słowo przy kursorze wraz z odstępem po nim."
  pt: "Exclui a palavra no cursor, junto com o espaço depois dela."
  ru: "Удаляет слово у курсора вместе с пробелом после него."
  ar: "يحذف الكلمة عند المؤشر مع المسافة التي تليها."
  hi: "कर्सर पर मौजूद शब्द और उसके बाद का स्थान हटाएँ।"
  bn: "কার্সারে থাকা শব্দ এবং তার পরের ফাঁক মুছুন।"
  zh: "删除光标处的单词及其后的空格。"
  ja: "カーソル位置の単語と、その後ろの空白を削除します。"
menu.item.edit.delete.sentence.help:
  en: "Delete the sentence at the cursor, along with the spacing after it."
  es: "Elimina la oración en el cursor, junto con el espacio que la sigue."
  fr: "Supprime la phrase au curseur, ainsi que l'espace qui la suit."
  de: "Löscht den Satz am Cursor samt dem Leerraum dahinter."
  cy: "Dileu'r frawddeg wrth y cyrchwr, ynghyd â'r bwlch ar ei hôl."
  ga: "Scrios an abairt ag an gcúrsóir, mar aon leis an spás ina diaidh."
  gd: "Sguab às an seantans aig a' chùrsair, còmhla ris an àite às a dhèidh."
  pl: "Usuwa zdanie przy kursorze wraz z odstępem po nim."
  pt: "Exclui a frase no cursor, junto com o espaço depois dela."
  ru: "Удаляет предложение у курсора вместе с пробелом после него."
  ar: "يحذف الجملة عند المؤشر مع المسافة التي تليها."
  hi: "कर्सर पर मौजूद वाक्य और उसके बाद का स्थान हटाएँ।"
  bn: "কার্সারে থাকা বাক্য এবং তার পরের ফাঁক মুছুন।"
  zh: "删除光标处的句子及其后的空格。"
  ja: "カーソル位置の文と、その後ろの空白を削除します。"
menu.item.edit.delete.paragraph.help:
  en: "Delete the paragraph at the cursor, along with the blank lines after it."
  es: "Elimina el párrafo en el cursor, junto con las líneas en blanco que lo siguen."
  fr: "Supprime le paragraphe au curseur, ainsi que les lignes vides qui le suivent."
  de: "Löscht den Absatz am Cursor samt den Leerzeilen dahinter."
  cy: "Dileu'r paragraff wrth y cyrchwr, ynghyd â'r llinellau gwag ar ei ôl."
  ga: "Scrios an t-alt ag an gcúrsóir, mar aon leis na línte bána ina dhiaidh."
  gd: "Sguab às am paragraf aig a' chùrsair, còmhla ris na loidhnichean bàna às a dhèidh."
  pl: "Usuwa akapit przy kursorze wraz z pustymi wierszami po nim."
  pt: "Exclui o parágrafo no cursor, junto com as linhas em branco depois dele."
  ru: "Удаляет абзац у курсора вместе с пустыми строками после него."
  ar: "يحذف الفقرة عند المؤشر مع الأسطر الفارغة التي تليها."
  hi: "कर्सर पर मौजूद अनुच्छेद और उसके बाद की खाली पंक्तियाँ हटाएँ।"
  bn: "কার্সারে থাকা অনুচ্ছেদ এবং তার পরের ফাঁকা লাইনগুলি মুছুন।"
  zh: "删除光标处的段落及其后的空行。"
  ja: "カーソル位置の段落と、その後ろの空行を削除します。"
menu.item.edit.delete.section.help:
  en: "Delete the section at the cursor, along with the break after it."
  es: "Elimina la sección en el cursor, junto con el salto que la sigue."
  fr: "Supprime la section au curseur, ainsi que la coupure qui la suit."
  de: "Löscht den Abschnitt am Cursor samt dem Umbruch dahinter."
  cy: "Dileu'r adran wrth y cyrchwr, ynghyd â'r bwlch ar ei hôl."
  ga: "Scrios an roinn ag an gcúrsóir, mar aon leis an mbriseadh ina diaidh."
  gd: "Sguab às an earrann aig a' chùrsair, còmhla ris a' bhriseadh às a dhèidh."
  pl: "Usuwa sekcję przy kursorze wraz z przerwą po niej."
  pt: "Exclui a seção no cursor, junto com a quebra depois dela."
  ru: "Удаляет раздел у курсора вместе с разрывом после него."
  ar: "يحذف القسم عند المؤشر مع الفاصل الذي يليه."
  hi: "कर्सर पर मौजूद अनुभाग और उसके बाद का विराम हटाएँ।"
  bn: "কার্সারে থাকা বিভাগ এবং তার পরের বিরতি মুছুন।"
  zh: "删除光标处的小节及其后的分隔。"
  ja: "カーソル位置のセクションと、その後ろの区切りを削除します。"
menu.item.edit.transpose_menu.help:
  en: "Open commands to swap two pieces of text."
  es: "Abre comandos para intercambiar dos partes del texto."
  fr: "Ouvrir les commandes pour permuter deux parties du texte."
  de: "Öffnet Befehle, um zwei Textteile zu vertauschen."
  cy: "Agor gorchmynion i gyfnewid dwy ran o destun."
  ga: "Oscail orduithe chun dhá chuid téacs a mhalartú."
  gd: "Fosgail àitheantan airson dà phàirt teacsa iomlaideadh."
  pl: "Otwiera polecenia zamiany dwóch fragmentów tekstu."
  pt: "Abre comandos para trocar duas partes do texto."
  ru: "Открыть команды для перестановки двух фрагментов текста."
  ar: "فتح أوامر لتبديل جزأين من النص."
  hi: "पाठ के दो भागों की अदला-बदली के लिए कमांड खोलें।"
  bn: "টেক্সটের দুটি অংশ অদলবদল করার কমান্ড খুলুন।"
  zh: "打开交换两段文本的命令。"
  ja: "テキストの 2 つの部分を入れ替えるコマンドを開きます。"
menu.item.edit.transpose_chars.help:
  en: "Swap the two characters around the cursor."
  es: "Intercambia los dos caracteres alrededor del cursor."
  fr: "Permute les deux caractères autour du curseur."
  de: "Vertauscht die beiden Zeichen um den Cursor."
  cy: "Cyfnewid y ddau nod o boptu'r cyrchwr."
  ga: "Malartaigh an dá charachtar timpeall an chúrsóra."
  gd: "Iomlaidich an dà charactar timcheall a' chùrsair."
  pl: "Zamienia miejscami dwa znaki wokół kursora."
  pt: "Troca os dois caracteres em torno do cursor."
  ru: "Меняет местами два символа вокруг курсора."
  ar: "يبدّل الحرفين المحيطين بالمؤشر."
  hi: "कर्सर के आसपास के दो अक्षरों की अदला-बदली करें।"
  bn: "কার্সারের চারপাশের দুটি অক্ষর অদলবদল করুন।"
  zh: "交换光标两侧的两个字符。"
  ja: "カーソル前後の 2 文字を入れ替えます。"
menu.item.edit.transpose_words.help:
  en: "Swap the two words around the cursor."
  es: "Intercambia las dos palabras alrededor del cursor."
  fr: "Permute les deux mots autour du curseur."
  de: "Vertauscht die beiden Wörter um den Cursor."
  cy: "Cyfnewid y ddau air o boptu'r cyrchwr."
  ga: "Malartaigh an dá fhocal timpeall an chúrsóra."
  gd: "Iomlaidich an dà fhacal timcheall a' chùrsair."
  pl: "Zamienia miejscami dwa słowa wokół kursora."
  pt: "Troca as duas palavras em torno do cursor."
  ru: "Меняет местами два слова вокруг курсора."
  ar: "يبدّل الكلمتين المحيطتين بالمؤشر."
  hi: "कर्सर के आसपास के दो शब्दों की अदला-बदली करें।"
  bn: "কার্সারের চারপাশের দুটি শব্দ অদলবদল করুন।"
  zh: "交换光标两侧的两个单词。"
  ja: "カーソル前後の 2 つの単語を入れ替えます。"
menu.item.edit.transpose_lines.help:
  en: "Swap the current line with the line above."
  es: "Intercambia la línea actual con la línea anterior."
  fr: "Permute la ligne courante avec la ligne précédente."
  de: "Vertauscht die aktuelle Zeile mit der Zeile darüber."
  cy: "Cyfnewid y llinell bresennol â'r llinell uwchben."
  ga: "Malartaigh an líne reatha leis an líne thuas."
  gd: "Iomlaidich an loidhne làithreach leis an loidhne gu h-àrd."
  pl: "Zamienia bieżący wiersz z wierszem powyżej."
  pt: "Troca a linha atual com a linha acima."
  ru: "Меняет местами текущую строку и строку выше."
  ar: "يبدّل السطر الحالي مع السطر الذي فوقه."
  hi: "वर्तमान पंक्ति की ऊपर वाली पंक्ति से अदला-बदली करें।"
  bn: "বর্তমান লাইনটি উপরের লাইনের সাথে অদলবদল করুন।"
  zh: "将当前行与上一行交换。"
  ja: "現在の行と 1 つ上の行を入れ替えます。"
menu.item.edit.transpose_sentences.help:
  en: "Swap the two sentences around the cursor."
  es: "Intercambia las dos oraciones alrededor del cursor."
  fr: "Permute les deux phrases autour du curseur."
  de: "Vertauscht die beiden Sätze um den Cursor."
  cy: "Cyfnewid y ddwy frawddeg o boptu'r cyrchwr."
  ga: "Malartaigh an dá abairt timpeall an chúrsóra."
  gd: "Iomlaidich an dà sheantans timcheall a' chùrsair."
  pl: "Zamienia miejscami dwa zdania wokół kursora."
  pt: "Troca as duas frases em torno do cursor."
  ru: "Меняет местами два предложения вокруг курсора."
  ar: "يبدّل الجملتين المحيطتين بالمؤشر."
  hi: "कर्सर के आसपास के दो वाक्यों की अदला-बदली करें।"
  bn: "কার্সারের চারপাশের দুটি বাক্য অদলবদল করুন।"
  zh: "交换光标两侧的两个句子。"
  ja: "カーソル前後の 2 つの文を入れ替えます。"
menu.item.edit.transpose_paragraphs.help:
  en: "Swap the two paragraphs around the cursor."
  es: "Intercambia los dos párrafos alrededor del cursor."
  fr: "Permute les deux paragraphes autour du curseur."
  de: "Vertauscht die beiden Absätze um den Cursor."
  cy: "Cyfnewid y ddau baragraff o boptu'r cyrchwr."
  ga: "Malartaigh an dá alt timpeall an chúrsóra."
  gd: "Iomlaidich an dà pharagraf timcheall a' chùrsair."
  pl: "Zamienia miejscami dwa akapity wokół kursora."
  pt: "Troca os dois parágrafos em torno do cursor."
  ru: "Меняет местами два абзаца вокруг курсора."
  ar: "يبدّل الفقرتين المحيطتين بالمؤشر."
  hi: "कर्सर के आसपास के दो अनुच्छेदों की अदला-बदली करें।"
  bn: "কার্সারের চারপাশের দুটি অনুচ্ছেদ অদলবদল করুন।"
  zh: "交换光标两侧的两个段落。"
  ja: "カーソル前後の 2 つの段落を入れ替えます。"
menu.item.edit.transpose_sections.help:
  en: "Swap the two sections around the cursor."
  es: "Intercambia las dos secciones alrededor del cursor."
  fr: "Permute les deux sections autour du curseur."
  de: "Vertauscht die beiden Abschnitte um den Cursor."
  cy: "Cyfnewid y ddwy adran o boptu'r cyrchwr."
  ga: "Malartaigh an dá roinn timpeall an chúrsóra."
  gd: "Iomlaidich an dà earrann timcheall a' chùrsair."
  pl: "Zamienia miejscami dwie sekcje wokół kursora."
  pt: "Troca as duas seções em torno do cursor."
  ru: "Меняет местами два раздела вокруг курсора."
  ar: "يبدّل القسمين المحيطين بالمؤشر."
  hi: "कर्सर के आसपास के दो अनुभागों की अदला-बदली करें।"
  bn: "কার্সারের চারপাশের দুটি বিভাগ অদলবদল করুন।"
  zh: "交换光标两侧的两个小节。"
  ja: "カーソル前後の 2 つのセクションを入れ替えます。"
menu.item.edit.wrap.help:
  en: "Wrap the selection, or the paragraph at the cursor, at the wrap column."
  es: "Ajusta la selección, o el párrafo del cursor, a la columna de ajuste."
  fr: "Coupe les lignes de la sélection, ou du paragraphe au curseur, à la colonne de coupure."
  de: "Bricht die Auswahl oder den Absatz am Cursor an der Umbruchspalte um."
  cy: "Lapio'r dewisiad, neu'r paragraff wrth y cyrchwr, wrth y golofn lapio."
  ga: "Timfhill an roghnúchán, nó an t-alt ag an gcúrsóir, ag an gcolún timfhillte."
  gd: "Paisg an taghadh, no am paragraf aig a' chùrsair, aig a' cholbh pasgaidh."
  pl: "Zawija zaznaczenie lub akapit przy kursorze na kolumnie zawijania."
  pt: "Quebra a seleção, ou o parágrafo no cursor, na coluna de quebra."
  ru: "Переносит выделение или абзац у курсора по колонке переноса."
  ar: "يلفّ التحديد أو الفقرة عند المؤشر عند عمود اللف."
  hi: "चयन, या कर्सर वाले अनुच्छेद को, रैप कॉलम पर लपेटें।"
  bn: "নির্বাচন, বা কার্সারের অনুচ্ছেদ, র‍্যাপ কলামে মুড়ে দিন।"
  zh: "在换行列处折行选区或光标所在段落。"
  ja: "選択範囲、またはカーソル位置の段落を折り返し桁で折り返します。"
menu.item.edit.increment_number.help:
  en: "Increase the number under the cursor by one."
  es: "Aumenta en uno el número bajo el cursor."
  fr: "Augmente de un le nombre sous le curseur."
  de: "Erhöht die Zahl unter dem Cursor um eins."
  cy: "Cynyddu'r rhif o dan y cyrchwr o un."
  ga: "Méadaigh an uimhir faoin gcúrsóir de haon."
  gd: "Àrdaich an àireamh fon chùrsair le aon."
  pl: "Zwiększa liczbę pod kursorem o jeden."
  pt: "Aumenta em um o número sob o cursor."
  ru: "Увеличивает число под курсором на единицу."
  ar: "يزيد الرقم تحت المؤشر بمقدار واحد."
  hi: "कर्सर के नीचे की संख्या को एक से बढ़ाएँ।"
  bn: "কার্সারের নিচের সংখ্যাটি এক বাড়ান।"
  zh: "将光标下的数字加一。"
  ja: "カーソル下の数値を 1 増やします。"
menu.item.edit.decrement_number.help:
  en: "Decrease the number under the cursor by one."
  es: "Disminuye en uno el número bajo el cursor."
  fr: "Diminue de un le nombre sous le curseur."
  de: "Verringert die Zahl unter dem Cursor um eins."
  cy: "Lleihau'r rhif o dan y cyrchwr o un."
  ga: "Laghdaigh an uimhir faoin gcúrsóir de haon."
  gd: "Lùghdaich an àireamh fon chùrsair le aon."
  pl: "Zmniejsza liczbę pod kursorem o jeden."
  pt: "Diminui em um o número sob o cursor."
  ru: "Уменьшает число под курсором на единицу."
  ar: "ينقص الرقم تحت المؤشر بمقدار واحد."
  hi: "कर्सर के नीचे की संख्या को एक से घटाएँ।"
  bn: "কার্সারের নিচের সংখ্যাটি এক কমান।"
  zh: "将光标下的数字减一。"
  ja: "カーソル下の数値を 1 減らします。"
menu.item.edit.macro.help:
  en: "Open commands for recording and playing keyboard macros."
  es: "Abre comandos para grabar y reproducir macros de teclado."
  fr: "Ouvre les commandes pour enregistrer et jouer des macros clavier."
  de: "Öffnet Befehle zum Aufzeichnen und Abspielen von Tastaturmakros."
  cy: "Agor gorchmynion i recordio a chwarae macros bysellfwrdd."
  ga: "Oscail orduithe chun macraí méarchláir a thaifeadadh agus a sheinm."
  gd: "Fosgail àitheantan gus macrothan a' mheur-chlàir a chlàradh 's a chluich."
  pl: "Otwiera polecenia do nagrywania i odtwarzania makr klawiaturowych."
  pt: "Abre comandos para gravar e reproduzir macros de teclado."
  ru: "Открывает команды записи и воспроизведения макросов клавиатуры."
  ar: "يفتح أوامر تسجيل وتشغيل وحدات ماكرو لوحة المفاتيح."
  hi: "कीबोर्ड मैक्रो रिकॉर्ड और चलाने के लिए कमांड खोलें।"
  bn: "কীবোর্ড ম্যাক্রো রেকর্ড ও চালানোর কমান্ড খুলুন।"
  zh: "打开录制和播放键盘宏的命令。"
  ja: "キーボードマクロの記録と再生のコマンドを開きます。"
menu.item.edit.record_macro.help:
  en: "Start or stop recording a keyboard macro."
  es: "Inicia o detiene la grabación de una macro de teclado."
  fr: "Démarre ou arrête l'enregistrement d'une macro clavier."
  de: "Startet oder stoppt die Aufzeichnung eines Tastaturmakros."
  cy: "Dechrau neu atal recordio macro bysellfwrdd."
  ga: "Tosaigh nó stop taifeadadh macra méarchláir."
  gd: "Tòisich no stad clàradh macro meur-chlàir."
  pl: "Rozpoczyna lub kończy nagrywanie makra klawiaturowego."
  pt: "Inicia ou para a gravação de uma macro de teclado."
  ru: "Начинает или останавливает запись макроса клавиатуры."
  ar: "يبدأ أو يوقف تسجيل ماكرو لوحة المفاتيح."
  hi: "कीबोर्ड मैक्रो की रिकॉर्डिंग शुरू या बंद करें।"
  bn: "কীবোর্ড ম্যাক্রো রেকর্ডিং শুরু বা বন্ধ করুন।"
  zh: "开始或停止录制键盘宏。"
  ja: "キーボードマクロの記録を開始または停止します。"
menu.item.edit.play_macro.help:
  en: "Replay the last recorded macro."
  es: "Reproduce la última macro grabada."
  fr: "Rejoue la dernière macro enregistrée."
  de: "Spielt das zuletzt aufgezeichnete Makro erneut ab."
  cy: "Ailchwarae'r macro diwethaf a recordiwyd."
  ga: "Athsheinn an macra deireanach a taifeadadh."
  gd: "Ath-chluich am macro mu dheireadh a chaidh a chlàradh."
  pl: "Odtwarza ostatnio nagrane makro."
  pt: "Reproduz a última macro gravada."
  ru: "Воспроизводит последний записанный макрос."
  ar: "يعيد تشغيل آخر ماكرو مسجّل."
  hi: "अंतिम रिकॉर्ड किए गए मैक्रो को फिर से चलाएँ।"
  bn: "সর্বশেষ রেকর্ড করা ম্যাক্রোটি আবার চালান।"
  zh: "重放最后录制的宏。"
  ja: "最後に記録したマクロを再生します。"
menu.item.edit.save_macro.help:
  en: "Save the recorded macro under a name."
  es: "Guarda la macro grabada con un nombre."
  fr: "Enregistre la macro sous un nom."
  de: "Speichert das aufgezeichnete Makro unter einem Namen."
  cy: "Cadw'r macro a recordiwyd o dan enw."
  ga: "Sábháil an macra taifeadta faoi ainm."
  gd: "Sàbhail am macro clàraichte fo ainm."
  pl: "Zapisuje nagrane makro pod nazwą."
  pt: "Guarda a macro gravada com um nome."
  ru: "Сохраняет записанный макрос под именем."
  ar: "يحفظ الماكرو المسجّل باسم."
  hi: "रिकॉर्ड किए गए मैक्रो को एक नाम से सहेजें।"
  bn: "রেকর্ড করা ম্যাক্রোটি একটি নামে সংরক্ষণ করুন।"
  zh: "以名称保存录制的宏。"
  ja: "記録したマクロに名前を付けて保存します。"
menu.item.edit.play_saved_macro.help:
  en: "Choose a saved macro and replay it."
  es: "Elige una macro guardada y reprodúcela."
  fr: "Choisit une macro enregistrée et la rejoue."
  de: "Wählt ein gespeichertes Makro aus und spielt es ab."
  cy: "Dewis macro a gadwyd a'i ailchwarae."
  ga: "Roghnaigh macra sábháilte agus athsheinn é."
  gd: "Tagh macro a chaidh a shàbhaladh is ath-chluich e."
  pl: "Wybiera zapisane makro i je odtwarza."
  pt: "Escolhe uma macro guardada e reproduz."
  ru: "Выбирает сохранённый макрос и воспроизводит его."
  ar: "يختار ماكرو محفوظًا ويعيد تشغيله."
  hi: "एक सहेजा गया मैक्रो चुनें और चलाएँ।"
  bn: "সংরক্ষিত একটি ম্যাক্রো বেছে নিয়ে চালান।"
  zh: "选择一个已保存的宏并播放。"
  ja: "保存済みのマクロを選んで再生します。"
menu.item.edit.bookmark_toggle.help:
  en: "Add or remove a bookmark on the current line."
  es: "Añade o quita un marcador en la línea actual."
  fr: "Ajoute ou supprime un signet sur la ligne actuelle."
  de: "Fügt ein Lesezeichen in der aktuellen Zeile hinzu oder entfernt es."
  cy: "Ychwanegu neu dynnu nod tudalen ar y llinell gyfredol."
  ga: "Cuir leabharmharc leis an líne reatha nó bain de é."
  gd: "Cuir comharra-leabhair ris an loidhne làithreach no thoir air falbh e."
  pl: "Dodaje lub usuwa zakładkę w bieżącym wierszu."
  pt: "Adiciona ou remove um marcador na linha atual."
  ru: "Добавляет или удаляет закладку на текущей строке."
  ar: "يضيف أو يزيل إشارة مرجعية في السطر الحالي."
  hi: "वर्तमान पंक्ति पर बुकमार्क जोड़ें या हटाएँ।"
  bn: "বর্তমান লাইনে একটি বুকমার্ক যোগ বা মুছুন।"
  zh: "在当前行添加或移除书签。"
  ja: "現在の行のブックマークを追加または削除します。"
menu.item.edit.bookmark_next.help:
  en: "Jump to the next bookmark."
  es: "Salta al siguiente marcador."
  fr: "Passe au signet suivant."
  de: "Springt zum nächsten Lesezeichen."
  cy: "Neidio i'r nod tudalen nesaf."
  ga: "Léim go dtí an chéad leabharmharc eile."
  gd: "Leum chun ath chomharra-leabhair."
  pl: "Przechodzi do następnej zakładki."
  pt: "Salta para o próximo marcador."
  ru: "Переходит к следующей закладке."
  ar: "ينتقل إلى الإشارة المرجعية التالية."
  hi: "अगले बुकमार्क पर जाएँ।"
  bn: "পরবর্তী বুকমার্কে যান।"
  zh: "跳转到下一个书签。"
  ja: "次のブックマークに移動します。"
menu.item.edit.bookmark_prev.help:
  en: "Jump to the previous bookmark."
  es: "Salta al marcador anterior."
  fr: "Revient au signet précédent."
  de: "Springt zum vorherigen Lesezeichen."
  cy: "Neidio i'r nod tudalen blaenorol."
  ga: "Léim go dtí an leabharmharc roimhe."
  gd: "Leum chun a' chomharra-leabhair roimhe."
  pl: "Przechodzi do poprzedniej zakładki."
  pt: "Salta para o marcador anterior."
  ru: "Переходит к предыдущей закладке."
  ar: "ينتقل إلى الإشارة المرجعية السابقة."
  hi: "पिछले बुकमार्क पर जाएँ।"
  bn: "আগের বুকমার্কে যান।"
  zh: "跳转到上一个书签。"
  ja: "前のブックマークに移動します。"
menu.item.edit.bookmark_list.help:
  en: "List all bookmarks and jump to one."
  es: "Lista todos los marcadores y salta a uno."
  fr: "Liste tous les signets et permet d'en atteindre un."
  de: "Listet alle Lesezeichen auf und springt zu einem."
  cy: "Rhestru pob nod tudalen a neidio i un."
  ga: "Liostaigh na leabharmharcanna go léir agus léim chuig ceann."
  gd: "Liostaich a h-uile comharra-leabhair is leum gu fear."
  pl: "Wyświetla wszystkie zakładki i pozwala przejść do jednej."
  pt: "Lista todos os marcadores e salta para um."
  ru: "Показывает все закладки и переходит к выбранной."
  ar: "يسرد كل الإشارات المرجعية وينتقل إلى واحدة."
  hi: "सभी बुकमार्क सूचीबद्ध करें और किसी एक पर जाएँ।"
  bn: "সব বুকমার্ক তালিকাভুক্ত করে একটিতে যান।"
  zh: "列出所有书签并跳转到其中一个。"
  ja: "すべてのブックマークを一覧表示し、選んで移動します。"
menu.go.start.help:
  en: "Move the cursor to the start of the current word."
  es: "Mueve el cursor al inicio de la palabra actual."
  fr: "Déplace le curseur au début du mot actuel."
  de: "Bewegt den Cursor zum Anfang des aktuellen Wortes."
  cy: "Symud y cyrchwr i ddechrau'r gair cyfredol."
  ga: "Bog an cúrsóir go tús an fhocail reatha."
  gd: "Gluais an cùrsair gu toiseach an fhacail làithrich."
  pl: "Przesuwa kursor na początek bieżącego słowa."
  pt: "Move o cursor para o início da palavra atual."
  ru: "Перемещает курсор в начало текущего слова."
  ar: "ينقل المؤشر إلى بداية الكلمة الحالية."
  hi: "कर्सर को वर्तमान शब्द के आरंभ में ले जाएँ।"
  bn: "কার্সারটি বর্তমান শব্দের শুরুতে নিয়ে যান।"
  zh: "将光标移动到当前单词的开头。"
  ja: "カーソルを現在の単語の先頭へ移動します。"
menu.go.end.help:
  en: "Move the cursor to the end of the current word."
  es: "Mueve el cursor al final de la palabra actual."
  fr: "Déplace le curseur à la fin du mot actuel."
  de: "Bewegt den Cursor zum Ende des aktuellen Wortes."
  cy: "Symud y cyrchwr i ddiwedd y gair cyfredol."
  ga: "Bog an cúrsóir go deireadh an fhocail reatha."
  gd: "Gluais an cùrsair gu deireadh an fhacail làithrich."
  pl: "Przesuwa kursor na koniec bieżącego słowa."
  pt: "Move o cursor para o fim da palavra atual."
  ru: "Перемещает курсор в конец текущего слова."
  ar: "ينقل المؤشر إلى نهاية الكلمة الحالية."
  hi: "कर्सर को वर्तमान शब्द के अंत में ले जाएँ।"
  bn: "কার্সারটি বর্তমান শব্দের শেষে নিয়ে যান।"
  zh: "将光标移动到当前单词的末尾。"
  ja: "カーソルを現在の単語の末尾へ移動します。"
menu.go.next.help:
  en: "Move the cursor to the next word."
  es: "Mueve el cursor a la palabra siguiente."
  fr: "Déplace le curseur au mot suivant."
  de: "Bewegt den Cursor zum nächsten Wort."
  cy: "Symud y cyrchwr i'r gair nesaf."
  ga: "Bog an cúrsóir go dtí an chéad fhocal eile."
  gd: "Gluais an cùrsair chun an ath fhacail."
  pl: "Przesuwa kursor do następnego słowa."
  pt: "Move o cursor para a palavra seguinte."
  ru: "Перемещает курсор к следующему слову."
  ar: "ينقل المؤشر إلى الكلمة التالية."
  hi: "कर्सर को अगले शब्द पर ले जाएँ।"
  bn: "কার্সারটি পরবর্তী শব্দে নিয়ে যান।"
  zh: "将光标移动到下一个单词。"
  ja: "カーソルを次の単語へ移動します。"
menu.go.previous.help:
  en: "Move the cursor to the previous word."
  es: "Mueve el cursor a la palabra anterior."
  fr: "Déplace le curseur au mot précédent."
  de: "Bewegt den Cursor zum vorherigen Wort."
  cy: "Symud y cyrchwr i'r gair blaenorol."
  ga: "Bog an cúrsóir go dtí an focal roimhe."
  gd: "Gluais an cùrsair chun an fhacail roimhe."
  pl: "Przesuwa kursor do poprzedniego słowa."
  pt: "Move o cursor para a palavra anterior."
  ru: "Перемещает курсор к предыдущему слову."
  ar: "ينقل المؤشر إلى الكلمة السابقة."
  hi: "कर्सर को पिछले शब्द पर ले जाएँ।"
  bn: "কার্সারটি আগের শব্দে নিয়ে যান।"
  zh: "将光标移动到上一个单词。"
  ja: "カーソルを前の単語へ移動します。"
menu.go.number.help:
  en: "Jump to a word by its on-screen number."
  es: "Salta a una palabra por su número en pantalla."
  fr: "Atteint un mot d'après son numéro à l'écran."
  de: "Springt zu einem Wort anhand seiner Bildschirmnummer."
  cy: "Neidio i air yn ôl ei rif ar y sgrin."
  ga: "Léim chuig focal de réir a uimhir ar an scáileán."
  gd: "Leum gu facal a rèir an àireimh aige air an sgrion."
  pl: "Przechodzi do słowa według jego numeru na ekranie."
  pt: "Salta para uma palavra pelo seu número no ecrã."
  ru: "Переходит к слову по его номеру на экране."
  ar: "ينتقل إلى كلمة حسب رقمها على الشاشة."
  hi: "स्क्रीन पर उसके नंबर से किसी शब्द पर जाएँ।"
  bn: "স্ক্রিনে তার নম্বর অনুসারে একটি শব্দে যান।"
  zh: "根据屏幕上的编号跳转到某个单词。"
  ja: "画面上の番号で単語に移動します。"
menu.go.symbol.help:
  en: "Jump to a symbol in the current file."
  es: "Salta a un símbolo del archivo actual."
  fr: "Atteint un symbole dans le fichier actuel."
  de: "Springt zu einem Symbol in der aktuellen Datei."
  cy: "Neidio i symbol yn y ffeil gyfredol."
  ga: "Léim chuig siombail sa chomhad reatha."
  gd: "Leum gu samhla san fhaidhle làithreach."
  pl: "Przechodzi do symbolu w bieżącym pliku."
  pt: "Salta para um símbolo no ficheiro atual."
  ru: "Переходит к символу в текущем файле."
  ar: "ينتقل إلى رمز في الملف الحالي."
  hi: "वर्तमान फ़ाइल में किसी सिंबल पर जाएँ।"
  bn: "বর্তমান ফাইলের একটি সিম্বলে যান।"
  zh: "跳转到当前文件中的符号。"
  ja: "現在のファイル内のシンボルに移動します。"
menu.go.declaration.help:
  en: "Jump to the declaration of the symbol under the cursor."
  es: "Salta a la declaración del símbolo bajo el cursor."
  fr: "Atteint la déclaration du symbole sous le curseur."
  de: "Springt zur Deklaration des Symbols unter dem Cursor."
  cy: "Neidio i ddatganiad y symbol o dan y cyrchwr."
  ga: "Léim chuig dearbhú na siombaile faoin gcúrsóir."
  gd: "Leum gu foirmleachadh an t-samhla fon chùrsair."
  pl: "Przechodzi do deklaracji symbolu pod kursorem."
  pt: "Salta para a declaração do símbolo sob o cursor."
  ru: "Переходит к объявлению символа под курсором."
  ar: "ينتقل إلى تصريح الرمز الموجود تحت المؤشر."
  hi: "कर्सर के नीचे के सिंबल की घोषणा पर जाएँ।"
  bn: "কার্সারের নিচের সিম্বলের ঘোষণায় যান।"
  zh: "跳转到光标下符号的声明。"
  ja: "カーソル下のシンボルの宣言に移動します。"
menu.go.implementations.help:
  en: "Jump to implementations of the symbol under the cursor."
  es: "Salta a las implementaciones del símbolo bajo el cursor."
  fr: "Atteint les implémentations du symbole sous le curseur."
  de: "Springt zu den Implementierungen des Symbols unter dem Cursor."
  cy: "Neidio i weithrediadau'r symbol o dan y cyrchwr."
  ga: "Léim chuig feidhmiúcháin na siombaile faoin gcúrsóir."
  gd: "Leum gu buileachaidhean an t-samhla fon chùrsair."
  pl: "Przechodzi do implementacji symbolu pod kursorem."
  pt: "Salta para as implementações do símbolo sob o cursor."
  ru: "Переходит к реализациям символа под курсором."
  ar: "ينتقل إلى تطبيقات الرمز الموجود تحت المؤشر."
  hi: "कर्सर के नीचे के सिंबल के कार्यान्वयनों पर जाएँ।"
  bn: "কার্সারের নিচের সিম্বলের ইমপ্লিমেন্টেশনে যান।"
  zh: "跳转到光标下符号的实现。"
  ja: "カーソル下のシンボルの実装に移動します。"
menu.go.references.help:
  en: "Jump to all references of the symbol under the cursor."
  es: "Salta a todas las referencias del símbolo bajo el cursor."
  fr: "Aller à toutes les références du symbole sous le curseur."
  de: "Zu allen Referenzen des Symbols unter dem Cursor springen."
  cy: "Neidio i holl gyfeiriadau'r symbol o dan y cyrchwr."
  ga: "Léim chuig gach tagairt don siombail faoin gcúrsóir."
  gd: "Leum gu gach iomradh air an t-samhla fon chùrsair."
  pl: "Przejdź do wszystkich odwołań do symbolu pod kursorem."
  pt: "Ir para todas as referências do símbolo sob o cursor."
  ru: "Перейти ко всем ссылкам на символ под курсором."
  ar: "الانتقال إلى جميع مراجع الرمز الموجود أسفل المؤشر."
  hi: "कर्सर के नीचे स्थित प्रतीक के सभी संदर्भों पर जाएँ।"
  bn: "কার্সারের নিচের প্রতীকের সমস্ত রেফারেন্সে যান।"
  zh: "跳转到光标下符号的所有引用。"
  ja: "カーソル位置のシンボルの全参照に移動します。"
menu.go.next_issue.help:
  en: "Jump to the next diagnostic issue in the file."
  es: "Salta al siguiente problema de diagnóstico del archivo."
  fr: "Aller au prochain problème de diagnostic du fichier."
  de: "Zum nächsten Diagnoseproblem in der Datei springen."
  cy: "Neidio i'r broblem ddiagnostig nesaf yn y ffeil."
  ga: "Léim chuig an chéad fhadhb diagnóiseach eile sa chomhad."
  gd: "Leum chun na h-ath dhuilgheadais sgrùdaidh san fhaidhle."
  pl: "Przejdź do następnego problemu diagnostycznego w pliku."
  pt: "Ir para o próximo problema de diagnóstico no arquivo."
  ru: "Перейти к следующей диагностической проблеме в файле."
  ar: "الانتقال إلى المشكلة التشخيصية التالية في الملف."
  hi: "फ़ाइल में अगली डायग्नोस्टिक समस्या पर जाएँ।"
  bn: "ফাইলের পরবর্তী ডায়াগনস্টিক সমস্যায় যান।"
  zh: "跳转到文件中的下一个诊断问题。"
  ja: "ファイル内の次の診断問題に移動します。"
menu.go.prev_issue.help:
  en: "Jump to the previous diagnostic issue in the file."
  es: "Salta al problema de diagnóstico anterior del archivo."
  fr: "Aller au problème de diagnostic précédent du fichier."
  de: "Zum vorherigen Diagnoseproblem in der Datei springen."
  cy: "Neidio i'r broblem ddiagnostig flaenorol yn y ffeil."
  ga: "Léim chuig an fhadhb diagnóiseach roimhe seo sa chomhad."
  gd: "Leum chun na duilgheadais sgrùdaidh roimhe san fhaidhle."
  pl: "Przejdź do poprzedniego problemu diagnostycznego w pliku."
  pt: "Ir para o problema de diagnóstico anterior no arquivo."
  ru: "Перейти к предыдущей диагностической проблеме в файле."
  ar: "الانتقال إلى المشكلة التشخيصية السابقة في الملف."
  hi: "फ़ाइल में पिछली डायग्नोस्टिक समस्या पर जाएँ।"
  bn: "ফাইলের পূর্ববর্তী ডায়াগনস্টিক সমস্যায় যান।"
  zh: "跳转到文件中的上一个诊断问题。"
  ja: "ファイル内の前の診断問題に移動します。"
menu.go.next_change.help:
  en: "Jump to the next changed hunk since the last commit."
  es: "Salta al siguiente fragmento modificado desde el último commit."
  fr: "Aller au prochain bloc modifié depuis le dernier commit."
  de: "Zum nächsten geänderten Block seit dem letzten Commit springen."
  cy: "Neidio i'r darn nesaf a newidiwyd ers y commit diwethaf."
  ga: "Léim chuig an chéad bhloc athraithe eile ón commit deireanach."
  gd: "Leum chun an ath bhloca a chaidh atharrachadh bhon commit mu dheireadh."
  pl: "Przejdź do następnego zmienionego fragmentu od ostatniego commita."
  pt: "Ir para o próximo trecho alterado desde o último commit."
  ru: "Перейти к следующему изменённому фрагменту с последнего коммита."
  ar: "الانتقال إلى الجزء المتغيّر التالي منذ آخر commit في Git."
