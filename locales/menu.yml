  ar: "يفتح الرابط عند المؤشر: ملف، أو عنوان، أو معرّف، أو رابط URL."
  hi: "कर्सर पर मौजूद लिंक को खोलता है: एक फ़ाइल, एक शीर्षक, एक id, या एक URL।"
  bn: "কার্সরের লিঙ্কটি খোলে: একটি ফাইল, একটি হেডিং, একটি id, বা একটি URL।"
