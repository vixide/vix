  es: "Selecciona todo el contenido del archivo."
  fr: "Sélectionne tout le contenu du fichier."
  de: "Wählt den gesamten Inhalt der Datei aus."
  cy: "Dewis holl gynnwys y ffeil."
  ga: "Roghnaigh ábhar iomlán an chomhaid."
  gd: "Tagh susbaint an fhaidhle gu lèir."
