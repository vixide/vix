menu.item.org.capture.anything.help:
  en: "Capture a note with the Anything template, choosing where it is filed."
  es: "Captura una nota con la plantilla Cualquier cosa, eligiendo dónde se archiva."
  fr: "Capture une note avec le modèle N'importe quoi, en choisissant où elle est classée."
  de: "Erfasst eine Notiz mit der Vorlage „Beliebiges“ und wählt aus, wo sie abgelegt wird."
  cy: "Cipio nodyn gyda'r templed Unrhyw Beth, gan ddewis lle caiff ei ffeilio."
  ga: "Gabh nóta leis an teimpléad Rud ar Bith, ag roghnú cén áit a gcomhdaítear é."
  gd: "Glac nòta leis an teamplaid Rud sam bith, a' taghadh càite an tèid a chlàradh."
  pl: "Przechwytuje notatkę za pomocą szablonu Cokolwiek, wybierając miejsce archiwizacji."
  pt: "Captura uma nota com o modelo Qualquer coisa, escolhendo onde é arquivada."
  ru: "Записывает заметку по шаблону «Что угодно», позволяя выбрать место сохранения."
  ar: "التقط ملاحظة باستخدام قالب \"أي شيء\"، مع اختيار مكان حفظها."
  hi: "\"कुछ भी\" टेम्पलेट के साथ एक नोट कैप्चर करें, यह चुनते हुए कि इसे कहाँ फ़ाइल किया जाए।"
  bn: "\"যেকোনো কিছু\" টেমপ্লেট দিয়ে একটি নোট ক্যাপচার করুন, এটি কোথায় ফাইল করা হবে তা বেছে নিয়ে।"
  zh: "使用“任意内容”模板捕获笔记，并选择归档位置。"
  ja: "「任意」テンプレートでメモを取り込み、保存先を選びます。"
