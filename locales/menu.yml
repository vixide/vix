  es: "Vuelve a ejecutar el comando de proyecto más reciente, de cualquier tipo."
  fr: "Réexécute la dernière commande de projet exécutée, quel qu'en soit le type."
  de: "Führt den zuletzt ausgeführten Projektbefehl beliebiger Art erneut aus."
  cy: "Ailredeg y gorchymyn prosiect diweddaraf a redwyd, o unrhyw fath."
  ga: "Athrith an t-ordú tionscadail is déanaí a ritheadh, de chineál ar bith."
  gd: "Ath-ruith an àithne phròiseict mu dheireadh a chaidh a ruith, de sheòrsa sam bith."
  pl: "Ponownie uruchamia ostatnio uruchomione polecenie projektu dowolnego rodzaju."
