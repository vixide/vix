  es: "Mueve el subárbol bajo otro encabezado, elegido de los destinos de traslado."
  fr: "Déplace le sous-arbre sous un autre titre, choisi parmi les destinations de reclassement."
  de: "Verschiebt den Teilbaum unter eine andere Überschrift, ausgewählt aus den Verschiebungszielen."
  cy: "Symud yr is-goeden o dan bennawd arall, wedi'i ddewis o'r targedau adleoli."
  ga: "Bog an fochrann faoi cheannteideal eile, roghnaithe ó na spriocanna aistrithe."
  gd: "Gluais am fo-chraobh fo cheann-sgrìobhaidh eile, air a thaghadh bhon liosta ghluasaid."
  pl: "Przenosi poddrzewo pod inny nagłówek, wybrany spośród celów przeniesienia."
  pt: "Move a subárvore para debaixo de outro título, escolhido entre os destinos de transferência."
  ru: "Перемещает поддерево под другой заголовок, выбранный из целей перемещения."
  ar: "ينقل الشجرة الفرعية تحت عنوان آخر، يُختار من وجهات النقل."
  hi: "उपवृक्ष को स्थानांतरण लक्ष्यों में से चुने गए किसी अन्य शीर्षक के अंतर्गत ले जाएं।"
  bn: "সাবট্রিকে স্থানান্তর লক্ষ্য থেকে নির্বাচিত অন্য একটি শিরোনামের অধীনে সরায়।"
