menu.item.org.footnote.help:
  en: "On a footnote reference jump to its definition (and back); elsewhere insert a new footnote."
  es: "En una referencia de nota al pie, salta a su definición (y de vuelta); en otro lugar, inserta una nueva nota al pie."
  fr: "Sur une référence de note de bas de page, va à sa définition (et retour) ; ailleurs, insère une nouvelle note de bas de page."
  de: "Bei einer Fußnotenreferenz springt es zu ihrer Definition (und zurück); andernorts fügt es eine neue Fußnote ein."
  cy: "Ar gyfeirnod troednodyn, neidio i'w ddiffiniad (ac yn ôl); mewn man arall, mewnosod troednodyn newydd."
  ga: "Ar thagairt fonóta, léim go dtí a sainmhíniú (agus ar ais); in áit eile, ionsáigh fonóta nua."
  gd: "Air iomradh fo-nòta, leum chun na mìneachaidh aige (agus air ais); an àite sam bith eile, cuir a-steach fo-nòta ùr."
  pl: "Na odniesieniu do przypisu przechodzi do jego definicji (i z powrotem); w innym miejscu wstawia nowy przypis."
  pt: "Em uma referência de nota de rodapé, salta para sua definição (e de volta); em outro lugar, insere uma nova nota de rodapé."
  ru: "На ссылке сноски переходит к её определению (и обратно); в другом месте вставляет новую сноску."
  ar: "عند مرجع حاشية، ينتقل إلى تعريفها (والعودة)؛ وفي أي مكان آخر، يُدرج حاشية جديدة."
  hi: "फ़ुटनोट संदर्भ पर उसकी परिभाषा पर जाता है (और वापस); अन्यत्र एक नया फ़ुटनोट डालता है।"
  bn: "ফুটনোট রেফারেন্সে থাকলে তার সংজ্ঞায় লাফ দেয় (এবং ফিরে আসে); অন্য কোথাও একটি নতুন ফুটনোট সন্নিবেশ করে।"
  zh: "在脚注引用处跳转到其定义(并可跳回);在其他位置则插入新脚注。"
  ja: "脚注参照上ではその定義にジャンプします(戻ることも可能)。それ以外の場所では新しい脚注を挿入します。"
