menu.item.project.discard_command_cache.help:
  en: "Clear the cached resolved lifecycle commands (not history or the .vix/project.toml override)."
  es: "Borra los comandos de ciclo de vida resueltos en caché (no el historial ni la anulación de .vix/project.toml)."
  fr: "Efface les commandes de cycle de vie résolues en cache (pas l'historique ni la surcharge .vix/project.toml)."
  de: "Löscht die zwischengespeicherten aufgelösten Lifecycle-Befehle (nicht den Verlauf oder die .vix/project.toml-Überschreibung)."
  cy: "Clirio'r gorchmynion cylch bywyd wedi'u datrys sydd wedi'u storio dros dro (nid yr hanes na'r gwrthwneud .vix/project.toml)."
  ga: "Glan na horduithe saolré réitithe atá i dtaisce (ní an stair ná an sárú .vix/project.toml)."
  gd: "Falamhaich na h-àithnean beatha-cuairt fhuasgailte a tha air an tasgadh (chan e an eachdraidh no sàrachadh .vix/project.toml)."
  pl: "Czyści zapisane w pamięci podręcznej rozwiązane polecenia cyklu życia (nie historię ani nadpisanie .vix/project.toml)."
  pt: "Limpa os comandos de ciclo de vida resolvidos em cache (não o histórico nem a substituição .vix/project.toml)."
  ru: "Очищает кэшированные разрешённые команды жизненного цикла (не историю и не переопределение .vix/project.toml)."
  ar: "يمسح أوامر دورة الحياة المحلولة المخزنة مؤقتًا (وليس السجل أو تجاوز .vix/project.toml)."
  hi: "कैश किए गए रिज़ॉल्व किए गए लाइफ़साइकल कमांड साफ़ करें (इतिहास या .vix/project.toml ओवरराइड नहीं)।"
  bn: "ক্যাশে করা রিজলভড লাইফসাইকেল কমান্ড মুছুন (ইতিহাস বা .vix/project.toml ওভাররাইড নয়)।"
  zh: "清除缓存的已解析生命周期命令(不包括历史记录或 .vix/project.toml 覆盖项)。"
  ja: "キャッシュされた解決済みライフサイクルコマンドをクリアします(履歴や .vix/project.toml のオーバーライドは対象外)。"
