menu.item.org.block.help:
  en: "Insert a #+BEGIN/#+END block around the selection, or empty at the cursor."
  es: "Inserta un bloque #+BEGIN/#+END alrededor de la selección, o vacío en el cursor."
  fr: "Insère un bloc #+BEGIN/#+END autour de la sélection, ou vide au curseur."
  de: "Fügt einen #+BEGIN/#+END-Block um die Auswahl herum ein, oder leer an der Cursorposition."
  cy: "Mewnosod bloc #+BEGIN/#+END o amgylch y dewisiad, neu'n wag wrth y cyrchwr."
  ga: "Ionsáigh bloc #+BEGIN/#+END timpeall an roghnúcháin, nó folamh ag an gcúrsóir."
  gd: "Cuir a-steach bloca #+BEGIN/#+END timcheall an taghaidh, no falamh aig a' chùrsair."
  pl: "Wstawia blok #+BEGIN/#+END wokół zaznaczenia lub pusty w miejscu kursora."
  pt: "Insere um bloco #+BEGIN/#+END ao redor da seleção, ou vazio no cursor."
  ru: "Вставляет блок #+BEGIN/#+END вокруг выделения или пустой в позиции курсора."
  ar: "يُدرج كتلة #+BEGIN/#+END حول التحديد، أو فارغة عند المؤشر."
  hi: "चयन के चारों ओर एक #+BEGIN/#+END ब्लॉक सम्मिलित करता है, या कर्सर पर खाली ब्लॉक।"
  bn: "নির্বাচনের চারপাশে একটি #+BEGIN/#+END ব্লক সন্নিবেশ করে, অথবা কার্সরে খালি ব্লক।"
  zh: "在所选内容周围插入 #+BEGIN/#+END 块,或在光标处插入空块。"
  ja: "選択範囲の周囲に #+BEGIN/#+END ブロックを挿入するか、カーソル位置に空のブロックを挿入します。"
