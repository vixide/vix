menu.item.org.subtree_copy.help:
  en: "Copy the subtree at the cursor, headline and body together."
  es: "Copia el subárbol en el cursor, encabezado y cuerpo juntos."
  fr: "Copie le sous-arbre au curseur, titre et corps ensemble."
  de: "Kopiert den Teilbaum an der Cursorposition, Überschrift und Inhalt zusammen."
  cy: "Copïo'r is-goeden wrth y cyrchwr, y pennawd a'r corff gyda'i gilydd."
  ga: "Cóipeáil an fochrann ag an gcúrsóir, an ceannteideal agus an corp le chéile."
  gd: "Dèan lethbhreac den fho-chraobh aig a' chùrsair, an ceann-sgrìobhaidh 's an corp còmhla."
