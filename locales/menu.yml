menu.item.org.close_note.help:
  en: "Mark the headline DONE and record a closing note with the timestamp."
  es: "Marca el encabezado como DONE y registra una nota de cierre con la marca de tiempo."
  fr: "Marque le titre comme DONE et enregistre une note de clôture avec l'horodatage."
  de: "Markiert die Überschrift als DONE und speichert eine Abschlussnotiz mit Zeitstempel."
  cy: "Marcio'r pennawd yn DONE a chofnodi nodyn cau gyda'r marc amser."
  ga: "Marcáil an ceannteideal mar DONE agus taifead nóta dúnta leis an stampa ama."
  gd: "Comharraich an ceann-sgrìobhaidh mar DONE agus clàraich nòta dùnaidh leis an stampa-ama."
  pl: "Oznacza nagłówek jako DONE i zapisuje notatkę zamknięcia ze znacznikiem czasu."
  pt: "Marca o cabeçalho como DONE e regista uma nota de encerramento com a marca de tempo."
  ru: "Отмечает заголовок как DONE и записывает заметку о закрытии с временной меткой."
  ar: "وضع علامة DONE على العنوان وتسجيل ملاحظة إغلاق مع الطابع الزمني."
  hi: "शीर्षक को DONE चिह्नित करें और टाइमस्टैंप के साथ एक समापन नोट दर्ज करें।"
  bn: "শিরোনামকে DONE হিসেবে চিহ্নিত করুন এবং টাইমস্ট্যাম্পসহ একটি সমাপ্তি নোট রেকর্ড করুন।"
  zh: "将标题标记为 DONE，并记录带时间戳的关闭说明。"
  ja: "見出しを DONE にし、タイムスタンプ付きのクローズノートを記録します。"
