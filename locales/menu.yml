menu.item.org.show_all.help:
  en: "Unfold everything, showing the whole buffer."
  es: "Despliega todo, mostrando el búfer completo."
  fr: "Déplie tout, affichant l'intégralité du tampon."
  de: "Entfaltet alles und zeigt den gesamten Puffer."
  cy: "Datblygu popeth, gan ddangos y byffer cyfan."
  ga: "Dífhilleann gach rud, ag taispeáint an mhaoláin ar fad."
  gd: "Neo-phaisgidh a h-uile càil, a' sealltainn a' bhufair gu lèir."
  pl: "Rozwija wszystko, pokazując cały bufor."
  pt: "Desdobra tudo, mostrando o buffer inteiro."
  ru: "Разворачивает всё, показывая весь буфер."
  ar: "يفتح كل شيء، ويعرض المخزن المؤقت بالكامل."
  hi: "सब कुछ अनफ़ोल्ड करता है, संपूर्ण बफर दिखाते हुए।"
  bn: "সবকিছু আনফোল্ড করে, সম্পূর্ণ বাফার দেখায়।"
  zh: "展开所有内容,显示整个缓冲区。"
  ja: "すべてを展開し、バッファ全体を表示します。"
