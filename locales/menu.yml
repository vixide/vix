  cy: "Mewnosod Marc Amser Anweithredol"
  ga: "Ionsáigh Stampa Ama Neamhghníomhach"
  gd: "Cuir a-steach Stampa-ama Neo-ghnìomhach"
  pl: "Wstaw nieaktywny znacznik czasu"
  pt: "Inserir marca de tempo inativa"
  ru: "Вставить неактивную временную метку"
  ar: "إدراج طابع زمني غير نشط"
  hi: "निष्क्रिय टाइमस्टैंप डालें"
  bn: "নিষ্ক্রিয় টাইমস্ট্যাম্প সন্নিবেশ করুন"
  zh: "插入非活动时间戳"
  ja: "非アクティブなタイムスタンプを挿入"
menu.item.org.dates.timestamp_inactive.help:
  en: "Insert an inactive timestamp ([…]), which the agenda ignores."
  es: "Inserta una marca de tiempo inactiva ([…]), que la agenda ignora."
  fr: "Insère un horodatage inactif ([…]), que l'agenda ignore."
  de: "Fügt einen inaktiven Zeitstempel ([…]) ein, den die Agenda ignoriert."
  cy: "Mewnosoda farc amser anweithredol ([…]), y mae'r agenda'n ei anwybyddu."
  ga: "Ionsáigh stampa ama neamhghníomhach ([…]), a dhéanann an clár oibre neamhaird air."
  gd: "Cuir a-steach stampa-ama neo-ghnìomhach ([…]), air nach doir an clàr-gnothaich feart."
  pl: "Wstawia nieaktywny znacznik czasu ([…]), pomijany przez agendę."
  pt: "Insere uma marca de tempo inativa ([…]), que a agenda ignora."
  ru: "Вставляет неактивную временную метку ([…]), которую повестка игнорирует."
  ar: "إدراج طابع زمني غير نشط ([…])، يتجاهله جدول الأعمال."
  hi: "एक निष्क्रिय टाइमस्टैंप ([…]) डालें, जिसे एजेंडा अनदेखा करता है।"
  bn: "একটি নিষ্ক্রিয় টাইমস্ট্যাম্প ([…]) সন্নিবেশ করুন, যা এজেন্ডা উপেক্ষা করে।"
  zh: "插入非活动时间戳（[…]），日程会忽略它。"
  ja: "アジェンダが無視する非アクティブなタイムスタンプ（[…]）を挿入します。"
