menu.item.org.dates.deadline.help:
  en: "Set a DEADLINE on the headline — the date it must be finished by."
  es: "Establece un DEADLINE en el encabezado — la fecha límite para terminar."
  fr: "Définit une DEADLINE sur le titre — la date à laquelle le travail doit être terminé."
  de: "Setzt eine DEADLINE für die Überschrift — das Datum, bis zu dem sie erledigt sein muss."
  cy: "Gosod DEADLINE ar y pennawd — y dyddiad y mae'n rhaid ei orffen erbyn hynny."
  ga: "Socraigh DEADLINE ar an gceannteideal — an dáta a chaithfear é a chríochnú faoi."
  gd: "Suidhich DEADLINE air a' cheann-sgrìobhaidh — an ceann-latha as fheudar a bhith deiseil ann."
  pl: "Ustawia DEADLINE nagłówka — datę, do której musi zostać ukończone."
  pt: "Define um DEADLINE no cabeçalho — a data até a qual deve ser concluído."
  ru: "Задаёт DEADLINE для заголовка — дату, к которой это должно быть завершено."
  ar: "يضبط DEADLINE على العنوان — التاريخ الذي يجب إنجازه بحلوله."
  hi: "शीर्षक पर DEADLINE सेट करें — वह तिथि जिसके भीतर इसे पूरा करना है।"
  bn: "শিরোনামে একটি DEADLINE সেট করুন — যে তারিখের মধ্যে এটি সম্পন্ন করতে হবে।"
  zh: "在标题上设置 DEADLINE——必须完成的日期。"
  ja: "見出しに DEADLINE を設定します。完了させるべき期限日です。"
