menu.item.org.sparse_match.help:
  en: "Fold every subtree not containing the entered text; Show All clears it."
  es: "Pliega cada subárbol que no contenga el texto introducido; Mostrar Todo lo despeja."
  fr: "Replie chaque sous-arbre ne contenant pas le texte saisi ; Tout Afficher l'efface."
  de: "Faltet jeden Teilbaum, der den eingegebenen Text nicht enthält; Alles Anzeigen hebt es auf."
  cy: "Plygu pob is-goeden nad yw'n cynnwys y testun a nodwyd; mae Dangos Popeth yn ei glirio."
  ga: "Fill gach fochrann nach bhfuil an téacs a iontráladh ann; glanann Taispeáin Gach Rud é."
  gd: "Paisg gach fo-chraobh far nach eil an teacsa a chaidh a chur a-steach; falamhaichidh Seall na h-Uile e."
  pl: "Zwija każde poddrzewo niezawierające wprowadzonego tekstu; Pokaż Wszystko to czyści."
  pt: "Dobra cada subárvore que não contém o texto inserido; Mostrar Tudo a limpa."
  ru: "Сворачивает каждое поддерево, не содержащее введённый текст; «Показать Всё» очищает это."
  ar: "يطوي كل شجرة فرعية لا تحتوي على النص المُدخل؛ يمسحها إظهار الكل."
  hi: "हर उस उपवृक्ष को फ़ोल्ड करता है जिसमें दर्ज किया गया टेक्स्ट नहीं है; सभी दिखाएँ इसे साफ़ करता है।"
  bn: "প্রবেশ করানো টেক্সট নেই এমন প্রতিটি সাবট্রি ফোল্ড করে; সব দেখান এটি সাফ করে।"
  zh: "折叠所有不包含所输入文本的子树;显示全部会清除它。"
  ja: "入力したテキストを含まないサブツリーをすべて折りたたみます。すべて表示で解除されます。"
