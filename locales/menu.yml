menu.item.org.edit_src.help:
  en: "Open the source block's body in a dedicated tab; run again there to apply it back."
  es: "Abre el cuerpo del bloque de fuente en una pestaña dedicada; ejecútalo de nuevo allí para aplicarlo de vuelta."
  fr: "Ouvre le corps du bloc source dans un onglet dédié ; relance-le là-bas pour l'appliquer en retour."
  de: "Öffnet den Inhalt des Quellblocks in einem eigenen Tab; dort erneut ausführen, um ihn zurückzuübernehmen."
  cy: "Agor corff y bloc ffynhonnell mewn tab bwrpasol; rhedeg eto yno i'w gymhwyso'n ôl."
  ga: "Oscail corp an bhloic foinse i gcluaisín tiomnaithe; rith arís ansin chun é a chur i bhfeidhm ar ais."
  gd: "Fosgail corp a' bhloca tùis ann an taba sònraichte; ruith a-rithist an sin gus a chur an sàs air ais."
  pl: "Otwiera treść bloku źródłowego w dedykowanej karcie; uruchom tam ponownie, aby zastosować ją z powrotem."
  pt: "Abre o corpo do bloco de fonte em uma aba dedicada; execute novamente lá para aplicá-lo de volta."
  ru: "Открывает содержимое исходного блока в отдельной вкладке; запустите там снова, чтобы применить его обратно."
  ar: "يفتح محتوى كتلة المصدر في علامة تبويب مخصصة؛ شغّله مرة أخرى هناك لتطبيقه مرة أخرى."
  hi: "स्रोत ब्लॉक के मुख्य भाग को एक समर्पित टैब में खोलता है; इसे वापस लागू करने के लिए वहाँ फिर से चलाएँ।"
  bn: "সোর্স ব্লকের মূল অংশ একটি ডেডিকেটেড ট্যাবে খোলে; এটি ফিরিয়ে প্রয়োগ করতে সেখানে আবার চালান।"
  zh: "在专用标签页中打开源代码块的内容;在那里再次运行以将其应用回去。"
  ja: "ソースブロックの本文を専用タブで開きます。そこで再度実行すると元に反映されます。"
