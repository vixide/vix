menu.item.org.agenda.week.help:
  en: "Show the agenda for the coming week, built from scheduled items and deadlines."
  es: "Muestra la agenda de la próxima semana, generada a partir de los elementos programados y los plazos."
  fr: "Affiche l'agenda de la semaine à venir, construit à partir des éléments planifiés et des échéances."
  de: "Zeigt die Agenda für die kommende Woche, erstellt aus geplanten Elementen und Fristen."
  cy: "Dangosa'r agenda ar gyfer yr wythnos i ddod, wedi'i llunio o eitemau wedi'u hamserlennu a therfynau amser."
  ga: "Taispeáin an clár oibre don tseachtain atá romhainn, tógtha ó mhíreanna sceidealta agus spriocdhátaí."
  gd: "Seall an clàr-gnothaich airson na seachdain a tha romhainn, air a thogail bho nithean clàraichte agus cinn-latha."
  pl: "Wyświetla agendę na nadchodzący tydzień, zbudowaną z zaplanowanych elementów i terminów."
  pt: "Mostra a agenda da próxima semana, construída a partir dos itens agendados e prazos."
  ru: "Показывает повестку на предстоящую неделю, составленную из запланированных пунктов и сроков."
  ar: "عرض جدول أعمال الأسبوع القادم، مبني من العناصر المجدولة والمواعيد النهائية."
  hi: "आने वाले सप्ताह का एजेंडा दिखाएँ, जो शेड्यूल किए गए आइटम और समय-सीमाओं से बना है।"
  bn: "আসন্ন সপ্তাহের এজেন্ডা দেখান, যা নির্ধারিত আইটেম ও সময়সীমা থেকে তৈরি।"
  zh: "显示未来一周的日程，由已安排项目和截止日期生成。"
  ja: "予定項目と期限から構成される、来週のアジェンダを表示します。"
