  zh: "打开用于按段落移动的命令。"
  ja: "段落単位で移動するコマンドを開きます。"
menu.go.section.help:
  en: "Open commands for moving by sections."
  es: "Abre comandos para desplazarse por secciones."
  fr: "Ouvrir les commandes pour se déplacer par sections."
  de: "Befehle zum abschnittsweisen Navigieren öffnen."
  cy: "Agor gorchmynion i symud fesul adran."
  ga: "Oscail orduithe chun bogadh de réir ranna."
  gd: "Fosgail àitheantan gus gluasad a rèir earrannan."
  pl: "Otwórz polecenia do przechodzenia między sekcjami."
  pt: "Abrir comandos para mover-se por seções."
  ru: "Открыть команды для перехода по разделам."
  ar: "فتح أوامر للانتقال بين الأقسام."
  hi: "अनुभागों के अनुसार जाने के आदेश खोलें।"
