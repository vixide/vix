menu.item.org.archive.tag.help:
  en: "Toggle the ARCHIVE tag: a tagged subtree stays put but folds away."
  es: "Alterna la etiqueta ARCHIVE: un subárbol etiquetado permanece en su lugar, pero se pliega."
  fr: "Bascule l'étiquette ARCHIVE : une sous-arborescence étiquetée reste en place mais se replie."
  de: "Schaltet den ARCHIVE-Tag um: Ein markierter Teilbaum bleibt an seinem Platz, wird aber eingeklappt."
  cy: "Toglo'r tag ARCHIVE: mae isgoeden wedi'i thagio yn aros yn ei lle ond yn plygu i ffwrdd."
  ga: "Scoránaíonn sé an chlib ARCHIVE: fanann fo-chrann atá clibeáilte san áit chéanna ach filleann sé ar shiúl."
  gd: "Toglaichidh seo an tag ARCHIVE: fanaidh fo-chraobh le tag far a bheil i ach paisgidh i air falbh."
  pl: "Przełącza znacznik ARCHIVE: oznaczone poddrzewo pozostaje na miejscu, ale zostaje zwinięte."
  pt: "Alterna a etiqueta ARCHIVE: uma subárvore etiquetada permanece no lugar, mas se recolhe."
  ru: "Переключает тег ARCHIVE: помеченное поддерево остаётся на месте, но сворачивается."
  ar: "يبدّل وسم ARCHIVE: تبقى الشجرة الفرعية الموسومة في مكانها لكنها تُطوى بعيدًا."
  hi: "ARCHIVE टैग को टॉगल करता है: टैग किया गया उप-वृक्ष अपनी जगह पर रहता है लेकिन सिमट जाता है।"
  bn: "ARCHIVE ট্যাগ টগল করে: ট্যাগ করা সাব-ট্রি জায়গায় থাকে কিন্তু ভাঁজ হয়ে যায়।"
  zh: "切换 ARCHIVE 标签:被标记的子树留在原处,但会折叠起来。"
  ja: "ARCHIVE タグを切り替えます。タグの付いたサブツリーはその場に残りますが、折りたたまれます。"
