menu.item.org.column_view_menu.help:
  en: "A live spreadsheet overlay on the outline, driven by the COLUMNS format spec."
  es: "Una superposición de hoja de cálculo en vivo sobre el esquema, controlada por la especificación de formato COLUMNS."
  fr: "Une superposition de feuille de calcul en direct sur le plan, pilotée par la spécification de format COLUMNS."
  de: "Ein Live-Tabellenkalkulations-Overlay auf der Gliederung, gesteuert durch die COLUMNS-Formatspezifikation."
  cy: "Troshaen taenlen fyw ar yr amlinell, wedi'i yrru gan y fanyleb fformat COLUMNS."
  ga: "Forleagan scarbhileog beo ar an imlíne, á thiomáint ag sonraíocht formáide COLUMNS."
  gd: "Tar-chòmhdach cliath-dhuilleige beò air an structar, air a stiùireadh leis an sònrachadh cruth COLUMNS."
  pl: "Nakładka arkusza kalkulacyjnego na żywo na konspekcie, sterowana specyfikacją formatu COLUMNS."
  pt: "Uma sobreposição de planilha em tempo real sobre a estrutura, controlada pela especificação de formato COLUMNS."
  ru: "Живая накладка электронной таблицы поверх структуры, управляемая спецификацией формата COLUMNS."
  ar: "طبقة تراكب لجدول بيانات حي فوق المخطط، يديرها مواصفات تنسيق COLUMNS."
  hi: "रूपरेखा पर एक लाइव स्प्रेडशीट ओवरले, जो COLUMNS फ़ॉर्मेट स्पेक द्वारा संचालित है।"
  bn: "আউটলাইনের উপরে একটি লাইভ স্প্রেডশীট ওভারলে, যা COLUMNS ফরম্যাট স্পেক দ্বারা চালিত।"
  zh: "大纲上的实时电子表格叠加层,由 COLUMNS 格式规范驱动。"
  ja: "アウトラインの上に重ねるライブスプレッドシートで、COLUMNS フォーマット仕様によって駆動されます。"
