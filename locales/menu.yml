menu.item.org.table.rectangle.help:
  en: "Copy, cut, and paste a rectangular block of table cells."
  es: "Copia, corta y pega un bloque rectangular de celdas de la tabla."
  fr: "Copie, coupe et colle un bloc rectangulaire de cellules du tableau."
  de: "Kopiert, schneidet aus und fügt einen rechteckigen Block von Tabellenzellen ein."
  cy: "Copïo, torri, a gludo bloc petryal o gelloedd tabl."
  ga: "Cóipeáil, gearr, agus greamaigh bloc dronuilleogach de chealla tábla."
  gd: "Dèan lethbhreac, geàrr, agus cuir ann bloca ceart-cheàrnach de cheallan clàir."
  pl: "Kopiuje, wycina i wkleja prostokątny blok komórek tabeli."
  pt: "Copia, recorta e cola um bloco retangular de células da tabela."
  ru: "Копирует, вырезает и вставляет прямоугольный блок ячеек таблицы."
  ar: "نسخ وقص ولصق كتلة مستطيلة من خلايا الجدول."
  hi: "तालिका की कोशिकाओं के एक आयताकार खंड को कॉपी, कट और पेस्ट करें।"
  bn: "টেবিলের কোষের একটি আয়তাকার ব্লক কপি, কাট এবং পেস্ট করুন।"
  zh: "复制、剪切并粘贴表格单元格的矩形区块。"
  ja: "テーブルセルの矩形ブロックをコピー、切り取り、貼り付けします。"
