menu.item.org.agenda.files.help:
  en: "Choose which files the agenda scans; an empty list means every .org file in the project."
  es: "Elige qué archivos escanea la agenda; una lista vacía significa todos los archivos .org del proyecto."
  fr: "Choisit les fichiers analysés par l'agenda ; une liste vide signifie tous les fichiers .org du projet."
  de: "Wählt aus, welche Dateien die Agenda durchsucht; eine leere Liste bedeutet alle .org-Dateien des Projekts."
  cy: "Dewis pa ffeiliau y mae'r agenda'n eu sganio; mae rhestr wag yn golygu pob ffeil .org yn y prosiect."
  ga: "Roghnaigh cé na comhaid a scanann an clár oibre; ciallaíonn liosta folamh gach comhad .org sa tionscadal."
  gd: "Tagh dè na faidhlichean a sganas an clàr-gnothaich; tha liosta falamh a' ciallachadh a h-uile faidhle .org sa phròiseact."
  pl: "Wybiera, które pliki skanuje agenda; pusta lista oznacza każdy plik .org w projekcie."
  pt: "Escolhe quais arquivos a agenda examina; uma lista vazia significa todos os arquivos .org do projeto."
  ru: "Выбирает файлы, которые сканирует повестка; пустой список означает все файлы .org в проекте."
  ar: "اختيار الملفات التي يفحصها جدول الأعمال؛ القائمة الفارغة تعني كل ملفات .org في المشروع."
  hi: "चुनें कि एजेंडा किन फ़ाइलों को स्कैन करता है; खाली सूची का अर्थ है परियोजना की हर .org फ़ाइल।"
  bn: "এজেন্ডা কোন ফাইল স্ক্যান করবে তা বেছে নিন; খালি তালিকা মানে প্রকল্পের প্রতিটি .org ফাইল।"
  zh: "选择日程扫描哪些文件；空列表表示项目中每个 .org 文件都会被扫描。"
  ja: "アジェンダがスキャンするファイルを選びます。空のリストはプロジェクト内のすべての .org ファイルを意味します。"
