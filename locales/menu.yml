menu.item.org.table.move_column_left.help:
  en: "Swap the current column with the one to its left."
  es: "Intercambia la columna actual con la que está a su izquierda."
  fr: "Permute la colonne actuelle avec celle qui est à sa gauche."
  de: "Vertauscht die aktuelle Spalte mit der links daneben."
  cy: "Cyfnewid y golofn bresennol â'r un i'r chwith iddi."
  ga: "Malartaigh an colún reatha leis an gceann ar chlé air."
  gd: "Iomlaidich an colbh làithreach leis an fhear air a thaobh chlì."
  pl: "Zamienia bieżącą kolumnę z kolumną po jej lewej stronie."
  pt: "Troca a coluna atual com a que está à sua esquerda."
  ru: "Меняет местами текущий столбец со столбцом слева от него."
  ar: "يبدّل العمود الحالي مع العمود الذي على يساره."
  hi: "वर्तमान कॉलम की उसके बाईं ओर वाले कॉलम से अदला-बदली करता है।"
  bn: "বর্তমান কলামটি তার বাঁদিকের কলামের সাথে অদলবদল করে।"
  zh: "将当前列与其左侧的列互换。"
  ja: "現在の列を左隣の列と入れ替えます。"
