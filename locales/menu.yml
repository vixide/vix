menu.item.org.table.move_column_right.help:
  en: "Swap the current column with the one to its right."
  es: "Intercambia la columna actual con la que está a su derecha."
  fr: "Permute la colonne actuelle avec celle qui est à sa droite."
  de: "Vertauscht die aktuelle Spalte mit der rechts daneben."
  cy: "Cyfnewid y golofn bresennol â'r un i'r dde iddi."
  ga: "Malartaigh an colún reatha leis an gceann ar dheis air."
  gd: "Iomlaidich an colbh làithreach leis an fhear air a thaobh dheas."
  pl: "Zamienia bieżącą kolumnę z kolumną po jej prawej stronie."
  pt: "Troca a coluna atual com a que está à sua direita."
  ru: "Меняет местами текущий столбец со столбцом справа от него."
  ar: "يبدّل العمود الحالي مع العمود الذي على يمينه."
  hi: "वर्तमान कॉलम की उसके दाईं ओर वाले कॉलम से अदला-बदली करता है।"
  bn: "বর্তমান কলামটি তার ডানদিকের কলামের সাথে অদলবদল করে।"
  zh: "将当前列与其右侧的列互换。"
  ja: "現在の列を右隣の列と入れ替えます。"
menu.item.org.table.sort:
  en: "Sort Table…"
  es: "Ordenar Tabla…"
  fr: "Trier le Tableau…"
  de: "Tabelle Sortieren…"
  cy: "Trefnu'r Tabl…"
  ga: "Sórtáil an Tábla…"
  gd: "Seòrsaich an Clàr…"
  pl: "Sortuj Tabelę…"
  pt: "Ordenar Tabela…"
  ru: "Сортировать таблицу…"
  ar: "فرز الجدول…"
  hi: "तालिका क्रमबद्ध करें…"
  bn: "টেবিল সাজান…"
  zh: "排序表格…"
  ja: "テーブルを並べ替え…"
menu.item.org.table.sort.help:
  en: "Sort the table's rows by a column: alphabetic, numeric, or time order."
  es: "Ordena las filas de la tabla por una columna: orden alfabético, numérico o de tiempo."
  fr: "Trie les lignes du tableau par une colonne : ordre alphabétique, numérique ou chronologique."
  de: "Sortiert die Tabellenzeilen nach einer Spalte: alphabetisch, numerisch oder chronologisch."
  cy: "Trefnu rhesi'r tabl yn ôl colofn: trefn yr wyddor, rhifiadol, neu amser."
  ga: "Sórtáil rónna an tábla de réir colúin: ord aibítre, uimhriúil, nó ama."
  gd: "Seòrsaich sreathan a' chlàir a-rèir colbh: òrdugh na h-aibideil, àireamhach, no ùine."
  pl: "Sortuje wiersze tabeli według kolumny: alfabetycznie, numerycznie lub czasowo."
  pt: "Ordena as linhas da tabela por uma coluna: ordem alfabética, numérica ou de data/hora."
  ru: "Сортирует строки таблицы по столбцу: в алфавитном, числовом или временном порядке."
  ar: "يفرز صفوف الجدول حسب عمود: أبجديًا، أو رقميًا، أو زمنيًا."
  hi: "तालिका की पंक्तियों को किसी कॉलम के आधार पर क्रमबद्ध करता है: वर्णानुक्रम, संख्यात्मक, या समय क्रम।"
  bn: "একটি কলাম অনুযায়ী টেবিলের সারিগুলো সাজায়: বর্ণানুক্রমিক, সাংখ্যিক, বা সময়ের ক্রম।"
  zh: "按某一列对表格的行排序:按字母顺序、数字顺序或时间顺序。"
  ja: "列を基準にテーブルの行を並べ替えます — アルファベット順、数値順、または時刻順。"
menu.item.org.table.sum_column:
  en: "Sum Column"
  es: "Sumar Columna"
  fr: "Additionner la Colonne"
  de: "Spalte Summieren"
  cy: "Adio'r Golofn"
  ga: "Suimigh an Colún"
  gd: "Cuir Suim ris a' Cholbh"
  pl: "Zsumuj Kolumnę"
  pt: "Somar Coluna"
  ru: "Суммировать столбец"
  ar: "جمع العمود"
  hi: "कॉलम का योग करें"
  bn: "কলামের সমষ্টি"
  zh: "列求和"
  ja: "列を合計"
menu.item.org.table.sum_column.help:
  en: "Sum the numeric cells of the current column onto the status line and clipboard."
  es: "Suma las celdas numéricas de la columna actual y las coloca en la línea de estado y el portapapeles."
  fr: "Additionne les cellules numériques de la colonne actuelle vers la barre d'état et le presse-papiers."
  de: "Summiert die numerischen Zellen der aktuellen Spalte in die Statuszeile und die Zwischenablage."
  cy: "Adio celloedd rhifiadol y golofn gyfredol i'r llinell statws a'r clipfwrdd."
  ga: "Suimíonn sé na cealla uimhriúla den cholún reatha isteach sa líne stádais agus sa ghearrthaisce."
  gd: "Cuiridh e suim ri ceallan àireamhach a' cholbh làithrich air an loidhne-stàitis agus air a' bhòrd-lann."
  pl: "Sumuje liczbowe komórki bieżącej kolumny i umieszcza wynik na pasku stanu i w schowku."
  pt: "Soma as células numéricas da coluna atual para a linha de estado e a área de transferência."
  ru: "Суммирует числовые ячейки текущего столбца и выводит результат в строку состояния и буфер обмена."
  ar: "يجمع الخلايا الرقمية في العمود الحالي ويضع الناتج في شريط الحالة وفي الحافظة."
  hi: "वर्तमान कॉलम की संख्यात्मक सेल का योग स्टेटस लाइन और क्लिपबोर्ड पर करता है।"
  bn: "বর্তমান কলামের সাংখ্যিক সেলগুলোর যোগফল স্ট্যাটাস লাইন ও ক্লিপবোর্ডে প্রদর্শন করে।"
  zh: "将当前列的数字单元格求和,并输出到状态栏和剪贴板。"
  ja: "現在の列の数値セルを合計し、ステータス行とクリップボードに出力します。"
menu.item.org.table.recalc:
  en: "Recalculate (Apply Formulas)"
  es: "Recalcular (Aplicar Fórmulas)"
  fr: "Recalculer (Appliquer les Formules)"
  de: "Neu Berechnen (Formeln Anwenden)"
  cy: "Ailgyfrifo (Cymhwyso Fformiwlâu)"
  ga: "Athríomh (Cuir Foirmlí i bhFeidhm)"
  gd: "Ath-àireamh (Cuir an Gnìomh Foirmlean)"
  pl: "Przelicz Ponownie (Zastosuj Formuły)"
  pt: "Recalcular (Aplicar Fórmulas)"
  ru: "Пересчитать (применить формулы)"
  ar: "إعادة الحساب (تطبيق الصيغ)"
  hi: "पुनर्गणना करें (सूत्र लागू करें)"
  bn: "পুনরায় গণনা করুন (সূত্র প্রয়োগ করুন)"
  zh: "重新计算(应用公式)"
  ja: "再計算(数式を適用)"
menu.item.org.table.recalc.help:
  en: "Realign the table and apply its #+TBLFM: formulas, if any."
  es: "Realinea la tabla y aplica sus fórmulas #+TBLFM:, si las tiene."
  fr: "Réaligne le tableau et applique ses formules #+TBLFM:, le cas échéant."
  de: "Richtet die Tabelle neu aus und wendet ihre #+TBLFM:-Formeln an, falls vorhanden."
  cy: "Ailalinio'r tabl a chymhwyso'i fformiwlâu #+TBLFM:, os oes rhai."
  ga: "Athailínigh an tábla agus cuir a chuid foirmlí #+TBLFM: i bhfeidhm, más ann dóibh."
  gd: "Ath-cho-thaobhaich an clàr agus cuir an gnìomh na foirmlean #+TBLFM: aige, ma tha gin ann."
  pl: "Ponownie wyrównuje tabelę i stosuje jej formuły #+TBLFM:, jeśli takie istnieją."
  pt: "Realinha a tabela e aplica as suas fórmulas #+TBLFM:, se existirem."
  ru: "Заново выравнивает таблицу и применяет её формулы #+TBLFM:, если они есть."
  ar: "يعيد محاذاة الجدول ويطبّق صيغ #+TBLFM: الخاصة به، إن وُجدت."
  hi: "तालिका को फिर से संरेखित करता है और उसके #+TBLFM: सूत्र लागू करता है, यदि कोई हों।"
  bn: "টেবিলটি পুনরায় প্রান্তিক করে এবং এর #+TBLFM: সূত্রগুলো প্রয়োগ করে, যদি থাকে।"
  zh: "重新对齐表格,并应用其 #+TBLFM: 公式(如果有)。"
  ja: "テーブルを再整列し、#+TBLFM: 数式があれば適用します。"
menu.item.org.table.transpose:
  en: "Transpose Table"
  es: "Transponer Tabla"
  fr: "Transposer le Tableau"
  de: "Tabelle Transponieren"
  cy: "Trawsosod y Tabl"
  ga: "Trasnaigh an Tábla"
  gd: "Tar-chuir an Clàr"
  pl: "Transponuj Tabelę"
  pt: "Transpor Tabela"
  ru: "Транспонировать таблицу"
  ar: "تبديل صفوف الجدول بأعمدته"
  hi: "तालिका स्थानान्तरित करें"
  bn: "টেবিল স্থানান্তর করুন"
  zh: "转置表格"
  ja: "テーブルを転置"
menu.item.org.table.transpose.help:
  en: "Swap the table's rows and columns, dropping horizontal rules."
  es: "Intercambia las filas y columnas de la tabla, eliminando las líneas horizontales."
  fr: "Permute les lignes et les colonnes du tableau, en supprimant les lignes horizontales."
  de: "Vertauscht die Zeilen und Spalten der Tabelle und entfernt dabei horizontale Linien."
  cy: "Cyfnewid rhesi a cholofnau'r tabl, gan ollwng y llinellau llorweddol."
  ga: "Malartaigh rónna agus colúin an tábla, ag ligean síos na línte cothrománacha."
  gd: "Iomlaidich sreathan is colbhan a' chlàir, a' leigeil seachad nan loidhnichean còmhnard."
  pl: "Zamienia miejscami wiersze i kolumny tabeli, pomijając linie poziome."
  pt: "Troca as linhas e colunas da tabela, descartando as linhas horizontais."
  ru: "Меняет местами строки и столбцы таблицы, отбрасывая горизонтальные линии."
  ar: "يبدّل صفوف الجدول وأعمدته، مع إسقاط الخطوط الأفقية."
  hi: "तालिका की पंक्तियों और कॉलम की अदला-बदली करता है, क्षैतिज रेखाओं को हटाते हुए।"
  bn: "টেবিলের সারি ও কলাম অদলবদল করে, অনুভূমিক রেখাগুলো বাদ দিয়ে।"
  zh: "交换表格的行和列,并去除水平线。"
  ja: "テーブルの行と列を入れ替え、水平線は取り除きます。"
menu.item.org.table.copy_down:
  en: "Copy Field from Above"
  es: "Copiar Campo de Arriba"
  fr: "Copier le Champ du Dessus"
  de: "Feld von Oben Kopieren"
  cy: "Copïo Maes o'r Uchod"
  ga: "Cóipeáil Réimse ón mBarr"
  gd: "Dèan Lethbhreac de Raon on Fhear os a Chionn"
  pl: "Kopiuj Pole z Góry"
  pt: "Copiar Campo de Cima"
  ru: "Копировать поле сверху"
  ar: "نسخ الحقل من الأعلى"
  hi: "ऊपर से फ़ील्ड कॉपी करें"
  bn: "উপরের ফিল্ড অনুলিপি করুন"
  zh: "从上方复制字段"
  ja: "上のフィールドをコピー"
menu.item.org.table.copy_down.help:
  en: "Fill an empty field from the nearest non-empty field above it, or copy a filled field down to the next row."
  es: "Rellena un campo vacío con el campo no vacío más cercano encima, o copia un campo lleno a la fila siguiente."
  fr: "Remplit un champ vide avec le champ non vide le plus proche au-dessus, ou copie un champ rempli vers la ligne suivante."
  de: "Füllt ein leeres Feld mit dem nächstgelegenen nicht leeren Feld darüber, oder kopiert ein gefülltes Feld in die nächste Zeile."
  cy: "Llenwi maes gwag â'r maes nad yw'n wag agosaf uwch ei ben, neu gopïo maes llawn i lawr i'r rhes nesaf."
  ga: "Líon réimse folamh ón réimse neamhfholamh is gaire os a chionn, nó cóipeáil réimse líonta síos go dtí an chéad ró eile."
  gd: "Lìon raon falamh bhon raon as fhaisge nach eil falamh os a chionn, no dèan lethbhreac de raon a tha air a lìonadh sìos chun na h-ath sreath."
  pl: "Wypełnia puste pole najbliższym niepustym polem powyżej lub kopiuje wypełnione pole w dół do następnego wiersza."
  pt: "Preenche um campo vazio com o campo não vazio mais próximo acima dele, ou copia um campo preenchido para a linha seguinte."
  ru: "Заполняет пустое поле ближайшим непустым полем сверху или копирует заполненное поле в следующую строку."
  ar: "يملأ حقلًا فارغًا من أقرب حقل غير فارغ فوقه، أو ينسخ حقلًا مملوءًا إلى الصف التالي."
  hi: "किसी खाली फ़ील्ड को उसके ऊपर के निकटतम गैर-खाली फ़ील्ड से भरता है, या भरी हुई फ़ील्ड को अगली पंक्ति में कॉपी करता है।"
  bn: "একটি খালি ফিল্ডকে তার উপরের নিকটতম অ-খালি ফিল্ড থেকে পূরণ করে, অথবা একটি পূর্ণ ফিল্ড পরবর্তী সারিতে অনুলিপি করে।"
  zh: "用其上方最近的非空字段填充空字段,或将已填充的字段向下复制到下一行。"
  ja: "空のフィールドをその上にある最も近い空でないフィールドで埋めるか、埋まっているフィールドを次の行にコピーします。"
menu.item.org.table.create_from_region:
  en: "Create Table from Selection"
  es: "Crear Tabla a partir de la Selección"
  fr: "Créer un Tableau à partir de la Sélection"
  de: "Tabelle aus Auswahl Erstellen"
  cy: "Creu Tabl o'r Dewisiad"
  ga: "Cruthaigh Tábla ón Roghnú"
