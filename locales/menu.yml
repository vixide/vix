menu.item.vix.about.help:
  en: "Show version and credits for Vix."
  es: "Muestra la versión y los créditos de Vix."
  fr: "Affiche la version et les crédits de Vix."
  de: "Zeigt Version und Mitwirkende von Vix an."
  cy: "Dangos fersiwn a chydnabyddiaethau Vix."
  ga: "Taispeáin an leagan agus na creidiúintí do Vix."
  gd: "Seall an tionndadh agus an luchd-cuideachaidh airson Vix."
  pl: "Wyświetla wersję i twórców Vix."
  pt: "Mostra a versão e os créditos do Vix."
  ru: "Показывает версию и авторов Vix."
  ar: "يعرض إصدار Vix والمساهمين فيه."
  hi: "Vix का संस्करण और श्रेय दिखाएँ।"
  bn: "Vix-এর সংস্করণ ও কৃতিত্ব দেখান।"
  zh: "显示 Vix 的版本和致谢信息。"
  ja: "Vix のバージョンとクレジットを表示します。"
menu.item.vix.website.help:
  en: "Open the Vix website in your browser."
  es: "Abre el sitio web de Vix en tu navegador."
  fr: "Ouvre le site web de Vix dans votre navigateur."
  de: "Öffnet die Vix-Website im Browser."
  cy: "Agor gwefan Vix yn eich porwr."
  ga: "Oscail suíomh gréasáin Vix i do bhrabhsálaí."
  gd: "Fosgail làrach-lìn Vix sa bhrabhsair agad."
  pl: "Otwiera witrynę Vix w przeglądarce."
  pt: "Abre o site do Vix no seu navegador."
  ru: "Открывает сайт Vix в браузере."
  ar: "يفتح موقع Vix في متصفحك."
  hi: "अपने ब्राउज़र में Vix की वेबसाइट खोलें।"
  bn: "আপনার ব্রাউজারে Vix-এর ওয়েবসাইট খুলুন।"
  zh: "在浏览器中打开 Vix 网站。"
  ja: "ブラウザで Vix のウェブサイトを開きます。"
menu.item.vix.email.help:
  en: "Compose a new email to the Vix team."
  es: "Redacta un nuevo correo para el equipo de Vix."
  fr: "Rédige un nouvel e-mail à l'équipe Vix."
  de: "Verfasst eine neue E-Mail an das Vix-Team."
  cy: "Cyfansoddi e-bost newydd at dîm Vix."
  ga: "Cum ríomhphost nua chuig foireann Vix."
  gd: "Sgrìobh post-d ùr gu sgioba Vix."
  pl: "Tworzy nową wiadomość e-mail do zespołu Vix."
  pt: "Compõe um novo e-mail para a equipe do Vix."
  ru: "Создаёт новое письмо команде Vix."
  ar: "ينشئ رسالة بريد إلكتروني جديدة إلى فريق Vix."
  hi: "Vix टीम को नया ईमेल लिखें।"
  bn: "Vix দলকে একটি নতুন ইমেল লিখুন।"
  zh: "撰写一封发给 Vix 团队的新邮件。"
  ja: "Vix チームへの新しいメールを作成します。"
menu.item.vix.keybindings.help:
  en: "Open the keybinding editor: search, rebind, and reset shortcuts."
  es: "Abre el editor de combinaciones de teclas: busca, reasigna y restablece atajos."
  fr: "Ouvre l'éditeur de raccourcis clavier : rechercher, réattribuer et réinitialiser les raccourcis."
  de: "Öffnet den Tastenkombinationseditor: Verknüpfungen suchen, neu zuweisen und zurücksetzen."
  cy: "Agor y golygydd byrfyrddau: chwilio, ailfapio, ac ailosod llwybrau byr."
  ga: "Oscail an t-eagarthóir ceangal eochracha: cuardaigh, athcheangail, agus athshocraigh aicearraí."
  gd: "Fosglaidh e deasaiche nan ceanglaichean-iuchrach: lorg, ath-cheangail, agus ath-shuidhich ath-ghoiridean."
  pl: "Otwiera edytor skrótów klawiszowych: wyszukiwanie, ponowne przypisywanie i resetowanie skrótów."
  pt: "Abre o editor de atalhos de teclado: pesquisar, reatribuir e repor atalhos."
  ru: "Открывает редактор сочетаний клавиш: поиск, переназначение и сброс сочетаний."
  ar: "يفتح محرر اختصارات لوحة المفاتيح: البحث عن الاختصارات وإعادة تعيينها وإعادة ضبطها."
  hi: "कीबाइंडिंग संपादक खोलता है: शॉर्टकट खोजें, फिर से असाइन करें, और रीसेट करें।"
  bn: "কীবাইন্ডিং সম্পাদক খোলে: শর্টকাট খুঁজুন, পুনরায় বাইন্ড করুন, এবং রিসেট করুন।"
  zh: "打开键位绑定编辑器:搜索、重新绑定和重置快捷键。"
  ja: "キーバインドエディタを開きます。ショートカットの検索、再割り当て、リセットができます。"
menu.item.vix.settings.help:
  en: "Open the Vix settings editor."
  es: "Abre el editor de configuración de Vix."
  fr: "Ouvre l'éditeur de paramètres de Vix."
  de: "Öffnet den Einstellungseditor von Vix."
  cy: "Agor golygydd gosodiadau Vix."
  ga: "Oscail eagarthóir socruithe Vix."
  gd: "Fosgail deasaiche roghainnean Vix."
  pl: "Otwiera edytor ustawień Vix."
  pt: "Abre o editor de configurações do Vix."
  ru: "Открывает редактор настроек Vix."
  ar: "يفتح محرّر إعدادات Vix."
  hi: "Vix सेटिंग्स संपादक खोलें।"
  bn: "Vix সেটিংস সম্পাদক খুলুন।"
  zh: "打开 Vix 设置编辑器。"
  ja: "Vix の設定エディターを開きます。"
menu.item.file.quit.help:
  en: "Exit Vix."
  es: "Sale de Vix."
  fr: "Quitte Vix."
  de: "Beendet Vix."
  cy: "Gadael Vix."
  ga: "Scoir de Vix."
  gd: "Fàg Vix."
  pl: "Zamyka Vix."
  pt: "Sai do Vix."
  ru: "Выходит из Vix."
  ar: "يُنهي Vix."
  hi: "Vix से बाहर निकलें।"
  bn: "Vix থেকে প্রস্থান করুন।"
  zh: "退出 Vix。"
  ja: "Vix を終了します。"
menu.item.tools.insert.uuid.v1.help:
  en: "Insert a version 1 UUID from a timestamp and MAC address."
  es: "Inserta un UUID versión 1 a partir de una marca de tiempo y una dirección MAC."
  fr: "Insère un UUID version 1 à partir d'un horodatage et d'une adresse MAC."
  de: "Fügt eine UUID der Version 1 aus Zeitstempel und MAC-Adresse ein."
  cy: "Mewnosod UUID fersiwn 1 o stamp amser a chyfeiriad MAC."
  ga: "Ionsáigh UUID leagan 1 ó stampa ama agus seoladh MAC."
  gd: "Cuir a-steach UUID tionndadh 1 bho stampa-ama is seòladh MAC."
  pl: "Wstawia UUID w wersji 1 ze znacznika czasu i adresu MAC."
  pt: "Insere um UUID versão 1 a partir de um carimbo de data/hora e endereço MAC."
  ru: "Вставляет UUID версии 1 из метки времени и MAC-адреса."
  ar: "يُدرج UUID من الإصدار 1 من طابع زمني وعنوان MAC."
  hi: "टाइमस्टैम्प और MAC पते से एक संस्करण 1 UUID डालें।"
  bn: "টাইমস্ট্যাম্প ও MAC ঠিকানা থেকে একটি সংস্করণ 1 UUID সন্নিবেশ করুন।"
  zh: "根据时间戳和 MAC 地址插入版本 1 的 UUID。"
  ja: "タイムスタンプと MAC アドレスからバージョン 1 の UUID を挿入します。"
menu.item.tools.insert.uuid.v2.help:
  en: "Insert a version 2 DCE Security UUID."
  es: "Inserta un UUID versión 2 de seguridad DCE."
  fr: "Insère un UUID version 2 de sécurité DCE."
  de: "Fügt eine UUID der Version 2 (DCE Security) ein."
  cy: "Mewnosod UUID fersiwn 2 diogelwch DCE."
  ga: "Ionsáigh UUID leagan 2 Slándáil DCE."
  gd: "Cuir a-steach UUID tionndadh 2 Tèarainteachd DCE."
  pl: "Wstawia UUID w wersji 2 (DCE Security)."
  pt: "Insere um UUID versão 2 de segurança DCE."
  ru: "Вставляет UUID версии 2 (DCE Security)."
  ar: "يُدرج UUID من الإصدار 2 لأمان DCE."
  hi: "एक संस्करण 2 DCE सुरक्षा UUID डालें।"
  bn: "একটি সংস্করণ 2 DCE Security UUID সন্নিবেশ করুন।"
  zh: "插入版本 2 的 DCE 安全 UUID。"
  ja: "バージョン 2 の DCE セキュリティ UUID を挿入します。"
menu.item.tools.insert.uuid.v3.help:
  en: "Insert a version 3 UUID hashed from a name with MD5."
  es: "Inserta un UUID versión 3 obtenido de un nombre con MD5."
  fr: "Insère un UUID version 3 haché à partir d'un nom avec MD5."
  de: "Fügt eine UUID der Version 3 ein, aus einem Namen per MD5 gehasht."
  cy: "Mewnosod UUID fersiwn 3 wedi'i stwnsio o enw gyda MD5."
  ga: "Ionsáigh UUID leagan 3 haiseáilte ó ainm le MD5."
  gd: "Cuir a-steach UUID tionndadh 3 air a hais bho ainm le MD5."
  pl: "Wstawia UUID w wersji 3 utworzony z nazwy przy użyciu MD5."
  pt: "Insere um UUID versão 3 gerado de um nome com MD5."
  ru: "Вставляет UUID версии 3, полученный из имени с помощью MD5."
  ar: "يُدرج UUID من الإصدار 3 مُجزّأ من اسم باستخدام MD5."
  hi: "MD5 से नाम को हैश करके एक संस्करण 3 UUID डालें।"
  bn: "MD5 দিয়ে একটি নাম হ্যাশ করে একটি সংস্করণ 3 UUID সন্নিবেশ করুন।"
  zh: "插入用 MD5 对名称哈希得到的版本 3 UUID。"
  ja: "MD5 で名前をハッシュしたバージョン 3 の UUID を挿入します。"
menu.item.tools.insert.uuid.v4.help:
  en: "Insert a random version 4 UUID."
  es: "Inserta un UUID versión 4 aleatorio."
  fr: "Insère un UUID version 4 aléatoire."
  de: "Fügt eine zufällige UUID der Version 4 ein."
  cy: "Mewnosod UUID fersiwn 4 ar hap."
  ga: "Ionsáigh UUID leagan 4 randamach."
  gd: "Cuir a-steach UUID tionndadh 4 air thuaiream."
  pl: "Wstawia losowy UUID w wersji 4."
  pt: "Insere um UUID versão 4 aleatório."
  ru: "Вставляет случайный UUID версии 4."
  ar: "يُدرج UUID عشوائيًا من الإصدار 4."
  hi: "एक यादृच्छिक संस्करण 4 UUID डालें।"
  bn: "একটি এলোমেলো সংস্করণ 4 UUID সন্নিবেশ করুন।"
  zh: "插入随机的版本 4 UUID。"
  ja: "ランダムなバージョン 4 の UUID を挿入します。"
menu.item.tools.insert.uuid.v5.help:
  en: "Insert a version 5 UUID hashed from a name with SHA-1."
  es: "Inserta un UUID versión 5 obtenido de un nombre con SHA-1."
  fr: "Insère un UUID version 5 haché à partir d'un nom avec SHA-1."
  de: "Fügt eine UUID der Version 5 ein, aus einem Namen per SHA-1 gehasht."
  cy: "Mewnosod UUID fersiwn 5 wedi'i stwnsio o enw gyda SHA-1."
  ga: "Ionsáigh UUID leagan 5 haiseáilte ó ainm le SHA-1."
  gd: "Cuir a-steach UUID tionndadh 5 air a hais bho ainm le SHA-1."
  pl: "Wstawia UUID w wersji 5 utworzony z nazwy przy użyciu SHA-1."
  pt: "Insere um UUID versão 5 gerado de um nome com SHA-1."
  ru: "Вставляет UUID версии 5, полученный из имени с помощью SHA-1."
  ar: "يُدرج UUID من الإصدار 5 مُجزّأ من اسم باستخدام SHA-1."
  hi: "SHA-1 से नाम को हैश करके एक संस्करण 5 UUID डालें।"
  bn: "SHA-1 দিয়ে একটি নাম হ্যাশ করে একটি সংস্করণ 5 UUID সন্নিবেশ করুন।"
  zh: "插入用 SHA-1 对名称哈希得到的版本 5 UUID。"
  ja: "SHA-1 で名前をハッシュしたバージョン 5 の UUID を挿入します。"
menu.item.tools.insert.uuid.v6.help:
  en: "Insert a sortable version 6 UUID from a timestamp and MAC address."
  es: "Inserta un UUID versión 6 ordenable a partir de una marca de tiempo y una dirección MAC."
  fr: "Insère un UUID version 6 triable à partir d'un horodatage et d'une adresse MAC."
  de: "Fügt eine sortierbare UUID der Version 6 aus Zeitstempel und MAC-Adresse ein."
  cy: "Mewnosod UUID fersiwn 6 trefnadwy o stamp amser a chyfeiriad MAC."
  ga: "Ionsáigh UUID leagan 6 in-sórtáilte ó stampa ama agus seoladh MAC."
  gd: "Cuir a-steach UUID tionndadh 6 a ghabhas seòrsachadh bho stampa-ama is seòladh MAC."
  pl: "Wstawia sortowalny UUID w wersji 6 ze znacznika czasu i adresu MAC."
  pt: "Insere um UUID versão 6 ordenável a partir de um carimbo de data/hora e endereço MAC."
  ru: "Вставляет сортируемый UUID версии 6 из метки времени и MAC-адреса."
  ar: "يُدرج UUID قابلًا للفرز من الإصدار 6 من طابع زمني وعنوان MAC."
  hi: "टाइमस्टैम्प और MAC पते से एक क्रमबद्ध करने योग्य संस्करण 6 UUID डालें।"
  bn: "টাইমস্ট্যাম্প ও MAC ঠিকানা থেকে একটি সাজানো-যোগ্য সংস্করণ 6 UUID সন্নিবেশ করুন।"
  zh: "根据时间戳和 MAC 地址插入可排序的版本 6 UUID。"
  ja: "タイムスタンプと MAC アドレスからソート可能なバージョン 6 の UUID を挿入します。"
menu.item.tools.insert.uuid.v7.help:
  en: "Insert a version 7 UUID from a timestamp and random bits."
  es: "Inserta un UUID versión 7 a partir de una marca de tiempo y bits aleatorios."
  fr: "Insère un UUID version 7 à partir d'un horodatage et de bits aléatoires."
  de: "Fügt eine UUID der Version 7 aus Zeitstempel und Zufallsbits ein."
  cy: "Mewnosod UUID fersiwn 7 o stamp amser a didau ar hap."
  ga: "Ionsáigh UUID leagan 7 ó stampa ama agus giotáin randamacha."
  gd: "Cuir a-steach UUID tionndadh 7 bho stampa-ama is bits air thuaiream."
  pl: "Wstawia UUID w wersji 7 ze znacznika czasu i losowych bitów."
  pt: "Insere um UUID versão 7 a partir de um carimbo de data/hora e bits aleatórios."
  ru: "Вставляет UUID версии 7 из метки времени и случайных битов."
  ar: "يُدرج UUID من الإصدار 7 من طابع زمني وبتات عشوائية."
  hi: "टाइमस्टैम्प और यादृच्छिक बिट्स से एक संस्करण 7 UUID डालें।"
  bn: "টাইমস্ট্যাম্প ও এলোমেলো বিট থেকে একটি সংস্করণ 7 UUID সন্নিবেশ করুন।"
  zh: "根据时间戳和随机位插入版本 7 的 UUID。"
  ja: "タイムスタンプとランダムビットからバージョン 7 の UUID を挿入します。"
menu.item.tools.insert.uuid.v8.help:
  en: "Insert a custom version 8 UUID placeholder."
  es: "Inserta un marcador de posición de UUID versión 8 personalizado."
  fr: "Insère un espace réservé d'UUID version 8 personnalisé."
  de: "Fügt einen benutzerdefinierten UUID-Platzhalter der Version 8 ein."
  cy: "Mewnosod deiliad lle UUID fersiwn 8 wedi'i addasu."
  ga: "Ionsáigh áitmharcóir UUID saincheaptha leagan 8."
  gd: "Cuir a-steach glacadair-àite UUID gnàthaichte tionndadh 8."
  pl: "Wstawia niestandardowy symbol zastępczy UUID w wersji 8."
  pt: "Insere um espaço reservado de UUID versão 8 personalizado."
  ru: "Вставляет пользовательский шаблон UUID версии 8."
  ar: "يُدرج عنصرًا نائبًا مخصّصًا لـ UUID من الإصدار 8."
  hi: "एक कस्टम संस्करण 8 UUID प्लेसहोल्डर डालें।"
  bn: "একটি কাস্টম সংস্করণ 8 UUID প্লেসহোল্ডার সন্নিবেশ করুন।"
  zh: "插入自定义的版本 8 UUID 占位符。"
  ja: "カスタムのバージョン 8 UUID プレースホルダーを挿入します。"
menu.item.tools.insert.zid.128.help:
  en: "Insert a 128-bit ZID as 32 hex digits."
  es: "Inserta un ZID de 128 bits como 32 dígitos hexadecimales."
  fr: "Insère un ZID de 128 bits sous forme de 32 chiffres hexadécimaux."
  de: "Fügt eine 128-Bit-ZID als 32 Hexadezimalziffern ein."
  cy: "Mewnosod ZID 128 did fel 32 digid hecs."
  ga: "Ionsáigh ZID 128 giotán mar 32 digit heicse."
  gd: "Cuir a-steach ZID 128-bit mar 32 figear heagsa."
  pl: "Wstawia 128-bitowy ZID jako 32 cyfry szesnastkowe."
  pt: "Insere um ZID de 128 bits como 32 dígitos hexadecimais."
  ru: "Вставляет 128-битный ZID в виде 32 шестнадцатеричных цифр."
  ar: "يُدرج ZID بحجم 128 بت في صورة 32 رقمًا ست عشريًا."
  hi: "128-बिट ZID को 32 हेक्स अंकों के रूप में डालें।"
  bn: "একটি 128-বিট ZID ৩২টি হেক্স অঙ্ক হিসেবে সন্নিবেশ করুন।"
  zh: "以 32 位十六进制数字插入 128 位 ZID。"
  ja: "128 ビットの ZID を 32 桁の 16 進数で挿入します。"
menu.item.tools.insert.zid.256.help:
  en: "Insert a 256-bit ZID as 64 hex digits."
