_version: 2

status.undo_branch_switched:
  en: "Switched undo branch (redo now follows the other branch)"
  es: "Rama de deshacer cambiada (rehacer ahora sigue la otra rama)"
  fr: "Branche d'annulation changée (rétablir suit désormais l'autre branche)"
  de: "Rückgängig-Zweig gewechselt (Wiederholen folgt jetzt dem anderen Zweig)"
  cy: "Cangen dadwneud wedi newid (mae ailwneud yn dilyn y gangen arall nawr)"
  ga: "Brainse cealaithe malartaithe (leanann athdhéanamh an brainse eile anois)"
  gd: "Meur neo-dhèanaidh air atharrachadh (leanaidh ath-dhèanamh am meur eile a-nis)"
  pl: "Zmieniono gałąź cofania (ponawianie podąża teraz za drugą gałęzią)"
  pt: "Ramo de desfazer alternado (refazer agora segue o outro ramo)"
  ru: "Ветка отмены переключена (повтор теперь следует по другой ветке)"
  ar: "تم تبديل فرع التراجع (الإعادة تتبع الآن الفرع الآخر)"
  hi: "पूर्ववत शाखा बदली गई (अब रीडू दूसरी शाखा का अनुसरण करेगा)"
  bn: "আনডু শাখা পরিবর্তিত হয়েছে (রিডু এখন অন্য শাখা অনুসরণ করবে)"
  zh: "已切换撤销分支（重做现在会沿着另一分支）"
  ja: "元に戻す分岐を切り替えました（やり直しは別の分岐に従います）"
status.undo_branch_none:
  en: "No alternate undo branch here"
  es: "No hay ninguna rama de deshacer alternativa aquí"
  fr: "Aucune branche d'annulation alternative ici"
  de: "Kein alternativer Rückgängig-Zweig hier"
  cy: "Dim cangen dadwneud arall yma"
  ga: "Níl aon bhrainse cealaithe eile anseo"
  gd: "Chan eil meur neo-dhèanaidh eile ann an seo"
  pl: "Brak alternatywnej gałęzi cofania w tym miejscu"
  pt: "Nenhum ramo de desfazer alternativo aqui"
  ru: "Здесь нет альтернативной ветки отмены"
  ar: "لا يوجد فرع تراجع بديل هنا"
  hi: "यहाँ कोई वैकल्पिक पूर्ववत शाखा नहीं है"
  bn: "এখানে কোনো বিকল্প আনডু শাখা নেই"
  zh: "此处没有其他撤销分支"
  ja: "ここには代わりの元に戻す分岐はありません"

