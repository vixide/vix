  fr: "Conflit de raccourci clavier sur « %{token} » : revendiqué par %{sources} — aucun appliqué"
  de: "Tastenkombinationskonflikt bei „%{token}“: beansprucht von %{sources} — keine angewendet"
  cy: "Gwrthdrawiad byrfyrdd ar '%{token}': hawliwyd gan %{sources} — ni chymhwyswyd yr un"
