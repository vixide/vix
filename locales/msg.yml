  hi: "'%{token}' पर कीबाइंडिंग विरोध: %{sources} द्वारा दावा किया गया — कोई भी लागू नहीं हुआ"
  bn: "'%{token}'-এ কীবাইন্ডিং সংঘর্ষ: %{sources} দ্বারা দাবি করা হয়েছে — কোনোটিই প্রয়োগ হয়নি"
