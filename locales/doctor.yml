doctor.no_color_note:
  en: "(NO_COLOR is set -- color deliberately disabled)"
  es: "(NO_COLOR está definido; el color se ha desactivado a propósito)"
  fr: "(NO_COLOR est défini ; la couleur a été désactivée volontairement)"
  de: "(NO_COLOR ist gesetzt -- Farbe wurde absichtlich deaktiviert)"
  cy: "(mae NO_COLOR wedi'i osod -- lliw wedi'i analluogi'n fwriadol)"
  ga: "(tá NO_COLOR socraithe -- dath díchumasaithe d'aon ghnó)"
  gd: "(tha NO_COLOR air a shuidheachadh -- chaidh dath a chur à comas a dh'aona-ghnothach)"
  pl: "(zmienna NO_COLOR jest ustawiona -- kolor został celowo wyłączony)"
  pt: "(NO_COLOR está definido; a cor foi desativada propositalmente)"
  ru: "(переменная NO_COLOR задана -- цвет намеренно отключён)"
  ar: "(تم تعيين NO_COLOR -- تم تعطيل الألوان عمدًا)"
  hi: "(NO_COLOR सेट है -- रंग जानबूझकर अक्षम किया गया)"
  bn: "(NO_COLOR সেট করা আছে -- রং ইচ্ছাকৃতভাবে নিষ্ক্রিয় করা হয়েছে)"
  zh: "（已设置 NO_COLOR——颜色已被有意禁用）"
  ja: "（NO_COLOR が設定されているため、意図的に色が無効になっています）"
