ui.workspace_trust_title:
  en: "Trust Workspace?"
  es: "¿Confiar en el espacio de trabajo?"
  fr: "Approuver l'espace de travail ?"
  de: "Arbeitsbereich vertrauen?"
  cy: "Ymddiried yn y Gweithle?"
  ga: "An gCuirfear Muinín sa Spás Oibre?"
  gd: "A bheil earbsa agad san rùm-obrach?"
  pl: "Zaufać obszarowi roboczemu?"
  pt: "Confiar no espaço de trabalho?"
  ru: "Доверять рабочей области?"
  ar: "هل تثق بمساحة العمل؟"
  hi: "क्या वर्कस्पेस पर भरोसा करें?"
  bn: "ওয়ার্কস্পেসে আস্থা রাখবেন?"
  zh: "信任工作区？"
  ja: "ワークスペースを信頼しますか？"
ui.workspace_trust_settings_message:
  en: "This workspace has a .vix/settings.toml that changes Vix's settings, including commands Vix runs, while it is open. Trust this workspace and apply it?"
  es: "Este espacio de trabajo tiene un .vix/settings.toml que cambia los ajustes de Vix, incluidos los comandos que ejecuta, mientras está abierto. ¿Confiar en este espacio de trabajo y aplicarlo?"
  fr: "Cet espace de travail contient un .vix/settings.toml qui modifie les paramètres de Vix, y compris les commandes qu'il exécute, tant qu'il est ouvert. Approuver cet espace de travail et l'appliquer ?"
  de: "Dieser Arbeitsbereich enthält eine .vix/settings.toml, die die Einstellungen von Vix ändert, einschließlich der Befehle, die Vix ausführt, solange er geöffnet ist. Diesem Arbeitsbereich vertrauen und sie anwenden?"
  cy: "Mae gan y gweithle hwn .vix/settings.toml sy'n newid gosodiadau Vix, gan gynnwys gorchmynion y mae Vix yn eu rhedeg, tra bydd ar agor. Ymddiried yn y gweithle hwn a'i gymhwyso?"
  ga: "Tá .vix/settings.toml ag an spás oibre seo a athraíonn socruithe Vix, na horduithe a ritheann Vix san áireamh, fad atá sé oscailte. Cuir muinín sa spás oibre seo agus cuir i bhfeidhm é?"
  gd: "Tha .vix/settings.toml aig an rùm-obrach seo a dh'atharraicheas roghainnean Vix, a' gabhail a-steach nan àitheantan a ruitheas Vix, fhad 's a tha e fosgailte. A bheil thu ag earbsa an rùim-obrach seo airson a chur an sàs?"
  pl: "Ten obszar roboczy zawiera plik .vix/settings.toml, który zmienia ustawienia Vix, w tym uruchamiane przez niego polecenia, gdy jest otwarty. Zaufać temu obszarowi roboczemu i go zastosować?"
  pt: "Este espaço de trabalho tem um .vix/settings.toml que altera as configurações do Vix, incluindo os comandos que executa, enquanto está aberto. Confiar neste espaço de trabalho e aplicá-lo?"
  ru: "В этой рабочей области есть .vix/settings.toml, который меняет настройки Vix, включая запускаемые им команды, пока она открыта. Доверять этой рабочей области и применить его?"
  ar: "تحتوي مساحة العمل هذه على ملف .vix/settings.toml يغيّر إعدادات Vix، بما فيها الأوامر التي يشغّلها، ما دامت مفتوحة. هل تثق بمساحة العمل هذه وتطبّقه؟"
  hi: "इस वर्कस्पेस में एक .vix/settings.toml है जो खुले रहने तक Vix की सेटिंग्स बदलता है, जिनमें Vix द्वारा चलाए जाने वाले कमांड भी शामिल हैं। क्या इस वर्कस्पेस पर भरोसा करें और इसे लागू करें?"
  bn: "এই ওয়ার্কস্পেসে একটি .vix/settings.toml আছে যা খোলা থাকাকালীন Vix-এর সেটিংস বদলায়, Vix যে কমান্ড চালায় সেগুলিসহ। এই ওয়ার্কস্পেসে আস্থা রেখে এটি প্রয়োগ করবেন?"
  zh: "此工作区有一个 .vix/settings.toml，在其打开期间会更改 Vix 的设置，包括 Vix 运行的命令。是否信任此工作区并应用它？"
  ja: "このワークスペースには .vix/settings.toml があり、開いている間 Vix の設定(Vix が実行するコマンドを含む)を変更します。このワークスペースを信頼して適用しますか？"
ui.workspace_trust_settings_also:
  en: "It also has a .vix/settings.toml that changes Vix's settings, applied once trusted."
  es: "También tiene un .vix/settings.toml que cambia los ajustes de Vix y se aplica al confiar."
  fr: "Il contient aussi un .vix/settings.toml qui modifie les paramètres de Vix, appliqué une fois approuvé."
  de: "Er enthält außerdem eine .vix/settings.toml, die die Einstellungen von Vix ändert und nach dem Vertrauen angewendet wird."
  cy: "Mae ganddo hefyd .vix/settings.toml sy'n newid gosodiadau Vix, a gymhwysir ar ôl ymddiried."
  ga: "Tá .vix/settings.toml aige freisin a athraíonn socruithe Vix, curtha i bhfeidhm nuair a chuirtear muinín ann."
  gd: "Tha .vix/settings.toml aige cuideachd a dh'atharraicheas roghainnean Vix, air a chur an sàs nuair a bhios earbsa ann."
  pl: "Zawiera też plik .vix/settings.toml zmieniający ustawienia Vix, stosowany po zaufaniu."
  pt: "Também tem um .vix/settings.toml que altera as configurações do Vix, aplicado depois de confiar."
  ru: "В ней также есть .vix/settings.toml, меняющий настройки Vix; он применяется после доверия."
  ar: "تحتوي أيضًا على ملف .vix/settings.toml يغيّر إعدادات Vix، ويُطبَّق بعد الثقة."
  hi: "इसमें एक .vix/settings.toml भी है जो Vix की सेटिंग्स बदलता है, भरोसा करने पर लागू होता है।"
  bn: "এতে একটি .vix/settings.toml-ও আছে যা Vix-এর সেটিংস বদলায়, আস্থা রাখলে প্রয়োগ হয়।"
  zh: "它还有一个更改 Vix 设置的 .vix/settings.toml，信任后应用。"
  ja: "Vix の設定を変更する .vix/settings.toml もあり、信頼すると適用されます。"
ui.script_trust_title:
  en: "Trust Workspace Scripts?"
  es: "¿Confiar en los scripts del espacio de trabajo?"
  fr: "Approuver les scripts de l'espace de travail ?"
  de: "Skripten des Arbeitsbereichs vertrauen?"
  cy: "Ymddiried Sgriptiau'r Gweithle?"
  ga: "An gCuirfear Muinín i Scripteanna an Spáis Oibre?"
  gd: "A bheil earbsa agad ann an sgriobtaichean an rùim-obrach?"
  pl: "Zaufać skryptom obszaru roboczego?"
  pt: "Confiar nos scripts do espaço de trabalho?"
  ru: "Доверять скриптам рабочей области?"
  ar: "هل تثق بنصوص مساحة العمل البرمجية؟"
  hi: "क्या वर्कस्पेस स्क्रिप्ट्स पर भरोसा करें?"
  bn: "ওয়ার্কস্পেস স্ক্রিপ্টে আস্থা রাখবেন?"
  zh: "信任工作区脚本？"
  ja: "ワークスペースのスクリプトを信頼しますか？"
ui.script_trust_message:
  en: "This workspace has %{count} script(s) under .vix/scripts/ that will run with read/write access to the active buffer (no file or network access otherwise). Trust this workspace and run them?"
  es: "Este espacio de trabajo tiene %{count} script(s) en .vix/scripts/ que se ejecutarán con acceso de lectura/escritura al búfer activo (sin acceso a archivos ni a la red en otro caso). ¿Confiar en este espacio de trabajo y ejecutarlos?"
  fr: "Cet espace de travail contient %{count} script(s) sous .vix/scripts/ qui s'exécuteront avec un accès en lecture/écriture au tampon actif (aucun accès aux fichiers ni au réseau autrement). Approuver cet espace de travail et les exécuter ?"
  de: "Dieser Arbeitsbereich enthält %{count} Skript(e) unter .vix/scripts/, die mit Lese-/Schreibzugriff auf den aktiven Puffer ausgeführt werden (sonst kein Datei- oder Netzwerkzugriff). Diesem Arbeitsbereich vertrauen und sie ausführen?"
  cy: "Mae gan y gweithle hwn %{count} sgript(iau) o dan .vix/scripts/ a fydd yn rhedeg gyda mynediad darllen/ysgrifennu i'r byffer gweithredol (dim mynediad ffeil na rhwydwaith fel arall). Ymddiried yn y gweithle hwn a'u rhedeg?"
  ga: "Tá %{count} script faoi .vix/scripts/ ag an spás oibre seo a rithfidh le rochtain léamh/scríobh ar an maolán gníomhach (gan rochtain ar chomhaid ná ar líonra ar shlí eile). Cuir muinín sa spás oibre seo agus rith iad?"
  gd: "Tha %{count} sgriobt fo .vix/scripts/ aig an rùm-obrach seo a ruitheas le ruigsinneachd leughadh/sgrìobhadh air a' bhufair ghnìomhach (gun ruigsinneachd air faidhlichean no lìonra a bharrachd). A bheil thu ag earbsa an rùim-obrach seo airson an ruith?"
  pl: "Ten obszar roboczy zawiera skrypty w .vix/scripts/ (liczba: %{count}), które zostaną uruchomione z dostępem do odczytu/zapisu aktywnego bufora (bez dostępu do plików ani sieci w innym przypadku). Zaufać temu obszarowi roboczemu i je uruchomić?"
  pt: "Este espaço de trabalho tem %{count} script(s) em .vix/scripts/ que serão executados com acesso de leitura/escrita ao buffer ativo (sem acesso a ficheiros ou à rede de outra forma). Confiar neste espaço de trabalho e executá-los?"
  ru: "В этой рабочей области есть скрипты в .vix/scripts/ (количество: %{count}), которые будут выполняться с доступом на чтение/запись к активному буферу (без доступа к файлам или сети в остальном). Доверять этой рабочей области и запустить их?"
  ar: "تحتوي مساحة العمل هذه على نصوص برمجية ضمن .vix/scripts/ (العدد: %{count}) ستُشغَّل بصلاحية القراءة/الكتابة على المخزن النشط (دون الوصول إلى الملفات أو الشبكة خلاف ذلك). هل تثق بمساحة العمل هذه وتشغّلها؟"
  hi: "इस वर्कस्पेस में .vix/scripts/ के अंतर्गत %{count} स्क्रिप्ट(एं) हैं जो सक्रिय बफ़र पर रीड/राइट एक्सेस के साथ चलेंगी (अन्यथा कोई फ़ाइल या नेटवर्क एक्सेस नहीं)। क्या इस वर्कस्पेस पर भरोसा करें और उन्हें चलाएँ?"
  bn: "এই ওয়ার্কস্পেসে .vix/scripts/ এর অধীনে %{count}টি স্ক্রিপ্ট আছে যা সক্রিয় বাফারে রিড/রাইট অ্যাক্সেস নিয়ে চলবে (অন্যথায় কোনো ফাইল বা নেটওয়ার্ক অ্যাক্সেস নেই)। এই ওয়ার্কস্পেসে আস্থা রেখে সেগুলি চালাবেন?"
  zh: "此工作区在 .vix/scripts/ 下有 %{count} 个脚本，它们将以对活动缓冲区的读/写权限运行(否则无文件或网络访问权限)。是否信任此工作区并运行它们？"
  ja: "このワークスペースには .vix/scripts/ 配下に %{count} 個のスクリプトがあり、アクティブなバッファへの読み書きアクセス権で実行されます(それ以外のファイルやネットワークへのアクセスはありません)。このワークスペースを信頼して実行しますか？"
