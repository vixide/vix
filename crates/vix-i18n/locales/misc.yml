confirm.git_discard:
  en: "Discard all unstaged changes to %{path}? This can't be undone."
  es: "¿Descartar todos los cambios no preparados de %{path}? No se puede deshacer."
  fr: "Abandonner toutes les modifications non indexées de %{path} ? C’est irréversible."
  de: "Alle nicht gestagten Änderungen an %{path} verwerfen? Das lässt sich nicht rückgängig machen."
  cy: "Taflu pob newid heb ei lwyfannu i %{path}? Ni ellir dadwneud hyn."
  ga: "Caith gach athrú gan stáitse ar %{path}? Ní féidir é seo a chealú."
  gd: "Tilg gach atharrachadh gun stèids air %{path}? Cha ghabh seo neo-dhèanamh."
  pl: "Odrzucić wszystkie niezaindeksowane zmiany w %{path}? Tego nie można cofnąć."
  pt: "Descartar todas as alterações não preparadas de %{path}? Não pode ser desfeito."
  ru: "Отменить все неиндексированные изменения в %{path}? Это нельзя отменить."
  ar: "تجاهل كل التغييرات غير المُجهَّزة على %{path}؟ لا يمكن التراجع."
  hi: "%{path} के सभी अनस्टेज्ड बदलाव त्यागें? इसे पूर्ववत नहीं किया जा सकता।"
  bn: "%{path}-এর সব আনস্টেজড পরিবর্তন বাতিল করবেন? এটি পূর্বাবস্থায় ফেরানো যাবে না।"
  zh: "丢弃 %{path} 的所有未暂存更改？此操作无法撤消。"
  ja: "%{path} のステージされていない変更をすべて破棄しますか？元に戻せません。"
confirm.cowork_share_terminal:
  en: "Share your terminal with %{n} guest(s)? They will see everything it shows from now on, including any password, token or key printed in it. They cannot type unless you allow input. (y/n)"
  es: "¿Compartir tu terminal con %{n} invitado(s)? Verán todo lo que muestre desde ahora, incluida cualquier contraseña, token o clave que aparezca. No pueden escribir salvo que permitas la entrada. (y/n)"
  fr: "Partager votre terminal avec %{n} invité(s) ? Ils verront tout ce qu'il affiche à partir de maintenant, y compris tout mot de passe, jeton ou clé qui y apparaît. Ils ne peuvent pas taper sauf si vous autorisez la saisie. (y/n)"
  de: "Terminal mit %{n} Gast/Gästen teilen? Sie sehen ab jetzt alles, was es anzeigt, auch jedes darin ausgegebene Passwort, Token oder jeden Schlüssel. Tippen können sie nur, wenn Sie die Eingabe erlauben. (y/n)"
  cy: "Rhannu eich terfynell gyda %{n} gwestai? Byddant yn gweld popeth y mae'n ei ddangos o hyn ymlaen, gan gynnwys unrhyw gyfrinair, tocyn neu allwedd a argraffir ynddi. Ni allant deipio oni bai eich bod yn caniatáu mewnbwn. (y/n)"
  ga: "Do theirminéal a chomhroinnt le %{n} aoi? Feicfidh siad gach a thaispeánann sé as seo amach, lena n-áirítear aon phasfhocal, chomhartha nó eochair a phriontáiltear ann. Ní féidir leo clóscríobh mura gceadaíonn tú ionchur. (y/n)"
  gd: "An tèirmineal agad a cho-roinneadh le %{n} aoigh? Chì iad gach nì a sheallas e o seo a-mach, a' gabhail a-steach facal-faire, tòcan no iuchair sam bith a nochdas ann. Chan urrainn dhaibh sgrìobhadh mura ceadaich thu ion-chur. (y/n)"
  pl: "Udostępnić terminal %{n} gościom? Od teraz zobaczą wszystko, co wyświetla, w tym każde wypisane w nim hasło, token lub klucz. Nie mogą pisać, dopóki nie zezwolisz na wpisywanie. (y/n)"
  pt: "Compartilhar seu terminal com %{n} convidado(s)? A partir de agora eles verão tudo o que ele exibir, incluindo qualquer senha, token ou chave impressa nele. Eles não podem digitar a menos que você permita a entrada. (y/n)"
  ru: "Открыть терминал гостям (%{n})? Отныне они увидят всё, что в нём выводится, включая любые пароли, токены или ключи. Печатать они не смогут, пока вы не разрешите ввод. (y/n)"
  ar: "مشاركة طرفيتك مع %{n} من الضيوف؟ سيرون كل ما تعرضه من الآن، بما في ذلك أي كلمة مرور أو رمز أو مفتاح يُطبع فيها. لا يمكنهم الكتابة ما لم تسمح بالإدخال. (y/n)"
  hi: "अपना टर्मिनल %{n} अतिथियों के साथ साझा करें? अब से वे इसमें दिखने वाला सब कुछ देखेंगे, इसमें छपा कोई भी पासवर्ड, टोकन या कुंजी भी। जब तक आप इनपुट की अनुमति न दें, वे टाइप नहीं कर सकते। (y/n)"
  bn: "আপনার টার্মিনাল %{n} জন অতিথির সঙ্গে শেয়ার করবেন? এখন থেকে এতে যা দেখায় সবই তাঁরা দেখবেন, এতে ছাপা যেকোনো পাসওয়ার্ড, টোকেন বা কী-সহ। আপনি ইনপুটের অনুমতি না দিলে তাঁরা টাইপ করতে পারবেন না। (y/n)"
  zh: "与 %{n} 位访客共享你的终端？从现在起，他们将看到终端中显示的一切，包括其中打印出的任何密码、令牌或密钥。除非你允许输入，否则他们无法键入。(y/n)"
  ja: "ターミナルを %{n} 人のゲストと共有しますか？今後表示される内容は、そこに出力されたパスワード、トークン、鍵も含めてすべて見えます。入力を許可しない限り、ゲストは入力できません。(y/n)"
confirm.cowork_terminal_input:
  en: "Let guests with terminal permission type in your terminal? They can run any command as you. (y/n)"
  es: "¿Permitir que los invitados con permiso de terminal escriban en tu terminal? Podrán ejecutar cualquier orden como tú. (y/n)"
  fr: "Autoriser les invités ayant le droit terminal à taper dans votre terminal ? Ils pourront exécuter n'importe quelle commande en votre nom. (y/n)"
  de: "Gästen mit Terminalberechtigung das Tippen in Ihrem Terminal erlauben? Sie können jeden Befehl als Sie ausführen. (y/n)"
  cy: "Gadael i westeion sydd â chaniatâd terfynell deipio yn eich terfynell? Gallant redeg unrhyw orchymyn fel chi. (y/n)"
  ga: "Ligean d'aíonna a bhfuil cead teirminéil acu clóscríobh i do theirminéal? Is féidir leo aon ordú a rith mar tusa. (y/n)"
  gd: "Leigeil le aoighean aig a bheil cead tèirmineil sgrìobhadh san tèirmineal agad? Is urrainn dhaibh àithne sam bith a ruith mar thusa. (y/n)"
  pl: "Pozwolić gościom z uprawnieniem terminala pisać w twoim terminalu? Mogą uruchomić dowolne polecenie jako ty. (y/n)"
  pt: "Permitir que convidados com permissão de terminal digitem no seu terminal? Eles podem executar qualquer comando como você. (y/n)"
  ru: "Разрешить гостям с правом на терминал печатать в вашем терминале? Они смогут выполнить любую команду от вашего имени. (y/n)"
  ar: "السماح للضيوف الذين لديهم إذن الطرفية بالكتابة في طرفيتك؟ يمكنهم تشغيل أي أمر باسمك. (y/n)"
  hi: "टर्मिनल अनुमति वाले अतिथियों को अपने टर्मिनल में टाइप करने दें? वे आपके रूप में कोई भी कमांड चला सकते हैं। (y/n)"
  bn: "টার্মিনাল অনুমতিপ্রাপ্ত অতিথিদের আপনার টার্মিনালে টাইপ করতে দেবেন? তাঁরা আপনার হয়ে যেকোনো কমান্ড চালাতে পারবেন। (y/n)"
  zh: "允许拥有终端权限的访客在你的终端中输入？他们可以以你的身份运行任何命令。(y/n)"
  ja: "ターミナル権限のあるゲストにターミナルへの入力を許可しますか？あなたとして任意のコマンドを実行できます。(y/n)"
confirm.remote_trust:
  en: "Trust %{name}? Only a trusted workspace runs its own code: tasks, run configurations, tests, the debugger, language servers and project tools. (y: trust, n: restricted mode)"
  es: "¿Confiar en %{name}? Solo un espacio de trabajo de confianza ejecuta su propio código: tareas, configuraciones de ejecución, pruebas, el depurador, servidores de lenguaje y herramientas del proyecto. (y: confiar, n: modo restringido)"
  fr: "Faire confiance à %{name} ? Seul un espace de travail approuvé exécute son propre code : tâches, configurations d'exécution, tests, débogueur, serveurs de langage et outils de projet. (y : approuver, n : mode restreint)"
  de: "%{name} vertrauen? Nur ein vertrauenswürdiger Arbeitsbereich führt eigenen Code aus: Aufgaben, Startkonfigurationen, Tests, Debugger, Sprachserver und Projektwerkzeuge. (y: vertrauen, n: eingeschränkter Modus)"
  cy: "Ymddiried yn %{name}? Dim ond gweithle dibynadwy sy'n rhedeg ei god ei hun: tasgau, ffurfweddau rhedeg, profion, y dadfygiwr, gweinyddion iaith ac offer prosiect. (y: ymddiried, n: modd cyfyngedig)"
  ga: "Muinín as %{name}? Ní ritheann ach spás oibre iontaofa a chód féin: tascanna, cumraíochtaí rite, tástálacha, an dífhabhtóir, freastalaithe teanga agus uirlisí tionscadail. (y: muinín, n: mód srianta)"
  gd: "Earbsa ann an %{name}? Cha ruith ach àite-obrach earbsach an còd aige fhèin: saothraichean, rèiteachaidhean ruith, deuchainnean, an dì-bhugaire, frithealaichean cànain is innealan pròiseict. (y: earbsa, n: modh cuingichte)"
  pl: "Zaufać %{name}? Tylko zaufany obszar roboczy uruchamia własny kod: zadania, konfiguracje uruchamiania, testy, debuger, serwery językowe i narzędzia projektu. (y: zaufaj, n: tryb ograniczony)"
  pt: "Confiar em %{name}? Só um espaço de trabalho confiável executa o próprio código: tarefas, configurações de execução, testes, o depurador, servidores de linguagem e ferramentas do projeto. (y: confiar, n: modo restrito)"
  ru: "Доверять %{name}? Только доверенное рабочее пространство запускает свой код: задачи, конфигурации запуска, тесты, отладчик, языковые серверы и инструменты проекта. (y: доверять, n: ограниченный режим)"
  ar: "هل تثق بـ %{name}؟ لا تشغّل شيفرتها الخاصة إلا مساحة عمل موثوقة: المهام وإعدادات التشغيل والاختبارات ومصحح الأخطاء وخوادم اللغة وأدوات المشروع. (y: ثقة، n: الوضع المقيّد)"
  hi: "%{name} पर भरोसा करें? केवल भरोसेमंद वर्कस्पेस अपना कोड चलाता है: कार्य, रन कॉन्फ़िगरेशन, टेस्ट, डीबगर, भाषा सर्वर और प्रोजेक्ट टूल। (y: भरोसा, n: प्रतिबंधित मोड)"
  bn: "%{name}-এ আস্থা রাখবেন? কেবল বিশ্বস্ত ওয়ার্কস্পেসই নিজের কোড চালায়: টাস্ক, রান কনফিগারেশন, টেস্ট, ডিবাগার, ভাষা সার্ভার ও প্রজেক্ট টুল। (y: আস্থা, n: সীমিত মোড)"
  zh: "信任 %{name}？只有受信任的工作区才会运行它自己的代码：任务、运行配置、测试、调试器、语言服务器和项目工具。(y: 信任，n: 受限模式)"
  ja: "%{name} を信頼しますか？信頼されたワークスペースだけが独自のコード（タスク、実行構成、テスト、デバッガー、言語サーバー、プロジェクトツール）を実行します。(y: 信頼、n: 制限モード)"
confirm.save_conflict:
  en: "%{path} changed on disk since you opened it. o: overwrite it, c: compare, n: cancel"
  es: "%{path} cambió en disco desde que lo abriste. o: sobrescribir, c: comparar, n: cancelar"
  fr: "%{path} a changé sur le disque depuis son ouverture. o : écraser, c : comparer, n : annuler"
  de: "%{path} wurde seit dem Öffnen auf der Festplatte geändert. o: überschreiben, c: vergleichen, n: abbrechen"
  cy: "Newidiodd %{path} ar y ddisg ers i chi ei agor. o: trosysgrifo, c: cymharu, n: canslo"
  ga: "Athraíodh %{path} ar an diosca ó d'oscail tú é. o: scríobh thairis, c: cuir i gcomparáid, n: cealaigh"
  gd: "Dh'atharraich %{path} air an diosg on a dh'fhosgail thu e. o: sgrìobh thairis air, c: dèan coimeas, n: sguir"
  pl: "%{path} zmienił się na dysku od otwarcia. o: nadpisz, c: porównaj, n: anuluj"
  pt: "%{path} mudou no disco desde que você o abriu. o: sobrescrever, c: comparar, n: cancelar"
  ru: "%{path} изменился на диске после открытия. o: перезаписать, c: сравнить, n: отмена"
  ar: "تغيّر %{path} على القرص منذ أن فتحته. o: الكتابة فوقه، c: المقارنة، n: إلغاء"
  hi: "खोलने के बाद %{path} डिस्क पर बदल गई। o: ओवरराइट करें, c: तुलना करें, n: रद्द करें"
  bn: "খোলার পরে %{path} ডিস্কে বদলেছে। o: ওভাররাইট করুন, c: তুলনা করুন, n: বাতিল"
  zh: "%{path} 在你打开后已在磁盘上更改。o：覆盖，c：比较，n：取消"
  ja: "%{path} は開いた後にディスク上で変更されました。o: 上書き、c: 比較、n: キャンセル"
confirm.open_large_viewer:
  en: "%{path} is %{mb} MB, too large to edit. View it read-only in the Large File Viewer?"
  es: "%{path} pesa %{mb} MB, demasiado para editarlo. ¿Verlo en solo lectura en el visor de archivos grandes?"
  fr: "%{path} fait %{mb} Mo, trop pour être modifié. L'afficher en lecture seule dans la visionneuse de gros fichiers ?"
  de: "%{path} ist %{mb} MB groß, zu groß zum Bearbeiten. Schreibgeschützt im Großdatei-Betrachter anzeigen?"
  cy: "Mae %{path} yn %{mb} MB, yn rhy fawr i'w golygu. Ei gweld fel darllen-yn-unig yn y Gwyliwr Ffeiliau Mawr?"
  ga: "Tá %{path} %{mb} MB, rómhór le cur in eagar. An bhfuil tú ag iarraidh féachaint air inléite amháin san Amharcán Comhad Mór?"
  gd: "Tha %{path} %{mb} MB, ro mhòr airson a dheasachadh. A bheil thu airson a shealltainn leughadh a-mhàin san Sealladair Fhaidhlichean Mòra?"
  pl: "Plik %{path} ma %{mb} MB, za dużo do edycji. Wyświetlić go tylko do odczytu w przeglądarce dużych plików?"
  pt: "%{path} tem %{mb} MB, grande demais para editar. Ver somente leitura no visualizador de arquivos grandes?"
  ru: "Файл %{path} занимает %{mb} МБ — слишком много для редактирования. Открыть его только для чтения в просмотрщике больших файлов?"
  ar: "حجم %{path} هو %{mb} ميغابايت، وهو أكبر من أن يُحرَّر. هل تريد عرضه للقراءة فقط في عارض الملفات الكبيرة؟"
  hi: "%{path} का आकार %{mb} MB है, संपादन के लिए बहुत बड़ा। इसे बड़ी फ़ाइल व्यूअर में केवल-पढ़ने के लिए देखें?"
  bn: "%{path} এর আকার %{mb} MB, সম্পাদনার জন্য অনেক বড়। বড় ফাইল ভিউয়ারে শুধু-পঠন হিসেবে দেখবেন?"
  zh: "%{path} 大小为 %{mb} MB，太大无法编辑。要在大文件查看器中以只读方式查看吗？"
  ja: "%{path} は %{mb} MB あり、編集するには大きすぎます。大きなファイルビューアで読み取り専用で表示しますか？"
