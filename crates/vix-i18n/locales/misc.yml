welcome.body:
  en: |
    Welcome to Vix!

    Vix is a simple, keyboard-friendly text editor and IDE that runs right in your terminal. It is fast, mouse-aware, and works the same on macOS, Linux, and Windows. This screen is here to help you get started — press Esc to close it at any time, and reopen it later from Help → Welcome.

    Getting started
    ───────────────
    • Open the menus with F10, or click a menu name. Arrow keys move, Enter runs, Esc backs out. Each menu has an Alt shortcut too (Alt+F for File).
    • Open a file with Ctrl+O, save with Ctrl+S, and close a tab with Ctrl+W.
    • Toggle the file explorer (left dock) with Ctrl+B, and switch focus between the explorer and the editor with Ctrl+E.
    • Press Ctrl+P for the Command Palette — a searchable list of every command. If you ever forget a shortcut, start there.
    • Press F1 for the full keyboard-shortcut reference.

    What Vix can do
    ───────────────
    • Edit code with syntax highlighting, soft wrap, undo/redo, and tabs.
    • Find and replace in the current file or across the whole workspace.
    • Browse and edit files in the explorer, with cut/copy/paste and multi-select.
    • Use Git: status and log, stage and commit, branches, pull/push/fetch, clone.
    • Pick characters and colors from the Tools menu: Nerd Font glyphs, ASCII, HTML entities, and X11 colors.
    • Turn on Language Server Protocol features (diagnostics, hover, go-to-definition, completion) by configuring a server for your language.
    • Choose a color theme, a language, and a keymap (Apple, VS Code, Emacs, or Vim) from the View menu — Vix adapts to how you like to work.

    Make it yours
    ─────────────
    Vix remembers your choices in a settings file, so the editor looks and behaves the way you set it up the next time you open it. Open it from Vix → Settings.

    Feedback is welcome
    ───────────────────
    Vix is open source and we would love to hear from you — bug reports, ideas, and questions are all appreciated.

    • Website: https://github.com/joelparkerhenderson/vix
    • Email: joel@joelparkerhenderson.com

    Happy editing!
  es: "¡Bienvenido a Vix!\n\nVix es un editor de texto e IDE sencillo y compatible con el teclado que se ejecuta directamente en tu terminal. Es rápido, compatible con el ratón y funciona igual en macOS, Linux y Windows. Esta pantalla está aquí para ayudarte a empezar — pulsa Esc para cerrarla en cualquier momento, y vuelve a abrirla más tarde desde Ayuda → Bienvenida.\n\nPrimeros pasos\n───────────────\n• Abre los menús con F10, o haz clic en el nombre de un menú. Las flechas mueven, Enter ejecuta, Esc retrocede. Cada menú también tiene un atajo Alt (Alt+F para Archivo).\n• Abre un archivo con Ctrl+O, guarda con Ctrl+S, y cierra una pestaña con Ctrl+W.\n• Alterna el explorador de archivos (panel izquierdo) con Ctrl+B, y cambia el foco entre el explorador y el editor con Ctrl+E.\n• Pulsa Ctrl+P para la Paleta de comandos — una lista buscable de todos los comandos. Si alguna vez olvidas un atajo, empieza ahí.\n• Pulsa F1 para la referencia completa de atajos de teclado.\n\nQué puede hacer Vix\n───────────────\n• Editar código con resaltado de sintaxis, ajuste de línea suave, deshacer/rehacer y pestañas.\n• Buscar y reemplazar en el archivo actual o en todo el espacio de trabajo.\n• Explorar y editar archivos en el explorador, con cortar/copiar/pegar y selección múltiple.\n• Usar Git: estado e historial, preparar y confirmar, ramas, pull/push/fetch, clonar.\n• Elegir caracteres y colores desde el menú Herramientas: glifos de Nerd Font, ASCII, entidades HTML y colores X11.\n• Activar funciones del protocolo de servidor de lenguaje (diagnósticos, información al pasar el cursor, ir a definición, autocompletado) configurando un servidor para tu lenguaje.\n• Elegir un tema de color, un lenguaje y un estilo de teclado (Apple, VS Code, Emacs o Vim) desde el menú Ver — Vix se adapta a tu forma de trabajar.\n\nHazlo tuyo\n─────────────\nVix recuerda tus elecciones en un archivo de configuración, así que el editor se ve y se comporta como lo configuraste la próxima vez que lo abras. Ábrelo desde Vix → Configuración.\n\nLos comentarios son bienvenidos\n───────────────────\nVix es de código abierto y nos encantaría saber de ti — se agradecen informes de errores, ideas y preguntas.\n\n• Sitio web: https://github.com/joelparkerhenderson/vix\n• Correo: joel@joelparkerhenderson.com\n\n¡Feliz edición!\n"
  fr: "Bienvenue dans Vix !\n\nVix est un éditeur de texte et IDE simple, adapté au clavier, qui s'exécute directement dans votre terminal. Il est rapide, compatible avec la souris, et fonctionne de la même façon sur macOS, Linux et Windows. Cet écran est là pour vous aider à démarrer — appuyez sur Échap pour le fermer à tout moment, et rouvrez-le plus tard depuis Aide → Bienvenue.\n\nPour commencer\n───────────────\n• Ouvrez les menus avec F10, ou cliquez sur un nom de menu. Les flèches déplacent, Entrée exécute, Échap recule. Chaque menu a aussi un raccourci Alt (Alt+F pour Fichier).\n• Ouvrez un fichier avec Ctrl+O, enregistrez avec Ctrl+S, et fermez un onglet avec Ctrl+W.\n• Basculez l'explorateur de fichiers (panneau gauche) avec Ctrl+B, et changez le focus entre l'explorateur et l'éditeur avec Ctrl+E.\n• Appuyez sur Ctrl+P pour la Palette de commandes — une liste consultable de toutes les commandes. Si vous oubliez un raccourci, commencez par là.\n• Appuyez sur F1 pour la référence complète des raccourcis clavier.\n\nCe que Vix peut faire\n───────────────\n• Éditer du code avec coloration syntaxique, retour à la ligne automatique, annuler/rétablir et onglets.\n• Rechercher et remplacer dans le fichier actuel ou dans tout l'espace de travail.\n• Parcourir et éditer des fichiers dans l'explorateur, avec couper/copier/coller et sélection multiple.\n• Utiliser Git : statut et journal, indexer et valider, branches, pull/push/fetch, cloner.\n• Choisir des caractères et des couleurs depuis le menu Outils : glyphes Nerd Font, ASCII, entités HTML et couleurs X11.\n• Activer les fonctionnalités du protocole de serveur de langage (diagnostics, survol, aller à la définition, complétion) en configurant un serveur pour votre langage.\n• Choisir un thème de couleur, un langage et un style de clavier (Apple, VS Code, Emacs ou Vim) depuis le menu Affichage — Vix s'adapte à votre façon de travailler.\n\nPersonnalisez-le\n─────────────\nVix se souvient de vos choix dans un fichier de configuration, afin que l'éditeur ait le même aspect et le même comportement la prochaine fois que vous l'ouvrirez. Ouvrez-le depuis Vix → Paramètres.\n\nVos retours sont les bienvenus\n───────────────────\nVix est open source et nous serions ravis d'avoir de vos nouvelles — rapports de bugs, idées et questions sont tous appréciés.\n\n• Site web : https://github.com/joelparkerhenderson/vix\n• E-mail : joel@joelparkerhenderson.com\n\nBonne édition !\n"
  de: "Willkommen bei Vix!\n\nVix ist ein einfacher, tastaturfreundlicher Texteditor und IDE, der direkt in deinem Terminal läuft. Er ist schnell, mausfähig und funktioniert auf macOS, Linux und Windows gleich. Dieser Bildschirm hilft dir beim Einstieg — drücke jederzeit Esc, um ihn zu schließen, und öffne ihn später erneut über Hilfe → Willkommen.\n\nErste Schritte\n───────────────\n• Öffne die Menüs mit F10 oder klicke auf einen Menünamen. Pfeiltasten bewegen, Eingabe führt aus, Esc geht zurück. Jedes Menü hat auch ein Alt-Kürzel (Alt+F für Datei).\n• Öffne eine Datei mit Strg+O, speichere mit Strg+S, und schließe einen Tab mit Strg+W.\n• Schalte den Datei-Explorer (linkes Dock) mit Strg+B um und wechsle den Fokus zwischen Explorer und Editor mit Strg+E.\n• Drücke Strg+P für die Befehlspalette — eine durchsuchbare Liste aller Befehle. Wenn du ein Kürzel vergisst, fang dort an.\n• Drücke F1 für die vollständige Tastenkombinationsreferenz.\n\nWas Vix kann\n───────────────\n• Code mit Syntaxhervorhebung, weichem Zeilenumbruch, Rückgängig/Wiederholen und Tabs bearbeiten.\n• In der aktuellen Datei oder im gesamten Arbeitsbereich suchen und ersetzen.\n• Dateien im Explorer durchsuchen und bearbeiten, mit Ausschneiden/Kopieren/Einfügen und Mehrfachauswahl.\n• Git verwenden: Status und Verlauf, Stagen und Committen, Branches, Pull/Push/Fetch, Klonen.\n• Zeichen und Farben aus dem Werkzeuge-Menü wählen: Nerd-Font-Glyphen, ASCII, HTML-Entitäten und X11-Farben.\n• Language-Server-Protocol-Funktionen (Diagnosen, Hover, Sprung zur Definition, Vervollständigung) durch Konfiguration eines Servers für deine Sprache aktivieren.\n• Ein Farbthema, eine Sprache und einen Tastenstil (Apple, VS Code, Emacs oder Vim) im Menü Ansicht wählen — Vix passt sich deiner Arbeitsweise an.\n\nMach ihn zu deinem\n─────────────\nVix merkt sich deine Auswahl in einer Einstellungsdatei, sodass der Editor beim nächsten Öffnen so aussieht und sich so verhält, wie du ihn eingerichtet hast. Öffne sie über Vix → Einstellungen.\n\nFeedback ist willkommen\n───────────────────\nVix ist Open Source und wir würden gerne von dir hören — Fehlerberichte, Ideen und Fragen sind alle willkommen.\n\n• Website: https://github.com/joelparkerhenderson/vix\n• E-Mail: joel@joelparkerhenderson.com\n\nViel Spaß beim Bearbeiten!\n"
  cy: "Croeso i Vix!\n\nMae Vix yn olygydd testun a IDE syml, cyfeillgar i'r bysellfwrdd sy'n rhedeg yn syth yn eich terfynell. Mae'n gyflym, yn ymwybodol o'r llygoden, ac yn gweithio'r un fath ar macOS, Linux, a Windows. Mae'r sgrin hon yma i'ch helpu i ddechrau — pwyswch Esc i'w chau ar unrhyw adeg, ac ail-agor hi'n ddiweddarach o Cymorth → Croeso.\n\nDechrau arni\n───────────────\n• Agorwch y dewislenni gyda F10, neu cliciwch ar enw dewislen. Mae'r bysellau saeth yn symud, Enter yn rhedeg, Esc yn mynd yn ôl. Mae gan bob dewislen lwybr byr Alt hefyd (Alt+F ar gyfer Ffeil).\n• Agorwch ffeil gyda Ctrl+O, cadwch gyda Ctrl+S, a chaewch dab gyda Ctrl+W.\n• Toglwch y archwiliwr ffeiliau (doc chwith) gyda Ctrl+B, a newidiwch ffocws rhwng yr archwiliwr a'r golygydd gyda Ctrl+E.\n• Pwyswch Ctrl+P am y Palet Gorchmynion — rhestr chwiliadwy o bob gorchymyn. Os ydych chi byth yn anghofio llwybr byr, dechreuwch yno.\n• Pwyswch F1 am y cyfeirlyfr llwybrau byr bysellfwrdd llawn.\n\nBeth all Vix ei wneud\n───────────────\n• Golygu cod gydag amlygu cystrawen, lapio meddal, dadwneud/ailwneud, a thabiau.\n• Chwilio a chyfnewid yn y ffeil gyfredol neu ar draws y gweithle cyfan.\n• Pori a golygu ffeiliau yn yr archwiliwr, gyda thorri/copïo/gludo a dewis lluosog.\n• Defnyddio Git: statws a log, llwyfannu a chyflwyno, canghennau, pull/push/fetch, clonio.\n• Dewis nodau a lliwiau o'r ddewislen Offer: glyffau Nerd Font, ASCII, endidau HTML, a lliwiau X11.\n• Troi ymlaen nodweddion Protocol Gweinydd Iaith (diagnosteg, hofran, mynd-i-ddiffiniad, cwblhau) trwy ffurfweddu gweinydd ar gyfer eich iaith.\n• Dewis thema lliw, iaith, a dull bysell (Apple, VS Code, Emacs, neu Vim) o'r ddewislen Golwg — mae Vix yn addasu i'r ffordd rydych chi'n hoffi gweithio.\n\nGwnewch e'n eiddo i chi\n─────────────\nMae Vix yn cofio'ch dewisiadau mewn ffeil gosodiadau, felly mae'r golygydd yn edrych ac yn ymddwyn fel y gwnaethoch chi ei osod y tro nesaf y byddwch chi'n ei agor. Agorwch hi o Vix → Gosodiadau.\n\nMae adborth yn cael ei groesawu\n───────────────────\nMae Vix yn ffynhonnell agored a byddem wrth ein bodd yn clywed gennych chi — mae adroddiadau namau, syniadau, a chwestiynau i gyd yn cael eu gwerthfawrogi.\n\n• Gwefan: https://github.com/joelparkerhenderson/vix\n• E-bost: joel@joelparkerhenderson.com\n\nGolygu hapus!\n"
  ga: "Fáilte go Vix!\n\nIs eagarthóir téacs simplí, cairdiúil don mhéarchlár agus IDE é Vix a ritheann díreach i do theirminéal. Tá sé tapa, feasach ar an luch, agus oibríonn sé mar an gcéanna ar macOS, Linux, agus Windows. Tá an scáileán seo ann chun cabhrú leat tosú — brúigh Esc chun é a dhúnadh am ar bith, agus oscail arís é ó Cabhair → Fáilte.\n\nAg tosú amach\n───────────────\n• Oscail na roghchláir le F10, nó cliceáil ainm roghchláir. Bogann na saigheada, ritheann Enter, téann Esc siar. Tá aicearra Alt ag gach roghchlár freisin (Alt+F le haghaidh Comhad).\n• Oscail comhad le Ctrl+O, sábháil le Ctrl+S, agus dún cluaisín le Ctrl+W.\n• Scoránaigh an taiscéalaí comhad (duga chlé) le Ctrl+B, agus athraigh fócas idir an taiscéalaí agus an t-eagarthóir le Ctrl+E.\n• Brúigh Ctrl+P don Phailéad Orduithe — liosta inchuardaithe de gach ordú. Má dhéanann tú dearmad ar aicearra riamh, tosaigh ansin.\n• Brúigh F1 don tagairt iomlán aicearraí méarchláir.\n\nCad is féidir le Vix a dhéanamh\n───────────────\n• Cód a chur in eagar le haibhsiú comhréire, timfhilleadh bog, cealú/athdhéanamh, agus cluaisíní.\n• Cuardach agus athsholáthar sa chomhad reatha nó ar fud an spáis oibre ar fad.\n• Comhaid a bhrabhsáil agus a chur in eagar sa taiscéalaí, le gearradh/cóipeáil/greamú agus il-roghnú.\n• Git a úsáid: stádas agus loga, céimniú agus tiomantas, brainsí, pull/push/fetch, clónáil.\n• Carachtair agus dathanna a roghnú ón roghchlár Uirlisí: glífeanna Nerd Font, ASCII, aonáin HTML, agus dathanna X11.\n• Gnéithe Phrótacal an Fhreastalaí Teanga (diagnóisic, ainliú, téigh-go-sainmhíniú, comhlánú) a chur ar siúl trí fhreastalaí a chumrú do do theanga.\n• Téama datha, teanga, agus stíl eochrach (Apple, VS Code, Emacs, nó Vim) a roghnú ón roghchlár Amharc — oiriúnaíonn Vix don chaoi ar mhaith leat oibriú.\n\nDéan do chuid féin de\n─────────────\nCuimhníonn Vix ar do roghanna i gcomhad socruithe, mar sin breathnaíonn agus iompraíonn an t-eagarthóir mar a shocraigh tú é an chéad uair eile a osclaíonn tú é. Oscail é ó Vix → Socruithe.\n\nCuirtear fáilte roimh aiseolas\n───────────────────\nIs foinse oscailte é Vix agus ba bhreá linn cloisteáil uait — cuirtear fáilte roimh thuairiscí fabht, smaointe, agus ceisteanna go léir.\n\n• Suíomh Gréasáin: https://github.com/joelparkerhenderson/vix\n• Ríomhphost: joel@joelparkerhenderson.com\n\nEagarthóireacht shona!\n"
  gd: "Fàilte gu Vix!\n\n'S e deasaiche teacsa is IDE sìmplidh, càirdeil don mheur-chlàr a th' ann an Vix a ruitheas dìreach na do theirminell. Tha e luath, mothachail air an luchag, agus ag obair an aon dòigh air macOS, Linux, agus Windows. Tha an sgrìn seo an-seo gus do chuideachadh gus tòiseachadh — brùth Esc gus a dùnadh uair sam bith, agus fosgail a-rithist às dèidh sin o Cobhair → Fàilte.\n\nA' tòiseachadh\n───────────────\n• Fosgail na clàran-taice le F10, no cliog air ainm clàir-thaice. Gluaisidh na saigheadan, ruithidh Enter, thèid Esc air ais. Tha ath-ghoirid Alt aig gach clàr-taice cuideachd (Alt+F airson Faidhle).\n• Fosgail faidhle le Ctrl+O, sàbhail le Ctrl+S, agus dùin taba le Ctrl+W.\n• Toglaich am brabhsair fhaidhlichean (docadh clì) le Ctrl+B, agus atharraich fòcas eadar am brabhsair agus an deasaiche le Ctrl+E.\n• Brùth Ctrl+P airson am Pailead Àithne — liosta a ghabhas a lorg de gach àithne. Mura cuimhnich thu ath-ghoirid, tòisich an-sin.\n• Brùth F1 airson làn-iomradh ath-ghoiridean a' mheur-chlàir.\n\nDè as urrainn do Vix a dhèanamh\n───────────────\n• Deasaich còd le soillseachadh co-chàraidh, pasgadh bog, neo-dhèanamh/ath-dhèanamh, agus tabaichean.\n• Lorg agus cuir an àite san fhaidhle làithreach no air feadh na h-àite-obrach gu lèir.\n• Brabhsaich agus deasaich faidhlichean sa bhrabhsair, le gearradh/lethbhreac/cur-a-steach agus taghadh ioma-fhillte.\n• Cleachd Git: staid is loga, cuir air ard-ùrlar is dèan gealltanas, meuran, pull/push/fetch, clòn.\n• Tagh caractaran is dathan bhon chlàr-taice Innealan: samhlaidhean Nerd Font, ASCII, aonadan HTML, agus dathan X11.\n• Cuir gnèithean Protocol an Fhrithealaiche Cànain (diagnaisean, fantainn, rach-gu-mìneachadh, coileanadh) air le bhith a' rèiteachadh frithealaiche airson do chànan.\n• Tagh ùrlar datha, cànan, agus dòigh-iuchrach (Apple, VS Code, Emacs, no Vim) bhon chlàr-taice Sealladh — nì Vix freagarrachadh ris an dòigh sam bu toil leat obrachadh.\n\nDèan agad fhèin e\n─────────────\nCuimhnichidh Vix do roghainnean ann am faidhle roghainnean, mar sin bidh coltas is giùlan an deasaiche mar a shuidhich thu e an ath-thuras a dh'fhosglas tu e. Fosgail e o Vix → Roghainnean.\n\nTha fàilte air fios air ais\n───────────────────\n'S e stòr fosgailte a th' ann an Vix agus bu toil leinn cluinntinn bhuat — tha fàilte air aithisgean bugaichean, beachdan, agus ceistean.\n\n• Làrach-lìn: https://github.com/joelparkerhenderson/vix\n• Post-d: joel@joelparkerhenderson.com\n\nDeasachadh sona!\n"
  pl: "Witamy w Vix!\n\nVix to prosty, przyjazny dla klawiatury edytor tekstu i IDE działający bezpośrednio w terminalu. Jest szybki, obsługuje mysz i działa tak samo na macOS, Linuksie i Windows. Ten ekran ma pomóc Ci zacząć — naciśnij Esc, aby go zamknąć w dowolnym momencie, i otwórz go ponownie później z menu Pomoc → Powitanie.\n\nPierwsze kroki\n───────────────\n• Otwórz menu za pomocą F10 lub kliknij nazwę menu. Strzałki przesuwają, Enter uruchamia, Esc cofa. Każde menu ma też skrót Alt (Alt+F dla Pliku).\n• Otwórz plik za pomocą Ctrl+O, zapisz za pomocą Ctrl+S, i zamknij kartę za pomocą Ctrl+W.\n• Przełącz eksplorator plików (lewy dok) za pomocą Ctrl+B, i przełącz fokus między eksploratorem a edytorem za pomocą Ctrl+E.\n• Naciśnij Ctrl+P, aby otworzyć Paletę poleceń — przeszukiwalną listę wszystkich poleceń. Jeśli kiedykolwiek zapomnisz skrótu, zacznij tam.\n• Naciśnij F1, aby zobaczyć pełne odniesienie do skrótów klawiszowych.\n\nCo potrafi Vix\n───────────────\n• Edytować kod z podświetlaniem składni, miękkim zawijaniem wierszy, cofaniem/ponawianiem i kartami.\n• Wyszukiwać i zamieniać w bieżącym pliku lub w całym obszarze roboczym.\n• Przeglądać i edytować pliki w eksploratorze, z wycinaniem/kopiowaniem/wklejaniem i zaznaczaniem wielokrotnym.\n• Korzystać z Gita: status i dziennik, zatwierdzanie i commity, gałęzie, pull/push/fetch, klonowanie.\n• Wybierać znaki i kolory z menu Narzędzia: glify Nerd Font, ASCII, encje HTML i kolory X11.\n• Włączyć funkcje protokołu Language Server Protocol (diagnostyka, podpowiedzi po najechaniu, przejście do definicji, uzupełnianie), konfigurując serwer dla swojego języka.\n• Wybrać motyw kolorystyczny, język i styl klawiszy (Apple, VS Code, Emacs lub Vim) z menu Widok — Vix dostosowuje się do Twojego stylu pracy.\n\nDostosuj go do siebie\n─────────────\nVix zapamiętuje Twoje wybory w pliku ustawień, więc edytor wygląda i zachowuje się tak, jak go skonfigurowałeś przy następnym otwarciu. Otwórz go z Vix → Ustawienia.\n\nOpinie są mile widziane\n───────────────────\nVix jest oprogramowaniem open source i chętnie usłyszymy od Ciebie — raporty o błędach, pomysły i pytania są mile widziane.\n\n• Strona internetowa: https://github.com/joelparkerhenderson/vix\n• E-mail: joel@joelparkerhenderson.com\n\nMiłej edycji!\n"
  pt: "Bem-vindo ao Vix!\n\nO Vix é um editor de texto e IDE simples e amigo do teclado que é executado diretamente no seu terminal. É rápido, compatível com o rato, e funciona da mesma forma em macOS, Linux e Windows. Este ecrã está aqui para o ajudar a começar — prima Esc para o fechar a qualquer momento, e reabra-o mais tarde a partir de Ajuda → Boas-vindas.\n\nPrimeiros passos\n───────────────\n• Abra os menus com F10, ou clique num nome de menu. As setas movem, Enter executa, Esc retrocede. Cada menu também tem um atalho Alt (Alt+F para Ficheiro).\n• Abra um ficheiro com Ctrl+O, guarde com Ctrl+S, e feche um separador com Ctrl+W.\n• Alterne o explorador de ficheiros (doca esquerda) com Ctrl+B, e mude o foco entre o explorador e o editor com Ctrl+E.\n• Prima Ctrl+P para a Paleta de comandos — uma lista pesquisável de todos os comandos. Se alguma vez se esquecer de um atalho, comece aí.\n• Prima F1 para a referência completa de atalhos de teclado.\n\nO que o Vix pode fazer\n───────────────\n• Editar código com destaque de sintaxe, quebra de linha suave, desfazer/refazer e separadores.\n• Localizar e substituir no ficheiro atual ou em todo o espaço de trabalho.\n• Navegar e editar ficheiros no explorador, com cortar/copiar/colar e seleção múltipla.\n• Usar o Git: estado e histórico, preparar e submeter, ramos, pull/push/fetch, clonar.\n• Escolher caracteres e cores no menu Ferramentas: glifos Nerd Font, ASCII, entidades HTML e cores X11.\n• Ativar funcionalidades do Language Server Protocol (diagnósticos, pré-visualização, ir para a definição, conclusão) configurando um servidor para a sua linguagem.\n• Escolher um tema de cor, uma linguagem e um estilo de teclas (Apple, VS Code, Emacs ou Vim) no menu Ver — o Vix adapta-se à forma como gosta de trabalhar.\n\nTorne-o seu\n─────────────\nO Vix lembra-se das suas escolhas num ficheiro de configurações, para que o editor tenha o mesmo aspeto e comportamento da próxima vez que o abrir. Abra-o a partir de Vix → Configurações.\n\nOs comentários são bem-vindos\n───────────────────\nO Vix é de código aberto e adoraríamos ouvi-lo — relatórios de erros, ideias e perguntas são todos apreciados.\n\n• Website: https://github.com/joelparkerhenderson/vix\n• E-mail: joel@joelparkerhenderson.com\n\nBoa edição!\n"
  ru: "Добро пожаловать в Vix!\n\nVix — это простой, удобный для клавиатуры текстовый редактор и IDE, работающий прямо в вашем терминале. Он быстрый, поддерживает мышь и работает одинаково на macOS, Linux и Windows. Этот экран поможет вам начать — нажмите Esc, чтобы закрыть его в любой момент, и откройте снова позже из Справка → Приветствие.\n\nНачало работы\n───────────────\n• Откройте меню клавишей F10 или щёлкните по имени меню. Стрелки перемещают, Enter выполняет, Esc возвращает назад. У каждого меню есть также сочетание Alt (Alt+F для Файла).\n• Откройте файл сочетанием Ctrl+O, сохраните сочетанием Ctrl+S, и закройте вкладку сочетанием Ctrl+W.\n• Переключите проводник файлов (левая панель) сочетанием Ctrl+B, и переключайте фокус между проводником и редактором сочетанием Ctrl+E.\n• Нажмите Ctrl+P для Палитры команд — списка всех команд с поиском. Если вы забыли сочетание клавиш, начните оттуда.\n• Нажмите F1 для полного справочника сочетаний клавиш.\n\nЧто умеет Vix\n───────────────\n• Редактировать код с подсветкой синтаксиса, мягким переносом строк, отменой/повтором и вкладками.\n• Искать и заменять в текущем файле или во всей рабочей области.\n• Просматривать и редактировать файлы в проводнике с вырезанием/копированием/вставкой и множественным выбором.\n• Использовать Git: статус и журнал, индексирование и коммиты, ветки, pull/push/fetch, клонирование.\n• Выбирать символы и цвета в меню Инструменты: глифы Nerd Font, ASCII, HTML-сущности и цвета X11.\n• Включить функции Language Server Protocol (диагностика, всплывающие подсказки, переход к определению, автодополнение), настроив сервер для вашего языка.\n• Выбрать цветовую тему, язык и раскладку (Apple, VS Code, Emacs или Vim) в меню Вид — Vix подстраивается под ваш стиль работы.\n\nСделайте его своим\n─────────────\nVix запоминает ваш выбор в файле настроек, поэтому редактор будет выглядеть и вести себя так, как вы его настроили, при следующем открытии. Откройте его из Vix → Настройки.\n\nОбратная связь приветствуется\n───────────────────\nVix — проект с открытым исходным кодом, и мы будем рады услышать от вас — отчёты об ошибках, идеи и вопросы приветствуются.\n\n• Сайт: https://github.com/joelparkerhenderson/vix\n• Эл. почта: joel@joelparkerhenderson.com\n\nПриятного редактирования!\n"
  ar: "مرحباً بك في Vix!\n\nVix هو محرر نصوص وبيئة تطوير متكاملة (IDE) بسيطة وصديقة للوحة المفاتيح تعمل مباشرة داخل الطرفية الخاصة بك. إنه سريع، يدعم الفأرة، ويعمل بنفس الطريقة على macOS وLinux وWindows. هذه الشاشة هنا لمساعدتك على البدء — اضغط Esc لإغلاقها في أي وقت، وأعد فتحها لاحقاً من المساعدة ← الترحيب.\n\nالبدء\n───────────────\n• افتح القوائم بالضغط على F10، أو انقر على اسم قائمة. أسهم الاتجاه تنقل، Enter يُنفّذ، Esc يرجع للخلف. لكل قائمة اختصار Alt أيضاً (Alt+F للملف).\n• افتح ملفاً بـ Ctrl+O، احفظ بـ Ctrl+S، وأغلق تبويباً بـ Ctrl+W.\n• بدّل مستكشف الملفات (اللوحة اليسرى) بـ Ctrl+B، وبدّل التركيز بين المستكشف والمحرر بـ Ctrl+E.\n• اضغط Ctrl+P للوصول إلى لوحة الأوامر — قائمة قابلة للبحث بجميع الأوامر. إذا نسيت اختصاراً، ابدأ من هناك.\n• اضغط F1 للمرجع الكامل لاختصارات لوحة المفاتيح.\n\nما يمكن لـ Vix فعله\n───────────────\n• تحرير الكود مع تمييز الصيغة، والالتفاف الناعم للأسطر، والتراجع/الإعادة، والتبويبات.\n• البحث والاستبدال في الملف الحالي أو عبر مساحة العمل بأكملها.\n• تصفح وتحرير الملفات في المستكشف، مع القص/النسخ/اللصق والتحديد المتعدد.\n• استخدام Git: الحالة والسجل، التهيئة والالتزام، الفروع، pull/push/fetch، الاستنساخ.\n• اختيار الأحرف والألوان من قائمة الأدوات: رموز Nerd Font وASCII وكيانات HTML وألوان X11.\n• تفعيل ميزات بروتوكول خادم اللغة (التشخيصات، التحويم، الانتقال إلى التعريف، الإكمال) بتهيئة خادم للغتك.\n• اختيار سمة لونية ولغة ونمط مفاتيح (Apple أو VS Code أو Emacs أو Vim) من قائمة العرض — يتكيف Vix مع طريقة عملك المفضلة.\n\nاجعله خاصاً بك\n─────────────\nيتذكر Vix اختياراتك في ملف إعدادات، لذا يبدو المحرر ويتصرف بالطريقة التي أعددته بها في المرة القادمة التي تفتحه فيها. افتحه من Vix ← الإعدادات.\n\nنرحب بملاحظاتك\n───────────────────\nVix مفتوح المصدر ويسعدنا سماع رأيك — تقارير الأخطاء والأفكار والأسئلة كلها موضع تقدير.\n\n• الموقع الإلكتروني: https://github.com/joelparkerhenderson/vix\n• البريد الإلكتروني: joel@joelparkerhenderson.com\n\nتحرير سعيد!\n"
  hi: "Vix में आपका स्वागत है!\n\nVix एक सरल, कीबोर्ड-अनुकूल टेक्स्ट एडिटर और IDE है जो सीधे आपके टर्मिनल में चलता है। यह तेज़ है, माउस-अनुकूल है, और macOS, Linux, और Windows पर समान रूप से काम करता है। यह स्क्रीन आपको शुरुआत करने में मदद के लिए है — इसे किसी भी समय बंद करने के लिए Esc दबाएं, और बाद में इसे सहायता → स्वागत से फिर से खोलें।\n\nशुरुआत करना\n───────────────\n• F10 से मेनू खोलें, या किसी मेनू नाम पर क्लिक करें। तीर कुंजियाँ ले जाती हैं, Enter चलाता है, Esc वापस जाता है। हर मेनू में एक Alt शॉर्टकट भी होता है (फ़ाइल के लिए Alt+F)।\n• Ctrl+O से फ़ाइल खोलें, Ctrl+S से सहेजें, और Ctrl+W से टैब बंद करें।\n• Ctrl+B से फ़ाइल एक्सप्लोरर (बायां डॉक) टॉगल करें, और Ctrl+E से एक्सप्लोरर और एडिटर के बीच फ़ोकस बदलें।\n• कमांड पैलेट के लिए Ctrl+P दबाएं — हर कमांड की एक खोजी जा सकने वाली सूची। यदि आप कभी कोई शॉर्टकट भूल जाएं, तो वहां से शुरू करें।\n• पूर्ण कीबोर्ड-शॉर्टकट संदर्भ के लिए F1 दबाएं।\n\nVix क्या कर सकता है\n───────────────\n• सिंटैक्स हाइलाइटिंग, सॉफ्ट रैप, अंडू/रीडू, और टैब के साथ कोड संपादित करें।\n• वर्तमान फ़ाइल में या पूरे वर्कस्पेस में खोजें और बदलें।\n• एक्सप्लोरर में फ़ाइलें ब्राउज़ और संपादित करें, कट/कॉपी/पेस्ट और मल्टी-सिलेक्ट के साथ।\n• Git का उपयोग करें: स्थिति और लॉग, स्टेज और कमिट, शाखाएं, pull/push/fetch, क्लोन।\n• टूल्स मेनू से वर्ण और रंग चुनें: Nerd Font ग्लिफ़, ASCII, HTML एंटिटी, और X11 रंग।\n• अपनी भाषा के लिए एक सर्वर कॉन्फ़िगर करके Language Server Protocol सुविधाएं (डायग्नोस्टिक्स, होवर, गो-टू-डेफिनिशन, कम्प्लीशन) चालू करें।\n• व्यू मेनू से एक रंग थीम, एक भाषा, और एक कीमैप (Apple, VS Code, Emacs, या Vim) चुनें — Vix आपके काम करने के तरीके के अनुसार ढल जाता है।\n\nइसे अपना बनाएं\n─────────────\nVix आपकी पसंद को एक सेटिंग्स फ़ाइल में याद रखता है, इसलिए अगली बार जब आप इसे खोलते हैं तो एडिटर वैसा ही दिखता और व्यवहार करता है जैसा आपने इसे सेट किया था। इसे Vix → सेटिंग्स से खोलें।\n\nप्रतिक्रिया का स्वागत है\n───────────────────\nVix ओपन सोर्स है और हमें आपसे सुनना अच्छा लगेगा — बग रिपोर्ट, विचार, और प्रश्न सभी की सराहना की जाती है।\n\n• वेबसाइट: https://github.com/joelparkerhenderson/vix\n• ईमेल: joel@joelparkerhenderson.com\n\nशुभ संपादन!\n"
  bn: "Vix-এ স্বাগতম!\n\nVix হলো একটি সহজ, কীবোর্ড-বান্ধব টেক্সট এডিটর এবং IDE যা সরাসরি আপনার টার্মিনালে চলে। এটি দ্রুত, মাউস-সচেতন, এবং macOS, Linux, এবং Windows-এ একইভাবে কাজ করে। এই স্ক্রিনটি আপনাকে শুরু করতে সাহায্য করার জন্য এখানে আছে — এটি যেকোনো সময় বন্ধ করতে Esc চাপুন, এবং পরে সহায়তা → স্বাগতম থেকে এটি আবার খুলুন।\n\nশুরু করা\n───────────────\n• F10 দিয়ে মেনু খুলুন, অথবা একটি মেনু নামে ক্লিক করুন। তীর কী নড়াচড়া করে, Enter চালায়, Esc পিছনে যায়। প্রতিটি মেনুতে একটি Alt শর্টকাটও আছে (ফাইলের জন্য Alt+F)।\n• Ctrl+O দিয়ে একটি ফাইল খুলুন, Ctrl+S দিয়ে সংরক্ষণ করুন, এবং Ctrl+W দিয়ে একটি ট্যাব বন্ধ করুন।\n• Ctrl+B দিয়ে ফাইল এক্সপ্লোরার (বাম ডক) টগল করুন, এবং Ctrl+E দিয়ে এক্সপ্লোরার ও এডিটরের মধ্যে ফোকাস পরিবর্তন করুন।\n• কমান্ড প্যালেটের জন্য Ctrl+P চাপুন — প্রতিটি কমান্ডের একটি অনুসন্ধানযোগ্য তালিকা। যদি আপনি কখনো একটি শর্টকাট ভুলে যান, সেখান থেকে শুরু করুন।\n• সম্পূর্ণ কীবোর্ড-শর্টকাট রেফারেন্সের জন্য F1 চাপুন।\n\nVix কী করতে পারে\n───────────────\n• সিনট্যাক্স হাইলাইটিং, সফট র‍্যাপ, আনডু/রিডু, এবং ট্যাব সহ কোড সম্পাদনা করুন।\n• বর্তমান ফাইলে বা পুরো ওয়ার্কস্পেস জুড়ে খুঁজুন এবং প্রতিস্থাপন করুন।\n• এক্সপ্লোরারে ফাইল ব্রাউজ ও সম্পাদনা করুন, কাট/কপি/পেস্ট ও মাল্টি-সিলেক্ট সহ।\n• Git ব্যবহার করুন: স্ট্যাটাস এবং লগ, স্টেজ এবং কমিট, শাখা, pull/push/fetch, ক্লোন।\n• টুলস মেনু থেকে অক্ষর এবং রঙ বেছে নিন: Nerd Font গ্লিফ, ASCII, HTML এনটিটি, এবং X11 রঙ।\n• আপনার ভাষার জন্য একটি সার্ভার কনফিগার করে Language Server Protocol বৈশিষ্ট্য (ডায়াগনস্টিকস, হোভার, গো-টু-ডেফিনিশন, কমপ্লিশন) চালু করুন।\n• ভিউ মেনু থেকে একটি রঙের থিম, একটি ভাষা, এবং একটি কীওয়ে (Apple, VS Code, Emacs, বা Vim) বেছে নিন — Vix আপনার কাজ করার পছন্দের ধরনের সাথে খাপ খাইয়ে নেয়।\n\nএটিকে নিজের করে তুলুন\n─────────────\nVix একটি সেটিংস ফাইলে আপনার পছন্দগুলি মনে রাখে, তাই পরবর্তী বার আপনি এটি খুললে এডিটরটি যেভাবে আপনি সেট করেছিলেন সেভাবেই দেখায় এবং আচরণ করে। Vix → সেটিংস থেকে এটি খুলুন।\n\nমতামত স্বাগত\n───────────────────\nVix ওপেন সোর্স এবং আমরা আপনার কাছ থেকে শুনতে চাই — বাগ রিপোর্ট, ধারণা, এবং প্রশ্ন সবই মূল্যবান।\n\n• ওয়েবসাইট: https://github.com/joelparkerhenderson/vix\n• ইমেইল: joel@joelparkerhenderson.com\n\nসুখী সম্পাদনা!\n"
  zh: "欢迎使用 Vix!\n\nVix 是一个简单、对键盘友好的文本编辑器和 IDE,可直接在你的终端中运行。它速度快,支持鼠标,并且在 macOS、Linux 和 Windows 上表现一致。此屏幕旨在帮助你入门 — 随时按 Esc 关闭它,以后可从 帮助 → 欢迎 重新打开。\n\n入门指南\n───────────────\n• 按 F10 打开菜单,或点击菜单名称。方向键移动,Enter 运行,Esc 返回。每个菜单还有一个 Alt 快捷键(文件对应 Alt+F)。\n• 用 Ctrl+O 打开文件,用 Ctrl+S 保存,用 Ctrl+W 关闭标签页。\n• 用 Ctrl+B 切换文件资源管理器(左侧停靠面板),用 Ctrl+E 在资源管理器和编辑器之间切换焦点。\n• 按 Ctrl+P 打开命令面板 — 一个可搜索的所有命令列表。如果你忘记了某个快捷键,从那里开始。\n• 按 F1 查看完整的键盘快捷键参考。\n\nVix 能做什么\n───────────────\n• 使用语法高亮、自动软换行、撤销/重做和标签页编辑代码。\n• 在当前文件或整个工作区中查找和替换。\n• 在资源管理器中浏览和编辑文件,支持剪切/复制/粘贴和多选。\n• 使用 Git:状态和日志、暂存和提交、分支、pull/push/fetch、克隆。\n• 从工具菜单中选择字符和颜色:Nerd Font 字形、ASCII、HTML 实体和 X11 颜色。\n• 通过为你的语言配置服务器来启用语言服务器协议功能(诊断、悬停、跳转到定义、补全)。\n• 从视图菜单中选择配色主题、语言和按键方式(Apple、VS Code、Emacs 或 Vim) — Vix 会适应你喜欢的工作方式。\n\n让它成为你的\n─────────────\nVix 会将你的选择记住在设置文件中,因此下次打开编辑器时,它的外观和行为会和你设置的一样。从 Vix → 设置 打开它。\n\n欢迎反馈\n───────────────────\nVix 是开源的,我们很乐意听到你的声音 — 欢迎提交错误报告、想法和问题。\n\n• 网站:https://github.com/joelparkerhenderson/vix\n• 邮箱:joel@joelparkerhenderson.com\n\n编辑愉快!\n"
  ja: "Vixへようこそ!\n\nVixは、ターミナル内で直接動作するシンプルでキーボード操作に適したテキストエディタ兼IDEです。高速で、マウス操作にも対応しており、macOS、Linux、Windowsで同じように動作します。この画面はあなたが使い始めるのを助けるためのものです — いつでもEscで閉じることができ、後でヘルプ→ようこそから再度開けます。\n\nはじめに\n───────────────\n• F10でメニューを開くか、メニュー名をクリックします。矢印キーで移動し、Enterで実行し、Escで戻ります。各メニューにはAltショートカットもあります(ファイルはAlt+F)。\n• Ctrl+Oでファイルを開き、Ctrl+Sで保存し、Ctrl+Wでタブを閉じます。\n• Ctrl+Bでファイルエクスプローラー(左ドック)を切り替え、Ctrl+Eでエクスプローラーとエディタ間のフォーカスを切り替えます。\n• Ctrl+Pでコマンドパレットを開きます — 検索可能な全コマンドの一覧です。ショートカットを忘れたら、まずここから始めましょう。\n• F1で完全なキーボードショートカット一覧を表示します。\n\nVixでできること\n───────────────\n• シンタックスハイライト、ソフトラップ、元に戻す/やり直し、タブでコードを編集する。\n• 現在のファイル内、またはワークスペース全体で検索と置換を行う。\n• エクスプローラーでファイルを閲覧・編集し、切り取り/コピー/貼り付けと複数選択が可能。\n• Gitを使う:ステータスとログ、ステージとコミット、ブランチ、pull/push/fetch、クローン。\n• ツールメニューから文字や色を選択する:Nerd Fontグリフ、ASCII、HTMLエンティティ、X11カラー。\n• 言語用のサーバーを設定して、Language Server Protocol機能(診断、ホバー、定義へ移動、補完)を有効にする。\n• 表示メニューからカラーテーマ、言語、キー操作スタイル(Apple、VS Code、Emacs、Vim)を選ぶ — Vixはあなたの作業スタイルに適応します。\n\n自分好みにする\n─────────────\nVixは設定ファイルにあなたの選択を記憶するため、次回開いたときもエディタは設定した通りの見た目と動作になります。Vix→設定から開いてください。\n\nフィードバック歓迎\n───────────────────\nVixはオープンソースであり、皆さんからのご意見をお待ちしています — バグ報告、アイデア、質問すべてを歓迎します。\n\n• ウェブサイト:https://github.com/joelparkerhenderson/vix\n• メール:joel@joelparkerhenderson.com\n\n楽しい編集を!\n"
