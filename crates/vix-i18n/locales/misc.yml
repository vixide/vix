confirm.devcontainer_up:
  en: "Build and start the dev container from %{file}? This runs the project's Dockerfile, features and lifecycle commands on this machine, then opens the workspace inside it as trusted. (y: build, n: cancel)"
  es: "¿Construir e iniciar el contenedor de desarrollo de %{file}? Esto ejecuta en esta máquina el Dockerfile, las features y los comandos de ciclo de vida del proyecto y luego abre dentro el espacio de trabajo como de confianza. (y: construir, n: cancelar)"
  fr: "Construire et démarrer le conteneur de développement de %{file} ? Cela exécute sur cette machine le Dockerfile, les features et les commandes de cycle de vie du projet, puis y ouvre l'espace de travail comme fiable. (y : construire, n : annuler)"
  de: "Den Dev-Container aus %{file} bauen und starten? Das führt Dockerfile, Features und Lifecycle-Befehle des Projekts auf diesem Rechner aus und öffnet dann den Arbeitsbereich darin als vertrauenswürdig. (y: bauen, n: abbrechen)"
  cy: "Adeiladu a chychwyn y cynhwysydd datblygu o %{file}? Mae hyn yn rhedeg Dockerfile, nodweddion a gorchmynion cylch bywyd y prosiect ar y peiriant hwn, yna'n agor y gweithle ynddo fel un dibynadwy. (y: adeiladu, n: canslo)"
  ga: "An coimeádán forbartha ó %{file} a thógáil agus a thosú? Ritheann sé seo Dockerfile, gnéithe agus orduithe saolré an tionscadail ar an meaisín seo, ansin osclaíonn sé an spás oibre ann mar spás iontaofa. (y: tóg, n: cealaigh)"
  gd: "An togail 's an tòisich thu an soitheach leasachaidh o %{file}? Ruithidh seo Dockerfile, feartan is àitheantan cuairt-beatha a' phròiseict air an inneal seo, an uairsin fosglaidh e an t-àite-obrach ann mar fhear earbsach. (y: tog, n: sguir dheth)"
  pl: "Zbudować i uruchomić kontener deweloperski z %{file}? Uruchomi to na tym komputerze Dockerfile, funkcje i polecenia cyklu życia projektu, a następnie otworzy w nim obszar roboczy jako zaufany. (y: zbuduj, n: anuluj)"
  pt: "Construir e iniciar o contêiner de desenvolvimento de %{file}? Isto executa nesta máquina o Dockerfile, as features e os comandos de ciclo de vida do projeto e depois abre nele o espaço de trabalho como confiável. (y: construir, n: cancelar)"
  ru: "Собрать и запустить контейнер разработки из %{file}? Это выполнит на этой машине Dockerfile, компоненты и команды жизненного цикла проекта, а затем откроет в нём рабочую область как доверенную. (y: собрать, n: отмена)"
  ar: "هل تريد بناء حاوية التطوير من %{file} وتشغيلها؟ سيشغّل هذا ملف Dockerfile والميزات وأوامر دورة الحياة الخاصة بالمشروع على هذا الجهاز، ثم يفتح مساحة العمل داخلها كمساحة موثوقة. (y: بناء، n: إلغاء)"
  hi: "%{file} से डेव कंटेनर बनाएँ और शुरू करें? यह इस मशीन पर प्रोजेक्ट का Dockerfile, फ़ीचर और लाइफ़साइकल कमांड चलाता है, फिर उसके अंदर वर्कस्पेस को भरोसेमंद के रूप में खोलता है। (y: बनाएँ, n: रद्द करें)"
  bn: "%{file} থেকে ডেভ কন্টেইনার তৈরি ও চালু করবেন? এটি এই মেশিনে প্রজেক্টের Dockerfile, ফিচার ও লাইফসাইকেল কমান্ড চালায়, তারপর তার ভিতরে ওয়ার্কস্পেসটি বিশ্বস্ত হিসেবে খোলে। (y: তৈরি, n: বাতিল)"
  zh: "要用 %{file} 构建并启动开发容器吗？这会在本机运行项目的 Dockerfile、功能和生命周期命令，然后在其中以受信任方式打开工作区。（y：构建，n：取消）"
  ja: "%{file} から開発コンテナをビルドして起動しますか？ このマシンでプロジェクトの Dockerfile、フィーチャー、ライフサイクルコマンドを実行し、その中のワークスペースを信頼済みとして開きます。（y: ビルド、n: キャンセル）"
confirm.jupyter_block:
  en: "Run this %{language} block in a Jupyter kernel? It runs as you. (y: run, n: cancel)  %{code}"
  es: "¿Ejecutar este bloque %{language} en un kernel de Jupyter? Se ejecuta con tu usuario. (y: ejecutar, n: cancelar)  %{code}"
  fr: "Exécuter ce bloc %{language} dans un noyau Jupyter ? Il s'exécute avec vos droits. (y : exécuter, n : annuler)  %{code}"
  de: "Diesen %{language}-Block in einem Jupyter-Kernel ausführen? Er läuft mit Ihren Rechten. (y: ausführen, n: abbrechen)  %{code}"
  cy: "Rhedeg y bloc %{language} hwn mewn cnewyllyn Jupyter? Mae'n rhedeg fel chi. (y: rhedeg, n: canslo)  %{code}"
  ga: "An bloc %{language} seo a rith in eithne Jupyter? Ritheann sé mar tusa. (y: rith, n: cealaigh)  %{code}"
  gd: "A bheil thu airson am bloca %{language} seo a ruith ann an eitean Jupyter? Ruithidh e mar thusa. (y: ruith, n: sguir)  %{code}"
  pl: "Uruchomić ten blok %{language} w jądrze Jupyter? Działa z twoimi uprawnieniami. (y: uruchom, n: anuluj)  %{code}"
  pt: "Executar este bloco %{language} num kernel Jupyter? Corre como você. (y: executar, n: cancelar)  %{code}"
  ru: "Выполнить этот блок %{language} в ядре Jupyter? Он выполняется от вашего имени. (y: выполнить, n: отмена)  %{code}"
  ar: "تشغيل كتلة %{language} هذه في نواة Jupyter؟ تعمل بصلاحياتك. (y: تشغيل، n: إلغاء)  %{code}"
  hi: "यह %{language} ब्लॉक Jupyter कर्नेल में चलाएँ? यह आपके रूप में चलता है। (y: चलाएँ, n: रद्द)  %{code}"
  bn: "এই %{language} ব্লকটি Jupyter কার্নেলে চালাবেন? এটি আপনার হয়ে চলে। (y: চালান, n: বাতিল)  %{code}"
  zh: "在 Jupyter 内核中运行此 %{language} 代码块？它以你的身份运行。（y：运行，n：取消）  %{code}"
  ja: "この %{language} ブロックを Jupyter カーネルで実行しますか？ あなたの権限で動きます。（y: 実行、n: キャンセル）  %{code}"
