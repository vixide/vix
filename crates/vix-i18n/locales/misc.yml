  hi: "# स्क्रैच बफर — जब तक आप सहेजें के रूप में का उपयोग नहीं करते, यह डिस्क पर सहेजा नहीं जाता।"
  bn: "# স্ক্র্যাচ বাফার — আপনি সংরক্ষণ করুন এভাবে ব্যবহার না করলে এটি ডিস্কে সংরক্ষিত হয় না।"
