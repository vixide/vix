confirm.open_large:
  en: "%{path} is %{mb} MB. Open it anyway?"
  es: "%{path} pesa %{mb} MB. ¿Abrirlo de todos modos?"
  fr: "%{path} fait %{mb} Mo. L'ouvrir quand même ?"
  de: "%{path} ist %{mb} MB groß. Trotzdem öffnen?"
  cy: "Mae %{path} yn %{mb} MB. Ei agor beth bynnag?"
  ga: "Tá %{path} %{mb} MB. An bhfuil tú ag iarraidh é a oscailt ar aon nós?"
  gd: "Tha %{path} %{mb} MB. A bheil thu airson fhosgladh co-dhiù?"
  pl: "Plik %{path} ma %{mb} MB. Otworzyć mimo to?"
  pt: "%{path} tem %{mb} MB. Abrir mesmo assim?"
