[package]
name = "vix-undo-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistent undo: save a buffer's undo tree to disk and restore it on reopen."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
vix-editor-core = { path = "../vix-editor-core", version = "3.0.0", default-features = false }
vix-fileops = { workspace = true }
vix-settings = { workspace = true }

# Tests never read or write the real ~/.config/vix (crates/vix-fileops user_dirs).
[dev-dependencies]
vix-fileops = { workspace = true, features = ["isolated-user-dirs"] }

[lints]
workspace = true
