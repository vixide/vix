[package]
name = "vix-authority"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The authority slot: one trait that owns Vix's workspace file access and process spawning, with local, SSH and container implementations and a temp-dir-backed fake."

[features]
# Build `Command`s for `Authority::command`. Off, no authority can start a
# process (the call returns `Unsupported`), so the minimal build stays
# spawn-free (T595); every crate's own `process` feature and the root `tasks`
# feature turn it on.
process = []
# The shell-based SSH authority (T712), `ssh::SshAuthority`. It runs `ssh`
# for every operation, so it needs `process`. The URL parsing and quoting in
# `ssh` are always built.
ssh = ["process", "dep:sha2"]

[dependencies]
ignore = { workspace = true }
vix-fileops = { workspace = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true

# False positive: ShellAuthority has one inherent `new` per transport, and the
# lint pairs them up wrongly across versions. Both are unchanged since 2.0.0.
[package.metadata.cargo-semver-checks.lints]
inherent_method_must_use_added = "allow"
