[package]
name = "vix-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Editor host: the `CodeEditor` widget wrapper and the pane tree."

[features]
default = ["image"]
# Inline image tabs (a terminal-graphics protocol per tab). Without it `Tab::image`
# is an uninhabited stand-in and `Tab::is_image` is always false.
image = ["dep:ratatui-image"]

[dependencies]
bitflags = { workspace = true }
ratatui = { workspace = true }
ratatui-core = { workspace = true }
ratatui-image = { workspace = true, optional = true }
ropey = { workspace = true }
vix-editor-core = { path = "../vix-editor-core", version = "2.0.1", default-features = false }
vix-encoding = { workspace = true }
vix-authority = { workspace = true }
vix-fileops = { workspace = true }
vix-textops = { workspace = true }
vix-theme = { workspace = true }

[lints]
workspace = true
