[package]
name = "vix-format-tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reformat the selection (or buffer) within one data format: pretty-print or minify."

[features]
default = ["process"]
# Spawn the user's Prettier (`prettier::format`). Off, no process is ever
# started; the root `tasks` feature turns it on.
process = ["vix-authority/process"]

[dependencies]
serde_json = { workspace = true }
vix-authority = { workspace = true }
serde_norway = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
