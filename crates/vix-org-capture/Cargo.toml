[package]
name = "vix-org-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Org-capture: template-driven capture with placeholders and targets."

[dependencies]
vix-settings = { workspace = true }

[dev-dependencies]
# Tests never read or write the real ~/.config/vix (crates/vix-fileops user_dirs).
vix-fileops = { workspace = true, features = ["isolated-user-dirs"] }
proptest = { workspace = true }

[lints]
workspace = true
