[package]
name = "vix-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DB workbench: connection management, schema browsing, and SQL queries."

[dependencies]
vix-settings = { workspace = true }
confy = { workspace = true }
crossterm = { workspace = true }
futures-util = { workspace = true }
percent-encoding = { workspace = true }
ratatui = { workspace = true }
rust-i18n = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
vix-clipboard = { workspace = true }
vix-fileops = { workspace = true }
vix-i18n = { workspace = true }
vix-list-state = { workspace = true }
vix-theme = { workspace = true }

# macOS and Windows: store DB passwords through the native credential store
# (Security framework / Credential Manager, T548) rather than shelling out to
# a CLI that exposes the plaintext password as a process argument (visible in
# `ps`/Task Manager). Scoped to these two targets so Linux doesn't pull in the
# backend; Linux keeps the already-secure `secret-tool` CLI (secret on stdin).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = { workspace = true }

# `t!` expands to `rust_i18n` paths that machete cannot see.
[package.metadata.cargo-machete]
ignored = ["rust-i18n"]

[lints]
workspace = true
