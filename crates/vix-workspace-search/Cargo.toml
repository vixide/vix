[package]
name = "vix-workspace-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Search (and replace) across every file under the workspace root, not just the active buffer."

[dependencies]
bitflags = { workspace = true }
regex = { workspace = true }
rust-i18n = { workspace = true }
vix-find-panel = { workspace = true }
vix-i18n = { workspace = true }

# `t!` expands to `rust_i18n` paths that machete cannot see.
[package.metadata.cargo-machete]
ignored = ["rust-i18n"]
