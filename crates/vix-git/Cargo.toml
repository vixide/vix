[package]
name = "vix-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Git integration: status/diff/staging via the git CLI."

[features]
default = ["process"]
# The runners that spawn the `git` CLI. Off, the crate is only its data types
# and parsers (no process is ever started); the root `git` feature turns it on.
process = []

[dependencies]
similar = { workspace = true }
vix-civil-date = { workspace = true }
vix-list-state = { workspace = true }

[lints]
workspace = true
