[package]
name = "vix-fileops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Filesystem helpers for the explorer's copy / cut / paste / delete."

[features]
# Swap the user's real configuration and data directories for a per-process
# directory under the system temporary directory (see `user_dirs`). Only
# dev-dependencies enable it, so tests can never rewrite the real `~/.config/vix`.
isolated-user-dirs = []

[dependencies]
confy = { workspace = true }
etcetera = { workspace = true }
globset = { workspace = true }
serde = { workspace = true }
vix-encoding = { workspace = true }

# macOS and Windows trash through the `trash` crate. Linux and the BSDs use
# Vix's own freedesktop.org trash (`src/freedesktop_trash.rs`), which writes the
# spec's `DeletionDate` with `jiff` instead of the crate's `chrono`.
[target.'cfg(not(all(unix, not(target_os = "macos"), not(target_os = "ios"), not(target_os = "android"))))'.dependencies]
trash = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "ios"), not(target_os = "android")))'.dependencies]
jiff = { workspace = true }
nix = { workspace = true, features = ["user"] }

# The freedesktop trash's tests also run on macOS.
[target.'cfg(unix)'.dev-dependencies]
jiff = { workspace = true }
nix = { workspace = true, features = ["user"] }

[lints]
workspace = true
