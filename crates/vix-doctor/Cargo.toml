[package]
name = "vix-doctor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Environment checks for vix --doctor: git on PATH, configured LSP servers spawnable, the active locale's spellcheck dictionary loadable, terminal color support"

[features]
default = ["probe-git", "probe-lsp"]
# Each probe starts the program it checks (`git`, each configured LSP server).
probe-git = []
probe-lsp = []

[dependencies]
rust-i18n = { workspace = true }
vix-i18n = { workspace = true }
vix-settings = { workspace = true }
vix-spellcheck = { path = "../vix-spellcheck", version = "2.0.0", default-features = false }

# `t!` expands to `rust_i18n` paths that machete cannot see.
[package.metadata.cargo-machete]
ignored = ["rust-i18n"]

[lints]
workspace = true
