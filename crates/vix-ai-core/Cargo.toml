[package]
name = "vix-ai-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Direct HTTP clients for AI providers (Anthropic, OpenAI-compatible, Ollama) plus keyring-backed API-key resolution."

[dependencies]
serde_json = { workspace = true }
# "json" enables `Request::send_json`/`Response::into_json` (not on by
# default in ureq 2.x); scoped to this crate rather than the shared
# workspace entry since `vix-http-client` sends/reads plain text, not JSON.
ureq = { workspace = true, features = ["json"] }

# macOS and Windows: store the API key through the native credential store
# (Security framework / Credential Manager, T548) rather than shelling out to
# a CLI that exposes the plaintext as a process argument. Linux instead uses
# the already-secure `secret-tool` CLI (secret on stdin) — see
# `crates/vix-db/src/secret.rs` for the sibling implementation this mirrors.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = { workspace = true }
