[package]
name = "vix-dap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Debug Adapter Protocol (DAP) client: drive a debug adapter over stdio."

[features]
default = ["process"]
# Spawn debug-adapter processes. Off, no adapter is ever started.
process = ["dep:vix-authority", "vix-authority/process"]

[dependencies]
vix-settings = { workspace = true }
serde_json = { workspace = true }
bitflags = { workspace = true }
vix-authority = { workspace = true, optional = true }
vix-lsp-core = { workspace = true }

# Tests never read or write the real ~/.config/vix (crates/vix-fileops user_dirs).
[dev-dependencies]
vix-fileops = { workspace = true, features = ["isolated-user-dirs"] }

[lints]
workspace = true
