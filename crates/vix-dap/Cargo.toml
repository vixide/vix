[package]
name = "vix-dap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Debug Adapter Protocol (DAP) client: drive a debug adapter over stdio."

[features]
default = ["process"]
# Spawn debug-adapter processes. Off, no adapter is ever started.
process = []

[dependencies]
vix-settings = { path = "../vix-settings", version = "1.7.0" }
serde = { workspace = true }
serde_json = { workspace = true }
vix-lsp-core = { path = "../vix-lsp-core", version = "1.7.0" }
