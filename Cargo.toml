# A virtual workspace: the terminal UI (`tui/`, package `vix-tui`, command
# `vix`) and the `crates/vix-*` members share one lockfile and target
# directory. `default-members` keeps a bare `cargo build`/`run`/`test` at the
# root acting on the TUI, as before the split. The desktop GUIs (`gui/`) and
# the fuzz targets (`fuzz/`) are separate workspaces.
[workspace]
resolver = "3"
members = ["crates/*", "tui"]
default-members = ["tui"]
# The demo workspace's own toy Rust project (T501, tasks.md) is fixture
# content — a project a tutorial opens *inside* Vix, not a crate Vix itself
# builds — so it's excluded rather than swept in by a workspace glob or left
# to error as an orphaned nested manifest.
exclude = ["tui/examples/demo-workspace/rust-app"]

# Metadata shared by the `vix-tui` package and every `crates/vix-*` member, so
# version/edition/license/etc. are declared once and inherited with
# `field.workspace = true`.
[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR BSD-3-Clause OR MIT OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/vixide/vix"
homepage = "https://github.com/vixide/vix"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]

# All external dependencies are declared here once; every member crate (and the
# `vix-tui` package) inherits them with `{ workspace = true }` so versions and
# feature sets stay in lock-step across the workspace.
[workspace.dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
bitflags = "2"
ignore = "0.4"
trash = "5"
walkdir = "2"
ureq = "3"
regex = "1"
# macOS and Windows: store secrets (DB passwords, T124's AI provider API
# keys) through the native credential store (Security framework / Credential
# Manager, T548) rather than shelling out to a CLI that exposes the plaintext
# as a process argument. Linux instead uses the already-secure `secret-tool`
# CLI (secret on stdin), so this dependency is scoped per-crate to
# `cfg(any(target_os = "macos", windows))` rather than pulled in everywhere.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
# Display-only: just the decoders `is_image_path` accepts. Default features would
# also compile an AV1 encoder (rav1e/ravif), exr, dds and rayon (T583).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
confy = "2.0.0"
clap = { version = "4.6.7", features = ["derive"] }
rust-i18n = "4.2.4"
base64 = "0.23"
# Held at 11.x deliberately: evalexpr 12.0.0 relicensed from MIT to
# AGPL-3.0-only, which is incompatible with the license Vix offers. Do not
# bump without replacing the calculator's evaluator — `cargo deny` fails on it.
evalexpr = "11"
getrandom = "0.2"
htmd = "0.5"
jiff = "0.2"
percent-encoding = "2"
pulldown-cmark = "0.13"
sha2 = "0.11"
similar = { version = "3", features = ["inline"] }
spellbook = "0.4"
sysinfo = "0.39"
toml = "1.1"
md-5 = "0.11"
crc32fast = "1"
uuid = { version = "1", features = ["v1", "v3", "v4", "v5", "v6", "v7", "v8"] }
include_dir = "0.7.4"
serde_norway = "0.9"
markdown = "1.0.0"
nix = { version = "0.31", features = ["signal"] }
qrcode = { version = "0.14", default-features = false }
# 0.9 is the floor: 0.8 pulled the unmaintained `serial` crate
# (RUSTSEC-2017-0008); 0.9 uses `serial2` instead.
portable-pty = "0.9"
vt100 = "0.15"
anyhow = "1.0"
arboard = { version = "3.6", default-features = false }
rhai = "1.26"
ratatui-core = "0.1"
ropey = "1.6"
rust-embed = { version = "8.12", features = ["include-exclude"] }
streaming-iterator = "0.1"
tree-sitter = "0.27"
unicode-segmentation = "1.13"
unicode-width = "0.2"
tree-sitter-bash = { version = "0.25.1" }
tree-sitter-c = { version = "0.24.2" }
tree-sitter-c-sharp = { version = "0.23.5" }
tree-sitter-cpp = { version = "0.23.4" }
tree-sitter-css = { version = "0.25" }
tree-sitter-go = { version = "0.25" }
tree-sitter-html = { version = "0.23.2" }
tree-sitter-java = { version = "0.23.5" }
tree-sitter-javascript = { version = "0.25" }
tree-sitter-json = { version = "0.24.8" }
tree-sitter-md = { version = "0.5.3" }
tree-sitter-python = { version = "0.25" }
tree-sitter-rust = { version = "0.24" }
tree-sitter-toml-ng = { version = "0.7.0" }
tree-sitter-typescript = { version = "0.23" }
tree-sitter-yaml = { version = "0.7" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "any", "sqlite", "postgres", "mysql"] }
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false }
mimalloc = "0.1"
# Property-based ("fuzz") testing of parsers and converters (dev-only).
proptest = "1"
# Statistical benchmarking of the hot paths (dev-only). `harness = false` on each
# [[bench]]; see benches/ and spec/test/index.md.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Golden-file ("snapshot") testing for tests/snapshots.rs (dev-only); see
# spec/test/index.md's "Snapshot" layer.
insta = "1"
# Generates the man page from the real `Cli` clap definition (T307,
# tasks.md), via examples/generate_man.rs (dev-only).
clap_mangen = "0.3.3"

