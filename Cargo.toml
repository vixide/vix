# One lint policy for every crate and every target -- libs, bins, tests, benches,
# examples and build scripts (T599). Members opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
redundant_clone = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

# `lto = "thin"`, not `true` (fat LTO) -- found and fixed 2026-09-19 as the
# real root cause of a bug that looked, for a long time, like a translation
# or data problem: a handful of `vix-i18n` catalog entries (confirmed:
# `ui.theme_editor_title`, all 15 `ui.theme_slot_*`, `ui.theme_editor_hint`,
# `menu.item.edit.structural_replace(_workspace)`, `menu.item.view.
# theme_edit` -- there may be others never manually spot-checked) rendered
# as their own raw i18n key instead of translated text, but *only* in a
# `[profile.release]`-built (fat-LTO) binary actually run -- never in
# `cargo test`, never in a direct `TestBackend` render, and confirmed (via
# `cargo expand` and a standalone `serde_saphyr` parse of the real YAML)
# that the source, the parse, and the generated Rust are all correct. Root
# cause: `vix-i18n`'s `i18n!` macro (see its own `[profile.dev.package.
# vix-i18n]` comment below) expands to one function doing ~2500 sequential
# `HashMap::insert` calls per locale -- exactly the shape of code most
# likely to hit a real LLVM fat-LTO codegen bug, and empirically: `lto =
# false` fixed it, and so does `lto = "thin"` (confirmed with the exact
# same reproduction, multiple runs, after this same finding), while `lto =
# true` reproduces it deterministically every time. `[profile.dist]` — the
# profile actual releases build with — already used `"thin"`, so shipped
# releases were very likely never affected; only a plain `cargo build
# --release` (this profile) was. No upstream rust-i18n/LLVM bug report
# filed yet — that's the natural next step for whoever has time, with this
# as a real, minimal-ish reproduction to hand a bug tracker.
[profile.release]
lto = "thin"
strip = true
opt-level = "z"

# The minimal release variant (`release-minimal.yml`), built for a reduced
# security surface (spec/cargo-features, T595); it is not used by dist or the
# default release.
# - `panic = "abort"`: a panic ends the process instead of unwinding, so no
#   code keeps running on state a panic left half-updated, and no unwinding
#   tables or `catch_unwind` paths ship.
# - `lto = "fat"` + `codegen-units = 1`: whole-program dead-code elimination, so
#   unreachable dependency code (e.g. spawn paths no feature calls) is dropped
#   from the binary rather than merely never called.
# Smaller size is a side effect, not the goal.
[profile.minimal]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# `cargo bench` otherwise inherits `[profile.release]`: `opt-level = "z"`
# optimizes for binary size, not speed, so the numbers wouldn't represent real
# hot-path performance, and workspace-wide `lto = true` makes the final link
# painfully slow for a benchmark someone reruns often. Speed-optimize, skip LTO.
[profile.bench]
opt-level = 3
lto = false
strip = false

# GitLab's shared runner exhausts disk mid-link building the workspace's test
# binary (T010, tasks.md): `cargo test --workspace` covers 105+ crates worth
# of debug-mode code, and the link is dominated by *debug info* pulled in
# from a handful of heavy dependencies (tokio/sqlx/tree-sitter/image), not by
# the code size itself. Line-tables-only debug info drops the bulk of that
# without giving up panic backtraces — `RUST_BACKTRACE=1` still resolves file
# and line, just not full variable/type info. Cheaper than a bigger runner
# tier or splitting the test binary per crate (also on tasks.md's list, tried
# only if this alone isn't enough).
[profile.test]
debug = 1

# `vix-i18n`'s `i18n!` macro (T148(b), locales/*.yml at ~100% core-locale
# coverage) expands to one function that sequentially `.insert()`s every
# (key, locale) pair into a `HashMap` — tens of thousands of statements in a
# single unoptimized frame overflows the default 8 MiB thread stack the
# first time it runs (`cargo test`/a debug `cargo run`; a release build does
# not stack-overflow here — LLVM's optimizer collapses the frame). Building
# just this one crate at a real optimization level (still debug elsewhere,
# so iteration stays fast) is enough headroom without raising
# `RUST_MIN_STACK` globally or shrinking the catalog. This same giant
# function turned out to have a *second*, much subtler problem under fat
# LTO specifically — see `[profile.release]`'s own comment below for that
# one; the two are easy to conflate but are different bugs with different
# fixes (this one's about stack size, that one's a suspected LLVM
# miscompilation).
[profile.dev.package.vix-i18n]
opt-level = 2
