# Supply-chain policy for the Vix workspace (tasks.md T003).
#
# Checked by `cargo deny --workspace --all-features check`, which runs in CI on
# every push and pull request and weekly on a schedule (see spec/ci/index.md).
# Four checks: advisories, licenses, bans, sources.

[advisories]
# An unpatched RUSTSEC advisory fails the build. When one has no fix yet, add
# its id here with a dated note rather than lowering the bar globally.
yanked = "deny"
ignore = [
    # 2026-11-09: the SQLite bundled by `libsqlite3-sys` < 0.39.0 (SQLite
    # < 3.54.0) can expose stale memory when a crafted database is opened
    # with a crafted `-wal` file (CVE-2026-119375). Vix reaches it only
    # through the DB workbench's SQLite driver:
    #   vix-db -> sqlx 0.9.0 -> sqlx-sqlite 0.9.0 -> libsqlite3-sys 0.37.0
    # and sqlx-sqlite 0.9.0, the latest release, pins `<0.38.0`, so no
    # released sqlx can take the fix. The attack is local: it needs the user
    # to open a hostile database file pair in the workbench. Remove this
    # entry as soon as an sqlx release allows libsqlite3-sys >= 0.39.0.
    "RUSTSEC-2026-0459",
    # 2026-09-02: `smartstring` is unmaintained (no vulnerability; repo
    # archived 2026-05-03). It's a mandatory, non-optional dependency of
    # `rhai` (crates/vix-script's scripting engine, tasks.md T102) — not
    # behind any of rhai's 40 feature flags:
    #   rhai -> smartstring
    # The only ways out are upstream (rhai dropping/replacing smartstring)
    # or dropping user scripting. Revisit when rhai moves off it.
    "RUSTSEC-2026-0249",
    # 2026-10-29: four "unmaintained" notices (no vulnerability), all reached
    # only through the Cowork CRDT, `loro` (T690, spec/cowork; chosen over
    # automerge/yrs/diamond-types for stable cursors, text-delta events and
    # per-peer undo). `loro` is a dependency of `vix-cowork` alone, which is
    # compiled only with the `cowork` feature:
    #   loro -> loro-internal -> im -> bitmaps, sized-chunks   (0247, 0248, 0251)
    #   loro -> loro-internal -> postcard -> heapless -> atomic-polyfill (0089;
    #     used only on targets without native atomics)
    # The ways out are upstream (loro replacing `im`/updating `postcard`) or
    # dropping Cowork. Revisit when loro moves.
    "RUSTSEC-2023-0089",
    "RUSTSEC-2026-0247",
    "RUSTSEC-2026-0248",
    "RUSTSEC-2026-0251",
]

[licenses]
# Vix's source is offered under "Apache-2.0 OR BSD-3-Clause OR MIT OR
# GPL-2.0-only OR GPL-3.0-only" (workspace.package.license); each distributed
# binary declares the subset its linked crates allow (T648, spec/license,
# scripts/check-binary-licenses -- Apache-2.0-only crates rule out GPLv2). A dependency whose terms are more
# restrictive than the weakest of those takes that choice away from anyone who
# ships a build, so the allowance below is permissive licenses only, plus
# MPL-2.0, whose copyleft is per-file and does not reach the linking crate.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "X11",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions are allowed but visible: they are how a vulnerable
# transitive copy survives an upgrade of its sibling.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
