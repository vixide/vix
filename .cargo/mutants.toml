# cargo-mutants settings (T606). Only list genuinely *equivalent* mutants here
# -- ones that cannot change observable behavior -- never a mutant a test could kill.

# The workspace's `[profile.mutants]`: the test profile without debug information or incremental state.
profile = "mutants"

exclude_re = [
    # `selected < scroll` -> `<=`: at selected == scroll both branches yield `scroll`.
    "vix-list-state/src/lib.rs.*replace < with <= in ensure_visible",
    # `wlen > width` -> `>=`: a word exactly `width` long hard-breaks into one
    # full chunk, the same line the plain path would start for it.
    "vix-greedy-wrap/src/lib.rs:33:17: replace > with >= in wrap_line",
    # vix-textops (line:col pinned where the function has another mutant of
    # the same shape that a test does kill):
    # `c - b'A'` -> `+`: 'A' + 'A' is 130 = 5 * 26, so the letter is the same mod
    # 26, and 'Z' + 'A' + 13 = 168 still fits in a u8.
    "vix-textops/src/lib.rs:55:43: replace - with \\+ in rot13",
    # Scanning from `i * 1` instead of `i + 1`: chars[i] is a `.`/`!`/`?`, which
    # the scan skips anyway.
    "vix-textops/src/lib.rs:188:36: replace \\+ with \\* in sentence_starts",
    # `s > cursor` -> `>=`: a unit with s == cursor already matched the first search.
    "vix-textops/src/lib.rs:216:55: replace > with >= in transpose_units_at",
    "vix-textops/src/lib.rs:418:55: replace > with >= in delete_unit_at",
    "vix-textops/src/lib.rs:644:52: replace > with >= in wrap_paragraph_at",
    # Dropping either neighbor test leaves only the last (or first) blank of a
    # run unmarked as a break; it then sits at a group's edge and is trimmed.
    "vix-textops/src/lib.rs:336:29: replace > with < in section_units",
    "vix-textops/src/lib.rs:336:64: replace < with > in section_units",
    # `s < e` -> `<=`: an empty word matches no toggle pair.
    "vix-textops/src/lib.rs:694:10: replace < with <= in smart_toggle_at",
    # `lines.len() > 1` -> `>=`: for "" both paths return ("", clean report).
    "vix-textops/src/cleanup.rs:44:87: replace > with >= in cleanup",
    # `strong_rtl` -> true only skips the all-LTR fast path; BidiInfo then
    # gives the identity order for all-LTR text anyway.
    "vix-locale-model/src/lib.rs:204:5: replace strong_rtl -> bool with true",
    # Both pickers read a bundled TSV (1,000+ entities, 100+ colors) and no
    # constructor takes another table, so the list is never empty.
    "vix-html-character-picker/src/lib.rs:105:9: replace Panel::is_empty -> bool with false",
    "vix-x11-color-picker/src/lib.rs:112:9: replace Panel::is_empty -> bool with false",
]
