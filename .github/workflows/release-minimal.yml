# The minimal release variant (T594, spec/cargo-features): `vix` built with
# `--no-default-features`, i.e. none of the capability features (no SQL/DB,
# image preview, scripting, terminal, HTTP client, AI, Git or Jujutsu) and no
# Tree-sitter grammars, so it is a small binary that links no TLS stack and makes
# no network connections or `git` calls.
#
# It is deliberately NOT part of the dist-generated release.yml: dist builds one
# app per package, and every installer (Homebrew, npm, MSI, shell, PowerShell)
# assumes one binary per target. So the minimal variant ships as plain archives
# attached to the same GitHub Release, with a SHA-256 each, and no installers.
#
# Same tag trigger as release.yml. Because the Release is created by that other
# workflow, the upload job waits for it to appear.
name: Release (minimal)
permissions:
  contents: write

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: tar.gz }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "AR_x86_64-unknown-linux-musl=ar" >> "$GITHUB_ENV"
      - name: build (no default features)
        run: cargo build --profile minimal --locked -p vix --no-default-features --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="vix-minimal-${{ matrix.target }}"
          mkdir "$name"
          bin=vix
          if [ "${{ matrix.ext }}" = zip ]; then bin=vix.exe; fi
          cp "target/${{ matrix.target }}/minimal/$bin" "$name/"
          cp README.md LICENSE CHANGELOG.md man/vix.1 "$name/"
          if [ "${{ matrix.ext }}" = zip ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.${{ matrix.ext }}" > "$name.${{ matrix.ext }}.sha256"
          else
            shasum -a 256 "$name.${{ matrix.ext }}" > "$name.${{ matrix.ext }}.sha256"
          fi
          echo "built $name for $tag"
      - uses: actions/upload-artifact@v7
        with:
          name: minimal-${{ matrix.target }}
          path: |
            vix-minimal-${{ matrix.target }}.${{ matrix.ext }}
            vix-minimal-${{ matrix.target }}.${{ matrix.ext }}.sha256

  attach:
    name: attach to the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: minimal-*
          path: minimal
          merge-multiple: true
      - name: wait for the Release, then attach
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # release.yml creates the Release after its own (longer) builds finish.
          for i in $(seq 1 90); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" minimal/* --clobber
              exit 0
            fi
            sleep 60
          done
          echo "Release $GITHUB_REF_NAME never appeared; minimal archives not attached" >&2
          exit 1
