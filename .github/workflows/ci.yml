# Continuous integration for GitHub (github.com/vixide/vix).
#
# This is the CI-parity gate that `scripts/check` runs locally: rustfmt,
# build, Clippy at the pedantic level with warnings denied, and the full test
# suite. Vix is mirrored to three forges, so the same gate exists three times:
#
#   GitHub    .github/workflows/ci.yml   (this file)
#   GitLab    .gitlab-ci.yml
#   Codeberg  .forgejo/workflows/ci.yml
#
# The commands live in scripts/ci (T767); keep the forge glue in step — see spec/ci/index.md. Releases live in
# .github/workflows/release.yml (generated by `dist`).
#
# T762 (spec/local-ci): hosted CI is slim on purpose, because the local
# `scripts/check` is the authoritative gate. A push to main or a pull request
# runs ONE Linux job (`check`: fmt, clippy, test, ...) plus the docs checks;
# a docs-only change skips the Rust job. The expensive jobs (macOS/Windows
# test matrix, feature combinations, semver, offline tests, coverage, MSRV,
# binary size) run on a weekly schedule, on version tags and on demand
# (`workflow_dispatch`) instead. Nothing was dropped, only moved.

name: CI

on:
  push:
    branches: [main]
    tags: ['**[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  schedule:
    # Weekly, Tuesday 05:00 UTC: the full set of moved jobs.
    - cron: "0 5 * * 2"
  workflow_dispatch:

# Cancel a superseded run on the same branch/PR instead of paying for both.
concurrency:
  # A scheduled run shares the default branch's ref; keep it from cancelling
  # (or being cancelled by) a push to main.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Backtraces make a failing test in CI actionable without a re-run.
  RUST_BACKTRACE: 1

jobs:
  # Decide what this run needs. `full` is true for the schedule, a version tag
  # and a manual dispatch: those run every job. `rust` is false only for a
  # push or PR that touched nothing but documentation, so the Rust jobs are
  # skipped while the docs checks (docs-links, docs-check, docs-build) still
  # run. Anything this cannot diff (a new branch, a force-push) counts as Rust.
  plan:
    name: plan (what to run)
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          full=false
          case "$EVENT" in
            schedule|workflow_dispatch) full=true ;;
          esac
          case "$REF" in refs/tags/*) full=true ;; esac
          rust=true
          if [ "$full" = false ]; then
            base="$BASE_PR"
            [ -n "$base" ] || base="$BASE_PUSH"
            if [ -n "$base" ] && ! echo "$base" | grep -Eq '^0+$' \
               && git cat-file -e "$base^{commit}" 2>/dev/null; then
              # Docs-only: every changed file is prose or lives under docs/,
              # spec/ or agents/ -- except the generated reference pages and
              # the man page, which the Rust job regenerates and diffs.
              rustfiles=$(git diff --name-only "$base" HEAD \
                | grep -Ev '^(docs|spec|agents)/|\.md$' || true)
              generated=$(git diff --name-only "$base" HEAD \
                | grep -E '^(docs/reference/|tui/man/)' || true)
              if [ -z "$rustfiles" ] && [ -z "$generated" ]; then
                rust=false
              fi
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "full=$full rust=$rust"

  # The one Linux job on every push and pull request (T762): format, lint,
  # build, test, rustdoc, generated references and the binary-license check,
  # all platform-independent findings run once on Linux. Skipped for a
  # docs-only change; always runs on the full schedule/tag runs.
  check:
    name: fmt + clippy + test (linux)
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # T767: the command list lives in scripts/ci (the one CI entrypoint), not
      # here. `check` is fmt, build, clippy, test, headless examples, rustdoc,
      # the generated references and the binary-license check, in that order.
      # T604: nextest on Linux only (per-test process spawn is cheap there; on
      # macOS XProtect scans each spawn and it measured ~2x slower); scripts/ci
      # test uses it when installed, so install it first.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: scripts/ci check
        run: scripts/ci check

  # T767 (spec/local-ci): the signed gate attestation (T761) for the pushed
  # tip. Needs only git and OpenSSH. The trust root is the repository secret
  # VIX_ALLOWED_SIGNERS (the allowed-signers file's text), never a file from
  # the pushed tree. Advisory until the repository variable
  # VIX_VERIFY_REQUIRED is set to 1. Push events only: a pull request's merge
  # commit has a tree nobody attested.
  verify:
    name: gate attestation (verify)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The notes ref is fetched with the checkout's credentials.
          persist-credentials: true
      - name: scripts/ci verify
        env:
          VIX_ALLOWED_SIGNERS_DATA: ${{ secrets.VIX_ALLOWED_SIGNERS }}
          VIX_VERIFY_REQUIRED: ${{ vars.VIX_VERIFY_REQUIRED }}
          VIX_CI_SHA: ${{ github.sha }}
        run: scripts/ci verify

  # The specs are living documentation, so they are gated like code: broken
  # links, a crate with no spec, a crate missing from the crate map, or a
  # README.md that has drifted from its index.md twin all fail here.
  # Mirrors `scripts/check`. See spec/test/index.md. Runs on every push and
  # PR, including docs-only ones.
  # check-docs also spell-checks the markdown with CSpell; install the
  # pinned release (CSPELL_VERSION in the script) and make it required.
  docs-check:
    name: docs (check-docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: install CSpell
        run: npm install -g cspell@10.4.0
      - name: scripts/check-docs
        env:
          VIX_REQUIRE_CSPELL: "1"
        run: scripts/ci docs-check

  # T770: release.yml is generated by dist, and its `plan` job refuses to run
  # when the file has drifted, but only after a tag is pushed. Catch that here,
  # with the dist version the release itself would install. GitHub only:
  # release.yml exists only here. See spec/ci/index.md.
  dist-workflow:
    name: release.yml matches dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install the pinned dist
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          test -n "$version"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
      - name: dist generate --check
        run: dist generate --mode ci --check

  # T573 (tasks.md): the suite must make no network calls -- distro builders
  # run `cargo test` in offline sandboxes. Build with the network, then run
  # the tests in a fresh network namespace that has only loopback (the AI
  # and HTTP smoke tests talk to a local listener), as the unprivileged
  # user so permission-based tests behave as they do for everyone else.
  offline-test:
    name: tests without network (T573)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build tests
        run: cargo test --workspace --no-run
      - name: run tests in an empty network namespace
        run: |
          sudo unshare -n -- sh -c "ip link set lo up && exec sudo -u $USER env PATH=$PATH HOME=$HOME GIT_TERMINAL_PROMPT=0 cargo test --workspace --offline"

  # T587: a build with every capability off must compile, lint and pass its own
  # tests, and each feature must build on its own. Tests that assume the whole
  # product are gated on `feature = "full"`; see spec/cargo-features/index.md.
  feature-combos:
    name: feature combinations (T587)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-hack
        run: cargo install cargo-hack --locked
      # T767: clippy and test with no default features, every grammar's
      # textobjects, the opt-in cowork and jupyter features, and each feature
      # alone -- all in scripts/ci feature-combos.
      - name: scripts/ci feature-combos
        run: scripts/ci feature-combos

  # T602: every crate is published to crates.io in lockstep, so a breaking
  # public-API change must come with a major version bump. Compares each
  # crate's API with the latest version published on crates.io; the release
  # type is inferred from the version in Cargo.toml (an unchanged version is
  # treated as a patch release, so any break fails until the version is bumped).
  # Needs cargo-semver-checks >= 0.51 for the current rustdoc JSON format
  # (0.47 only reads up to v57; rustc 1.99 writes v61).
  semver:
    name: semver (cargo-semver-checks)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-semver-checks
        run: cargo install cargo-semver-checks --version 0.51.0 --locked
      - name: cargo semver-checks
        # A crate with no crates.io release yet has no baseline to compare
        # against: add `--exclude <crate>` until its first publish.
        run: cargo semver-checks --workspace --exclude vix-cowork --exclude vix-cowork-net --exclude vix-encoding --exclude vix-fhir --exclude vix-git-graph --exclude vix-hl7 --exclude vix-im --exclude vix-im-irc --exclude vix-im-panel --exclude vix-oci --exclude vix-oci-panel --exclude vix-todo-tree --exclude vix-choice-list --exclude vix-mcp-server --exclude vix-jupyter --exclude vix-jupyter-core --exclude vix-undo-tree-panel --exclude vix-review --exclude vix-project-env --exclude vix-acp

  # Broken-link gate for the docs (T002, spec/ci/index.md). The offline pass
  # only walks local files (deterministic, no network) and is part of the
  # gate; the external pass hits real URLs, which go stale independently of
  # any change in this tree, so it reports without failing the build.
  docs-links:
    name: docs (lychee)
    runs-on: ubuntu-latest
    env:
      LYCHEE_VERSION: "0.24.2"
      LYCHEE_SHA256: "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Cached by version+checksum (T010, tasks.md): once a given
      # LYCHEE_VERSION/LYCHEE_SHA256 pair has been fetched and verified once,
      # every later run restores the binary straight from the cache instead
      # of hitting GitHub Releases again — a version or checksum bump changes
      # the key, so a stale binary is never restored. The install step below
      # still only runs on a cache miss.
      - name: Cache lychee binary
        id: lychee-cache
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/lychee
          key: lychee-${{ env.LYCHEE_VERSION }}-${{ env.LYCHEE_SHA256 }}
      # Pinned and checksummed, like cargo-deny in security.yml: a docs gate
      # should not itself install an unverified binary, and nothing here
      # needs compiling. `--retry` covers a transient connection reset from
      # GitHub Releases (observed 2026-09-03) on a cache miss.
      - name: Install lychee (pinned, checksummed)
        if: steps.lychee-cache.outputs.cache-hit != 'true'
        run: |
          tarball="lychee-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors -sSfL -o "$tarball" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v$LYCHEE_VERSION/$tarball"
          echo "$LYCHEE_SHA256  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" --strip-components=1 -C /usr/local/bin \
            "lychee-x86_64-unknown-linux-musl/lychee"
          chmod +x /usr/local/bin/lychee
      - name: lychee (offline links)
        run: scripts/ci docs-links
      # CHANGELOG.md is included here (unlike the offline pass): its historical
      # entries pin file paths that may no longer exist (fine, exempt above),
      # but any external URL it names should still resolve.
      - name: lychee (external links, advisory)
        continue-on-error: true
        run: scripts/ci docs-links-external

  # Build and test on the other platforms Vix ships on (Linux is the per-push
  # `check` job). Weekly/tag/dispatch only (T762). Windows joined the matrix
  # for T547 (tasks.md): the release workflow's cross-builds only compile for
  # distribution (via `dist`, on version tags) -- they never run `cargo test`
  # or exercise runtime behavior, so they can't catch an OS-specific runtime
  # bug (e.g. shelling out via a hardcoded POSIX `sh`). Most of the suite is
  # genuinely terminal-independent and this roughly doubles CI wall time for
  # that part, but it's the only way to get real signal on the part that
  # isn't.
  test:
    name: build + test (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the per-push `check` job; this adds the other two.
        os: [macos-latest, windows-latest]
    # windows-latest's default shell is PowerShell, but the headless-examples
    # step below uses POSIX redirection (`>/dev/null`); Git-Bash is preinstalled
    # on the windows-latest runner image, so this just picks it consistently
    # on every platform instead of only overriding the one step that needs it.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: cargo build --all-targets
        run: cargo build --workspace --all-targets
      # T604: nextest on Linux only. Per-test process spawn is cheap there; on
      # macOS (XProtect scans each spawn) it measured ~2x slower than cargo test.
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: nextest
      - name: cargo test
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo nextest run --workspace --profile ci
            cargo test --workspace --doc
          else
            cargo test --workspace --no-fail-fast
          fi
      # T505 (tasks.md): every example must keep running, not just compiling
      # (--all-targets above already builds them all, examples included).
      # Only the headless ones -- no real terminal, no external service, no
      # language server/vhs/etc. to install -- run here; each is given real
      # arguments against files already in this checkout.
      - name: run headless examples (T505)
        run: |
          cargo run --example list_commands >/dev/null
          cargo run --example headless_edit >/dev/null
          cargo run --example render_frame -- index.md >/dev/null
          cargo run --example textops_pipeline -- index.md >/dev/null
          cargo run --example query_search -- tui/examples/demo-workspace TODO >/dev/null

  # Advisory coverage (T607): never gates a merge. Uploads a Cobertura
  # report that Vix's own coverage gutter (Tools → Load Coverage File…) reads.
  coverage:
    name: coverage (advisory)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: measure coverage
        run: cargo llvm-cov --workspace --cobertura --output-path cobertura.xml
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: cobertura.xml

  # The toolchain floor promised by `rust-version` in Cargo.toml. A `check` is
  # enough: if the crate graph compiles on the floor, the claim holds.
  msrv:
    name: msrv (${{ matrix.rust }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep in sync with `workspace.package.rust-version` in Cargo.toml.
        # The floor is current stable minus two; see spec/rust-msrv-n-minus-2.
        rust: ["1.97"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.rust }}
      - name: cargo check --all-targets
        run: cargo check --workspace --all-targets

  # T008 (tasks.md): track the shipped binary's size so growth is visible
  # rather than discovered later. `--release` (default features) is what a
  # user's `cargo install`/download actually gets — the whole reason
  # `[profile.release]` sets `strip = true`.
  #
  # "Recorded": the size of every push to `main` is saved under a
  # `binary-size-main-<sha>`-prefixed cache entry. A cache key can't be
  # overwritten, so `restore-keys` prefix matching is used to fetch the most
  # recent one instead — the same trick `Swatinem/rust-cache` uses internally.
  # A PR run only *reads* that prefix (never writes under it), so a PR's
  # speculative size can never become the next baseline.
  #
  # "Comments... per PR": a sticky comment (found and edited by its HTML
  # marker, not reposted every push) with the current size and the delta
  # against that baseline. Best-effort (`continue-on-error`): a PR from a
  # fork gets a read-only `GITHUB_TOKEN` regardless of this job's declared
  # permissions — a hard GitHub restriction, not a bug here — so the comment
  # step simply no-ops rather than failing the job. `pull_request_target`
  # would avoid that, but runs workflow code with base-repo permissions
  # against the PR's own (untrusted) content, which is not a trade worth
  # making just for a size comment.
  binary-size:
    name: binary size (release)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: binary-size
      # Read-only: restores the newest `binary-size-main-*` entry (if any)
      # into `previous-binary-size.txt`. The exact `key` here is never meant
      # to hit — `restore-keys` is what does the work — so it is deliberately
      # not a real cache entry's name.
      - name: Restore the last recorded size from main
        uses: actions/cache/restore@v6
        with:
          path: previous-binary-size.txt
          key: binary-size-main-unused
          restore-keys: |
            binary-size-main-
      - name: cargo build --release
        run: cargo build --release
      - name: Measure the stripped binary size
        id: size
        run: |
          bytes=$(stat -c%s target/release/vix)
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
      # Only main writes the next baseline — never a PR run, speculative or
      # not, and never for a manual workflow_dispatch off some other branch.
      - name: Save this size as the new main baseline
        if: github.ref == 'refs/heads/main'
        run: echo "${{ steps.size.outputs.bytes }}" > previous-binary-size.txt
      - name: Record the new baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: previous-binary-size.txt
          key: binary-size-main-${{ github.sha }}
      - name: Comment the size (and delta) on the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const bytes = ${{ steps.size.outputs.bytes }};
            const fmt = (n) => n.toLocaleString('en-US');
            const mb = (n) => (n / (1024 * 1024)).toFixed(2);
            let deltaLine = '_No baseline recorded yet from `main`._';
            if (fs.existsSync('previous-binary-size.txt')) {
              const prev = parseInt(fs.readFileSync('previous-binary-size.txt', 'utf8').trim(), 10);
              const delta = bytes - prev;
              const pct = ((delta / prev) * 100).toFixed(2);
              const sign = delta >= 0 ? '+' : '';
              deltaLine = `vs \`main\`: **${sign}${fmt(delta)} bytes** (${sign}${pct}%) — was ${fmt(prev)} bytes`;
            }
            const marker = '<!-- vix-binary-size-report -->';
            const body = `${marker}\n### 📦 Binary size (release, default features)\n\n**${fmt(bytes)} bytes** (${mb(bytes)} MB)\n\n${deltaLine}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # mdBook site (T301, tasks.md): builds docs/ (via book.toml's `tui/src`) into
  # a static site and deploys it to GitHub Pages. GitHub-only — GitLab Pages
  # and Codeberg Pages are separate products with their own config, and this
  # repo doesn't publish through them, so there is no GitLab/Codeberg
  # equivalent of this job (unlike the gate above, which all three mirror).
  # Runs on every push/PR (`mdbook build` catching a broken SUMMARY.md early
  # matters more than saving CI minutes here); deploy is gated to `main`.
  docs-build:
    name: docs (mdbook build)
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.3"
      MDBOOK_SHA256: "dfb86d8e20a3fed91bf549aa450b9d7f46a275b700292e050cdfd3171732e7fd"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Same pinned-version-plus-checksum pattern as lychee (docs-links, this
      # file) and cargo-deny (security.yml): a docs gate should not itself
      # install an unverified binary.
      - name: Cache mdbook binary
        id: mdbook-cache
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/mdbook
          key: mdbook-${{ env.MDBOOK_VERSION }}-${{ env.MDBOOK_SHA256 }}
      - name: Install mdbook (pinned, checksummed)
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        run: |
          tarball="mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors -sSfL -o "$tarball" \
            "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/$tarball"
          echo "$MDBOOK_SHA256  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C /usr/local/bin mdbook
          chmod +x /usr/local/bin/mdbook
      - name: mdbook build
        run: mdbook build
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: book

  docs-deploy:
    name: docs (deploy to GitHub Pages)
    needs: docs-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
