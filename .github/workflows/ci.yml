# Continuous integration for GitHub (github.com/vixide/vix).
#
# This is the CI-parity gate that `scripts/check` runs locally: rustfmt,
# build, Clippy at the pedantic level with warnings denied, and the full test
# suite. Vix is mirrored to three forges, so the same gate exists three times:
#
#   GitHub    .github/workflows/ci.yml   (this file)
#   GitLab    .gitlab-ci.yml
#   Codeberg  .forgejo/workflows/ci.yml
#
# Keep the four in step — see spec/ci/index.md. Releases live in
# .github/workflows/release.yml (generated by `dist`).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on the same branch/PR instead of paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Backtraces make a failing test in CI actionable without a re-run.
  RUST_BACKTRACE: 1

jobs:
  # Format, lint, and docs. Single platform: these findings are
  # platform-independent, so running them on the matrix would only duplicate
  # failures.
  lint:
    name: fmt + clippy + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy (pedantic, -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo doc (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      # The specs are living documentation, so they are gated like code: broken
      # links, a crate with no spec, a crate missing from the crate map, or a
      # README.md that has drifted from its index.md twin all fail here.
      # Mirrors `scripts/check`. See spec/test/index.md.
      - name: scripts/check-docs
        run: python3 scripts/check-docs

  # Build and test on the platforms Vix ships on. Windows is covered by the
  # release workflow's cross-builds; adding it here would roughly double CI
  # wall time for little extra signal, since the logic is terminal-independent.
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: cargo build --all-targets
        run: cargo build --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace

  # The toolchain floor promised by `rust-version` in Cargo.toml. A `check` is
  # enough: if the crate graph compiles on the floor, the claim holds.
  msrv:
    name: msrv (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep in sync with `workspace.package.rust-version` in Cargo.toml.
        # The floor is current stable minus two; see spec/rust-msrv-n-minus-2.
        rust: ["1.96"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.rust }}
      - name: cargo check --all-targets
        run: cargo check --workspace --all-targets
