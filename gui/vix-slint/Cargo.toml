[package]
name = "vix-slint"
version.workspace = true
edition.workspace = true
# Slint is used under the GPL-3.0-only (see `slint` below), so a vix-slint
# binary can be distributed only under the GPLv3, not under Vix's other
# license choices.
license = "GPL-3.0-only"
publish.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Vix desktop GUI on Slint: the full Vix App in a native window."

[dependencies]
vix = { workspace = true }
vix-input = { workspace = true }
vix-i18n = { workspace = true }
rust-i18n = { workspace = true }
clap = { workspace = true }
ratatui = { workspace = true }
# Pinned like the other front ends' toolkits, so they are compared at known
# versions. Slint is triple-licensed: GPL-3.0-only, the Slint Royalty-free
# Desktop, Mobile, and Web License, or a commercial license. Vix is offered
# under GPL-3.0-only among its licenses, so it uses Slint under the GPLv3.
#
# `unstable-winit-030` gives the raw winit key event, for Option-as-Meta on
# macOS (Slint's own key event carries only the Option-composed text);
# `unstable-fontique-011` gives Slint's font collection, to find a Nerd Font
# for Vix's icons. Both are safe to use because the version is pinned.
slint = { version = "=1.18.1", features = ["unstable-winit-030", "unstable-fontique-011"] }
# The window's `.slint` markup is compiled at startup by Slint's interpreter
# rather than into Rust by `slint-build`: the generated Rust needs
# `#[allow(unsafe_code)]`, which this workspace's `forbid` rejects. It also
# lets the native menu bar be generated from the Vix menu model as markup.
slint-interpreter = "=1.18.1"
# PNG output for the scripted render smoke test.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# `VIX_GUI_SCREENSHOT=out.png vix-slint` renders the window to a PNG after
# scripted actions/keystrokes and quits (see gui/spec/index.md).
screenshot = ["dep:image"]

[target.'cfg(target_os = "macos")'.dependencies]
# The platform file dialog, for the menu's Open with System Dialog….
rfd = "0.17"

# Release distributions (T645, T647): `brew install vixide/tap/vix-slint`,
# shell and PowerShell installers, an MSI, and archives, built by dist from the
# repo-root dist-workspace.toml (which lists this workspace as `cargo:gui`).
# `publish = false` keeps it off crates.io, so dist must be told to ship it.
# No musl target: a GUI links the system's windowing, GPU and font libraries.
# No npm package: a desktop app is not a Node tool.
[package.metadata.dist]
dist = true
formula = "vix-slint"
installers = ["shell", "powershell", "homebrew", "msi"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# Linux build-time system libraries (the same set as .github/workflows/gui.yml).
[package.metadata.dist.dependencies.apt]
libasound2-dev = "*"
libfontconfig-dev = "*"
libfreetype-dev = "*"
libwayland-dev = "*"
libx11-xcb-dev = "*"
libxkbcommon-x11-dev = "*"
libxcursor-dev = "*"
libxrandr-dev = "*"
libxi-dev = "*"
libvulkan-dev = "*"
libssl-dev = "*"
libzstd-dev = "*"
# OpenGL / EGL for Slint's femtovg renderer.
libgl1-mesa-dev = "*"
libegl-dev = "*"

[package.metadata.wix]
upgrade-guid = "061C9BC7-4CA5-4EC6-A33F-49330ED9EC8E"
path-guid = "9B5F94EA-29F1-405E-9D6F-28F042501290"
license = false
eula = false

[lints]
workspace = true
