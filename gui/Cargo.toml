# The Vix desktop GUIs. A separate workspace on purpose, like `fuzz/`: GUI
# toolkits pull in GPU stacks, windowing and font libraries, so they must
# never be built by `cargo build` / `cargo test --workspace` / clippy at the
# repo root, and the terminal build never links them. See spec/index.md.
#
#   cargo run --release -p vix-gpui [-- FILE…]   # GPUI (GPUI Kit)
#   cargo run --release -p vix-egui [-- FILE…]   # egui (eframe)

[workspace]
resolver = "3"
members = ["vix-gui-common", "vix-gpui", "vix-egui"]

[workspace.package]
version = "1.7.1"
edition = "2024"
license = "Apache-2.0 OR BSD-3-Clause OR MIT OR GPL-2.0-only OR GPL-3.0-only"
publish = false

[workspace.dependencies]
# The whole editor: `App`, `ui::draw`, settings, menus. Each GUI is another
# front end over exactly the App shell the terminal binary uses.
vix = { path = "../tui", package = "vix-tui" }
vix-input = { path = "../crates/vix-input" }
vix-i18n = { path = "../crates/vix-i18n" }
vix-gui-common = { path = "vix-gui-common" }
rust-i18n = "4.2.4"
clap = { version = "4", features = ["derive"] }
# Same version as the root workspace's, so `ui::draw`'s Frame type matches.
ratatui = "0.30"

# Same lint policy as the root workspace's `[workspace.lints]` — a separate
# workspace cannot inherit it, so it is restated here and must be kept in step.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
redundant_clone = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
