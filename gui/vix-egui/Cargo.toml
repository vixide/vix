[package]
name = "vix-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Vix desktop GUI on egui (eframe): the full Vix App in a native window."

[dependencies]
vix = { workspace = true }
vix-input = { workspace = true }
vix-i18n = { workspace = true }
rust-i18n = { workspace = true }
clap = { workspace = true }
ratatui = { workspace = true }
# Pinned like vix-gpui's toolkit, so the two are compared at known versions.
eframe = { version = "=0.37.0", features = ["wgpu"] }
# Font lookup by family name (the same OS font database egui's own system
# fallback uses), so this build draws the same primary font and Nerd Font
# icons as vix-gpui.
fontique = { version = "0.11", default-features = false, features = ["system", "fontconfig-dlopen"] }
# PNG output for the scripted render smoke test.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# `VIX_GUI_SCREENSHOT=out.png vix-egui` renders the window to a PNG after
# scripted actions/keystrokes and quits (see gui/spec/index.md).
screenshot = ["dep:image"]

# egui has no native menu bar; muda supplies one. macOS only: on Windows its
# setup takes a raw window handle through an `unsafe fn`, which this
# workspace forbids, and on Linux it needs a GTK event loop. No default
# features: its default `gtk3` is Linux-only and would pin GTK 3 / glib 0.18
# in Cargo.lock for nothing.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
# The platform file dialog, for the menu's Open with System Dialog….
rfd = "0.17"

# Release distributions (T645): `brew install vixide/tap/vix-egui`, shell and
# PowerShell installers, an MSI, and archives, built by dist from the
# repo-root dist-workspace.toml (which lists this workspace as `cargo:gui`).
# `publish = false` keeps it off crates.io, so dist must be told to ship it.
# No musl target: a GUI links the system's windowing, GPU and font libraries.
# No npm package: a desktop app is not a Node tool.
[package.metadata.dist]
dist = true
formula = "vix-egui"
installers = ["shell", "powershell", "homebrew", "msi"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# Linux build-time system libraries (the same set as .github/workflows/gui.yml).
[package.metadata.dist.dependencies.apt]
libasound2-dev = "*"
libfontconfig-dev = "*"
libfreetype-dev = "*"
libwayland-dev = "*"
libx11-xcb-dev = "*"
libxkbcommon-x11-dev = "*"
libxcursor-dev = "*"
libxrandr-dev = "*"
libxi-dev = "*"
libvulkan-dev = "*"
libssl-dev = "*"
libzstd-dev = "*"

[package.metadata.wix]
upgrade-guid = "540BEBE2-DFA7-43B1-8417-45BE95895F59"
path-guid = "3EC91C67-D4C4-4E15-9D54-8BA6BE3982B3"
license = false
eula = false

[lints]
workspace = true
