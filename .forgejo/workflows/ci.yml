# Continuous integration for Codeberg (codeberg.org/vixide/vix).
#
# Codeberg runs Forgejo Actions ("Codeberg CI"), which reads workflows from
# `.forgejo/workflows/` and is broadly GitHub-Actions compatible. Two
# differences matter here:
#
#   * `runs-on: docker` selects Codeberg's shared runner; its default image is
#     `ghcr.io/catthehacker/ubuntu:act-latest`, a GitHub-runner lookalike with
#     Node (needed by JavaScript actions) but no Rust toolchain, so we install
#     Rust with rustup below.
#   * `uses:` is written as a full URL, because a bare `owner/action` resolves
#     against the instance's default actions host rather than github.com.
#
# This job is the same CI-parity gate `scripts/check` runs locally: rustfmt,
# build, Clippy at the pedantic level with warnings denied, and the full test
# suite. Vix is mirrored to three forges, so the same gate exists three times:
#
#   GitHub    .github/workflows/ci.yml
#   GitLab    .gitlab-ci.yml
#   Codeberg  .forgejo/workflows/ci.yml   (this file)
#
# Keep the four in step — see spec/ci/index.md. Codeberg's shared runners are a
# donated, shared resource, so this is one job that does everything rather than
# several jobs that each recompile the workspace.
#
# T762 (spec/local-ci): slimmed to match GitHub. On push/PR this runs the
# fast gate (fmt, clippy, build, test, examples, doc, generated references,
# docs checks, binary licenses) and skips it for a docs-only change; the slow
# feature-combination step (cargo hack --each-feature and friends) and the
# external-link report run on a weekly schedule, on version tags and on
# demand. Docs-only changes still get the docs checks (the `docs` job).

name: CI

on:
  push:
    branches: [main]
    tags: ['**[0-9]+.[0-9]+.[0-9]+*']
    paths-ignore:
      - "docs/**"
      - "spec/**"
      - "agents/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "spec/**"
      - "agents/**"
      - "**/*.md"
  schedule:
    # Weekly, Tuesday 05:00 UTC.
    - cron: "0 5 * * 2"
  workflow_dispatch:

# Cancel a superseded run on the same ref (the scheduled run has its own group).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep in sync with `workspace.package.rust-version` in Cargo.toml.
  RUST_TOOLCHAIN: "1.97.1"
  # Keep in sync with the same two variables in .github/workflows/ci.yml and
  # .gitlab-ci.yml.
  LYCHEE_VERSION: "0.24.2"
  LYCHEE_SHA256: "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5"

jobs:
  check:
    name: fmt + build + clippy + test
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install build dependencies
        # Tree-sitter grammars, mimalloc, and image codecs are vendored C, so a
        # working C toolchain is required.
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential pkg-config

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal \
                --default-toolchain "$RUST_TOOLCHAIN" \
                --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and build directory
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo build --all-targets
        run: cargo build --workspace --all-targets

      - name: cargo clippy (pedantic, -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # T587: every Cargo feature combination must keep compiling and passing
      # its own tests (spec/cargo-features/index.md).
      # Slow (cargo hack builds every feature alone): schedule, tags, dispatch.
      - name: feature combinations (T587)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          cargo install cargo-hack --locked
          cargo clippy -p vix-tui --no-default-features --all-targets -- -D warnings
          cargo test -p vix-tui --no-default-features
          cargo test -p vix-editor-core --features syntax-all --lib textobject
          cargo clippy -p vix-tui --features cowork --all-targets -- -D warnings
          cargo test -p vix-tui --features cowork --lib cowork
          cargo clippy -p vix-tui --features jupyter --all-targets -- -D warnings
          cargo test -p vix-tui --features jupyter --lib jupyter
          cargo test -p vix-tui --features jupyter --test jupyter
          cargo hack check -p vix-tui --each-feature --no-dev-deps

      # T505 (tasks.md): every example must keep running, not just compiling
      # (--all-targets above already builds them all). Only the headless
      # ones run here, each given real arguments against files in this
      # checkout.
      - name: run headless examples (T505)
        run: |
          cargo run --example list_commands >/dev/null
          cargo run --example headless_edit >/dev/null
          cargo run --example render_frame -- index.md >/dev/null
          cargo run --example textops_pipeline -- index.md >/dev/null
          cargo run --example query_search -- tui/examples/demo-workspace TODO >/dev/null

      - name: cargo doc (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # T305 (tasks.md): docs/reference/ (actions, settings, keybindings) is
      # generated from the real data, not hand-maintained — regenerate and
      # diff, so a stale reference page fails the same way a broken link
      # does. Mirrors `scripts/check`.
      - name: generated reference docs current? (T305)
        run: |
          cargo run --example list_commands -- --write >/dev/null
          git diff --exit-code -- docs/reference/

      # T307 (tasks.md): tui/man/vix.1 is generated from the real Cli definition
      # (vix::cli::Cli, shared with tui/src/main.rs) -- regenerate and diff, same
      # pattern as docs/reference/ above.
      - name: man page current? (T307)
        run: |
          cargo run --example generate_man >/dev/null
          git diff --exit-code -- tui/man/

      # Each distributed binary declares exactly the licenses its linked
      # dependencies allow (T648, spec/license). Mirrors `scripts/check`.
      - name: scripts/check-binary-licenses
        run: python3 scripts/check-binary-licenses
