[workspace]
# The terminal app (vix-tui) and the desktop GUIs (vix-gpui, vix-egui) — the
# GUIs are their own Cargo workspace (gui/), released from the same tag (T645).
members = ["cargo:.", "cargo:gui"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# A pre-`dist build` step injected into every build job — see
# .github/dist/build-setup.yml. Deliberately NOT under .github/workflows/:
# GitHub treats every .yml there as its own standalone workflow, and this
# fragment has no `on:`/`jobs:` of its own (dist only splices its `steps:`
# into release.yml) — it would run and fail on every push.
github-build-setup = "../dist/build-setup.yml"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Build only the packages dist releases (`cargo build -p …`), not
# `--workspace`: the gui workspace also holds vix-gtk4, which isn't released
# (it needs the system GTK 4) and fails to build on the release runners.
precise-builds = true
# Whether to install an updater program
install-updater = false
# A GitHub repo to push Homebrew formulas to
tap = "vixide/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./linux-packages"]
# The Linux-packages job (spec/linux-packages) uploads to the release, so it
# needs contents: write; a called workflow can't raise its caller's.
github-custom-job-permissions = { "linux-packages" = { contents = "write" } }
# A namespace to use when publishing this package to the npm registry
npm-scope = "@vixide"
# Generate a CycloneDX SBOM (bom.xml) alongside the release artifacts, via
# cargo-dist's own cargo-cyclonedx integration (T554, tasks.md) -- for
# downstream consumers doing their own supply-chain compliance.
cargo-cyclonedx = true
# The man page (T307) is bundled via `[package.metadata.dist] include` in
# tui/Cargo.toml, next to the package it documents (T643).
